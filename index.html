// Compress an image file to a JPEG dataURL at given max dimension + quality.
// localStorage has a ~5MB total quota — each photo must be <300kb to keep state safe.
async function compressPhoto(file, maxDim = 1280, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Read failed'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Decode failed'));
      img.onload = () => {
        try {
          // Scale down while preserving aspect ratio
          let w = img.naturalWidth, h = img.naturalHeight;
          if (w > maxDim || h > maxDim) {
            if (w >= h) { h = Math.round(h * maxDim / w); w = maxDim; }
            else { w = Math.round(w * maxDim / h); h = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL('image/jpeg', quality);
          resolve(dataUrl);
        } catch (e) { reject(e); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function addPhysiquePhoto(file, note) {
  if (!file) return false;
  // Hard cap: 10MB raw file (we'll compress it heavily)
  if (file.size > 10 * 1024 * 1024) {
    spawnFloat('File too large (>10MB)', '#F2726B');
    return false;
  }
  try {
    let dataUrl = await compressPhoto(file, 1280, 0.72);
    // If still big, try a second pass with smaller dims
    if (dataUrl.length > 350 * 1024) {
      dataUrl = await compressPhoto(file, 960, 0.65);
    }
    if (dataUrl.length > 500 * 1024) {
      dataUrl = await compressPhoto(file, 720, 0.55);
    }
    if (!Array.isArray(S.physiquePhotos)) S.physiquePhotos = [];
    S.physiquePhotos.unshift({
      id: `ph-${Date.now()}${Math.random().toString(36).slice(2,5)}`,
      ts: Date.now(),
      image: dataUrl,
      note: (note || '').trim().slice(0, 80),
    });
    // Hard cap: 60 photos. After that, the oldest auto-drop to protect localStorage.
    if (S.physiquePhotos.length > 60) S.physiquePhotos = S.physiquePhotos.slice(0, 60);
    try {
      persist();
    } catch (e) {
      // Quota exceeded — pop the new photo back off and warn
      S.physiquePhotos.shift();
      spawnFloat('Storage full · delete old photos', '#F2726B');
      return false;
    }
    spawnFloat('Photo logged', '#63D49B');
    return true;
  } catch (e) {
    spawnFloat('Photo error', '#F2726B');
    return false;
  }
}

// Short schedule label for a task: "Daily", "Weekly", "Weekdays", "Mon·Wed·Fri"
function habitScheduleLabel(h) {
  if (h.frequency !== 'daily') return 'Weekly';
  if (!Array.isArray(h.days) || h.days.length === 0 || h.days.length === 7) return 'Daily';
  const short = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const sorted = h.days.slice().sort((a, b) => a - b);
  const key = sorted.join(',');
  if (key === '1,2,3,4,5') return 'Weekdays';
  if (key === '0,6') return 'Weekends';
  return sorted.map(d => short[d]).join('·');
}

// Sore-muscle count shared by Today nudges and the Progress metrics
function countSoreMuscles() {
  const nowTs = Date.now();
  let n = 0;
  if (S.muscleHits && typeof S.muscleHits === 'object') {
    Object.entries(S.muscleHits).forEach(([k, hits]) => {
      if (typeof MUSCLE_GROUPS !== 'undefined' && MUSCLE_GROUPS[k] && MUSCLE_GROUPS[k].parent) return;
      if (!Array.isArray(hits) || hits.length === 0) return;
      if (nowTs - hits[hits.length - 1].ts < 86400000) n += 1;
    });
  }
  return n;
}

  const C = 2 * Math.PI * 15;
  return `<div class="wstrip">${['M','T','W','T','F','S','S'].map((l, i) => {

/* ---- Charts ---- */
function niceScale(max) {
  const step = [1, 2, 5, 10, 20, 25, 50, 100, 150, 200, 250, 500, 1000, 1500, 2000, 2500, 5000, 10000, 20000, 50000].find(v => v * 3 >= max) || Math.ceil(max / 3 / 50000) * 50000;
  return { step, top: step * 3 };
}
function axisNum(v) { return v >= 1000 ? (v / 1000).toFixed(v % 1000 === 0 ? 0 : 1) + 'k' : String(Math.round(v * 10) / 10); }
// vals: numbers (oldest → newest). opts: { zero: start axis at 0 (default true), labels: [..], id }
function lineChartHTML(vals, opts = {}) {
  const W = 300, H = 120;
  if (!vals.length) return `<div class="empty small">Nothing to chart yet.</div>`;
  let lo = 0, hi;
  const max = Math.max(...vals), min = Math.min(...vals);
  if (opts.zero === false) {
    const pad = Math.max((max - min) * 0.25, max * 0.02, 1);
    lo = Math.max(0, Math.floor((min - pad) / 2.5) * 2.5); hi = Math.ceil((max + pad) / 2.5) * 2.5;
  } else hi = niceScale(Math.max(max, 1)).top;
  const range = Math.max(hi - lo, 1e-6);
  const x = i => vals.length === 1 ? W / 2 : (i / (vals.length - 1)) * W;
  const y = v => H - ((v - lo) / range) * H;
  const line = vals.map((v, i) => `${i === 0 ? 'M' : 'L'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const area = vals.length > 1 ? `${line} L${W} ${H} L0 ${H} Z` : '';
  const grid = [0, 1, 2, 3].map(k => `<line x1="0" x2="${W}" y1="${((k / 3) * H).toFixed(1)}" y2="${((k / 3) * H).toFixed(1)}" stroke="rgba(255,255,255,0.06)" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join('');
  const gid = 'lc-' + (opts.id || 'x');
  const labels = opts.labels || [];
  return `
    <div class="chart">
      <div class="chart-y"><span>${axisNum(hi)}</span><span>${axisNum(lo + range * 2 / 3)}</span><span>${axisNum(lo + range / 3)}</span><span>${axisNum(lo)}</span></div>
      <div class="chart-main">
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
          <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff" stop-opacity="0.13"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
          ${grid}
          ${area ? `<path d="${area}" fill="url(#${gid})"/>` : ''}
          <path d="${line}" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
        </svg>
        <i class="chart-dot" style="left:${(x(vals.length - 1) / W * 100).toFixed(2)}%;top:${(y(vals[vals.length - 1]) / H * 100).toFixed(2)}%"></i>
        ${labels.length ? `<div class="chart-x">${labels.map((l, i) => `<span class="${i === labels.length - 1 ? 'now' : ''}">${l}</span>`).join('')}</div>` : ''}
      </div>
    </div>`;
}
function barChartHTML(vals, labels) {
  const { top } = niceScale(Math.max(...vals, 1));
  return `
    <div class="chart">
      <div class="chart-y"><span>${axisNum(top)}</span><span>${axisNum(top * 2 / 3)}</span><span>${axisNum(top / 3)}</span><span>0</span></div>
      <div class="chart-main">
        <div class="bars">${vals.map((v, i) => `<div><i class="${i === vals.length - 1 ? 'now' : ''}" style="height:${v > 0 ? Math.max(2, (v / top) * 100) : 0}%"></i></div>`).join('')}</div>
        <div class="chart-x bars-x">${labels.map((l, i) => `<span class="${i === labels.length - 1 ? 'now' : ''}">${l}</span>`).join('')}</div>
      </div>
    </div>`;
}

// Workout calendar — one square per day, lit on days you trained
function renderActivityCalendar() {
  const WEEKS = 20;
  const today = new Date(); today.setHours(12, 0, 0, 0);
  const start = weekStartOf(today); start.setHours(12); start.setDate(start.getDate() - (WEEKS - 1) * 7);
  const trained = new Set((S.sessions || []).map(x => dayKey(new Date(x.ts))));
  const data = S.dailyXp || {};
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let cells = '', months = '', active = 0, lastMonth = -1;
  for (let w = 0; w < WEEKS; w++) {
    const colStart = new Date(start); colStart.setDate(start.getDate() + w * 7);
    const colEnd = new Date(colStart); colEnd.setDate(colStart.getDate() + 6);
    const m = colEnd.getMonth();
    const show = m !== lastMonth && (w === 0 || colEnd.getDate() <= 7);
    months += `<span>${show ? MONTHS[m] : ''}</span>`;
    if (show) lastMonth = m;
    for (let d = 0; d < 7; d++) {
      const day = new Date(colStart); day.setDate(colStart.getDate() + d);
      if (day > today) { cells += '<i class="future"></i>'; continue; }
      const k = dayKey(day);
      const hit = trained.has(k);
      if (hit) active++;
      cells += `<i class="l${hit ? 3 : (data[k] || 0) > 0 ? 1 : 0}" title="${day.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}${hit ? ' · trained' : ''}"></i>`;
    }
  }
  return `
    <div class="glass p-5" style="margin-bottom:11px">
      <div class="card-head">
        <div class="card-title">${icon('cal', 16)}<span>Workouts</span></div>
        <span class="card-note">${active} in ${WEEKS} weeks</span>
      </div>
      <div class="heat">
        <div class="heat-days"><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span><span>Sun</span></div>
        <div style="flex:1;min-width:0">
          <div class="heat-months" style="grid-template-columns:repeat(${WEEKS},1fr)">${months}</div>
          <div class="heat-grid" style="grid-template-columns:repeat(${WEEKS},1fr)">${cells}</div>
        </div>
      </div>
    </div>`;
}

function renderProgressGym() {

  const W = 7 * 86400000;
  const vols = [], counts = [], labels = [];
  for (let i = 7; i >= 0; i--) {

    const ss = S.sessions.filter(s => s.ts >= a && s.ts < b);

/* ---- Habit history: one day key per completed day, used for week strips, grids and rates ---- */
function ensureHabitHistory() {
  (S.habits || []).forEach(h => {
    if (Array.isArray(h.history)) { if (typeof h.best !== 'number') h.best = h.streak || 0; return; }
    const set = new Set();
    // 1. log entries are keyed "<ts>-<habitId>"
    (S.log || []).forEach(e => { if (e && typeof e.id === 'string' && e.id.endsWith('-' + h.id) && e.ts) set.add(dayKey(new Date(e.ts))); });
    // 2. discipline events carry the habit id for the last 30 days
    (S.disciplineEvents || []).forEach(e => { if (e && e.habitId === h.id && e.type === 'completion' && e.ts) set.add(dayKey(new Date(e.ts))); });
    // 3. the current streak implies a run of scheduled days ending at the last check-in
    if (h.lastCheckIn && h.streak > 0 && h.frequency === 'daily') {
      const d = new Date(h.lastCheckIn); d.setHours(12, 0, 0, 0);
      let left = Math.min(h.streak, 400), guard = 0;
      while (left > 0 && guard++ < 800) {
        const scheduled = !Array.isArray(h.days) || h.days.length === 0 || h.days.includes(d.getDay());
        if (scheduled) { set.add(dayKey(d)); left--; }
        d.setDate(d.getDate() - 1);
      }
    } else if (h.lastCheckIn) set.add(dayKey(new Date(h.lastCheckIn)));
    h.history = Array.from(set).sort().slice(-400);
    h.best = Math.max(h.best || 0, h.streak || 0);
  });
}
function habitScheduledOn(h, date) {
  if (h.createdAt && date.getTime() < new Date(h.createdAt).setHours(0, 0, 0, 0)) return false;
  if (h.frequency !== 'daily') return true;
  return !Array.isArray(h.days) || h.days.length === 0 || h.days.includes(date.getDay());
}
// Completion rate over the last n days, counting only days the habit was scheduled
function habitRate(h, n) {
  const done = new Set(h.history || []);
  let sched = 0, hit = 0;
  for (let i = 0; i < n; i++) {
    const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - i);
    if (h.frequency !== 'daily') { if (done.has(dayKey(d))) hit++; continue; }
    if (!habitScheduledOn(h, d)) continue;
    sched++; if (done.has(dayKey(d))) hit++;
  }
  if (h.frequency !== 'daily') { const weeks = Math.max(1, Math.round(n / 7)); return Math.min(100, Math.round((hit / weeks) * 100)); }
  return sched ? Math.round((hit / sched) * 100) : 0;
}
// Mon–Sun strip for the current week
function habitWeekStrip(h) {
  const done = new Set(h.history || []);
  const start = weekStartOf(new Date());
  const todayK = dayKey();
  return `<div class="wk">${['M','T','W','T','F','S','S'].map((l, i) => {
    const d = new Date(start); d.setDate(start.getDate() + i); d.setHours(12);
    const k = dayKey(d);
    const cls = done.has(k) ? 'on' : (k > todayK ? 'future' : (h.frequency === 'daily' && !habitScheduledOn(h, d)) ? 'off' : (k === todayK ? 'today' : 'miss'));
    return `<span class="${cls}"><i></i><small>${l}</small></span>`;
  }).join('')}</div>`;
}
// 16-week dot grid, one column per week
function habitGrid(h, weeks) {
  const done = new Set(h.history || []);
  const start = weekStartOf(new Date()); start.setDate(start.getDate() - (weeks - 1) * 7);
  const todayK = dayKey();
  let cells = '';
  for (let w = 0; w < weeks; w++) for (let i = 0; i < 7; i++) {
    const d = new Date(start); d.setDate(start.getDate() + w * 7 + i); d.setHours(12);
    const k = dayKey(d);
    cells += `<i class="${k > todayK ? 'future' : done.has(k) ? 'l3' : ''}"></i>`;
  }
  return `<div class="heat-grid" style="grid-template-columns:repeat(${weeks},1fr)">${cells}</div>`;
}

/* ============================================================
   MUSCLE MAP — visual body diagram + recovery tracking
   ============================================================ */
// Compute recovery state for a muscle group based on last hit timestamp.
// ============================================================
// RECOVERY MODEL
// Each session deposits a "fatigue load" on the muscle. That load decays
// exponentially with a half-life calibrated per muscle group. The current
// fatigue level is the sum of all decayed deposits at this moment.
//
//   fatigue(now) = Σ load_i × 0.5^((now - ts_i) / halfLife)
//
// We then express it as a 0-100% number relative to a "max useful" deposit,
// which is one full optimal session for that muscle group. The current
// fatigue % drives the cycle phase shown to the user.
// ============================================================

// Rough "fully fatigued from one session" value — calibration constant.
// In practice this varies, but provides a stable normaliser.
const FATIGUE_REF_LOAD = 2000; // matches a solid hypertrophy session

function muscleFatigue(muscleKey) {
  const hits = (S.muscleHits && S.muscleHits[muscleKey]) || [];
  if (hits.length === 0) return 0;
  const prof = profileFor(muscleKey);
  const halfLife = prof.halfLifeHours;
  const now = Date.now();
  let fatigue = 0;
  hits.forEach(h => {
    const load = h.load || 100; // legacy hits without load field count as small deposit
    const hoursAgo = (now - h.ts) / 3600000;
    if (hoursAgo < 0) return;
    // Skip ancient hits — beyond 6 half-lives the decay is negligible
    if (hoursAgo > halfLife * 6) return;
    const decay = Math.pow(0.5, hoursAgo / halfLife);
    fatigue += load * decay;
  });
  return fatigue;
}

// Convert raw fatigue into a 0-1 ratio against the reference load
function muscleFatigueRatio(muscleKey) {
  return Math.min(2, muscleFatigue(muscleKey) / FATIGUE_REF_LOAD);
}

// Cycle phase: Spent → Loading → Primed → Stale → Untrained
// Uses fatigue ratio + time since last hit.
function muscleRecoveryState(muscleKey) {
  const hits = (S.muscleHits && S.muscleHits[muscleKey]) || [];
  if (hits.length === 0) {
    return { stage: 'untrained', fatigue: 0, hoursAgo: Infinity, lastTs: 0,
             color: 'rgba(255,255,255,0.06)', label: 'Untrained' };
  }
  const lastTs = hits[hits.length - 1].ts;
  const hoursAgo = (Date.now() - lastTs) / 3600000;
  const fatigue = muscleFatigue(muscleKey);
  const ratio = fatigue / FATIGUE_REF_LOAD;

  // Stale: no work in 10+ days = detraining territory
  if (hoursAgo > 240) {
    return { stage: 'stale', fatigue, ratio, hoursAgo, lastTs,
             color: 'rgba(255,255,255,0.18)', label: 'Stale' };
  }

  // Cycle phases by fatigue ratio
  if (ratio >= 0.70) {
    return { stage: 'spent', fatigue, ratio, hoursAgo, lastTs,
             color: '#F2726B', label: 'Spent' };
  }
  if (ratio >= 0.30) {
    return { stage: 'loading', fatigue, ratio, hoursAgo, lastTs,
             color: '#EDB868', label: 'Loading' };
  }
  return { stage: 'primed', fatigue, ratio, hoursAgo, lastTs,
           color: '#63D49B', label: 'Primed' };
}

// Weekly frequency tracker — how many sessions hit this muscle in the last 7 days?
// Returns { hits, target, ratio } where ratio > 1 means over-target.
function muscleWeeklyFrequency(muscleKey) {
  const cutoff = Date.now() - 7 * 86400000;
  const hits = (S.muscleHits && S.muscleHits[muscleKey]) || [];
  // Dedupe by session (a muscle hit twice in the same session counts as one hit)
  const sessions = new Set();
  hits.forEach(h => {
    if (h.ts >= cutoff && h.sessionId) sessions.add(h.sessionId);
  });
  const count = sessions.size;
  const target = profileFor(muscleKey).weeklyTarget;
  return { hits: count, target, ratio: count / target };
}

// Frequency status label / color
function muscleFrequencyStatus(muscleKey) {
  const f = muscleWeeklyFrequency(muscleKey);
  if (f.hits === 0) return { ...f, status: 'idle',    color: 'rgba(255,255,255,0.4)',  label: 'Idle' };
  if (f.ratio < 0.5)  return { ...f, status: 'low',     color: '#EDB868',                label: 'Under' };
  if (f.ratio <= 1.2) return { ...f, status: 'ontarget', color: '#63D49B',                label: 'On target' };
  return                { ...f, status: 'over',     color: '#F2726B',                label: 'Over' };
}

// Imbalance check: push vs pull, quad vs hamstring, left/right (not applicable here).
// Returns array of warnings with { kind, severity, message }.
function detectImbalances() {
  const warnings = [];
  const vol = muscleVolumeLast30();
  const push = (vol.chest || 0) + (vol.upperChest || 0) + (vol.lowerChest || 0)
             + (vol.frontDelts || 0) + (vol.sideDelts || 0) + (vol.triceps || 0);
  const pull = (vol.back || 0) + (vol.lats || 0) + (vol.traps || 0)
             + (vol.lowerBack || 0) + (vol.rearDelts || 0) + (vol.biceps || 0);
  if (push > 100 && pull > 0) {
    const ratio = push / pull;
    if (ratio > 1.4) {
      warnings.push({ kind: 'push-pull', severity: 'warn',
        message: `Push volume is ${ratio.toFixed(1)}× pull. Add rows or pulls.` });
    } else if (ratio < 0.7) {
      warnings.push({ kind: 'push-pull', severity: 'warn',
        message: `Pull volume is ${(1/ratio).toFixed(1)}× push. Add pressing.` });
    }
  }
  const quads = vol.quads || 0;
  const hams = vol.hamstrings || 0;
  if (quads > 200 && hams > 0 && quads / hams > 2) {
    warnings.push({ kind: 'quad-ham', severity: 'warn',
      message: `Quads ${(quads/hams).toFixed(1)}× hamstrings. Add hinges/curls.` });
  }
  return warnings;
}

// Which muscles are Primed AND under their weekly target?
// Suggestion order: most under-target first.
function muscleTrainSuggestions() {
  const list = [];
  Object.keys(MUSCLE_GROUPS).forEach(k => {
    // Skip subdivisions — only suggest top-level parent groups
    if (MUSCLE_GROUPS[k].parent) return;
    const rec = muscleRecoveryState(k);
    if (rec.stage !== 'primed' && rec.stage !== 'untrained' && rec.stage !== 'stale') return;
    const freq = muscleWeeklyFrequency(k);
    if (freq.ratio >= 1) return; // already on/over target
    list.push({
      muscle: k,
      label: MUSCLE_GROUPS[k].label,
      hits: freq.hits,
      target: freq.target,
      stage: rec.stage,
      deficit: freq.target - freq.hits,
    });
  });
  list.sort((a, b) => b.deficit - a.deficit);
  return list.slice(0, 5);
}

// Last-30-day "strength" leaderboard — total effective volume per muscle
function muscleVolumeLast30() {
  const cutoff = Date.now() - 30 * 86400000;
  const tally = {};
  Object.keys(MUSCLE_GROUPS).forEach(k => tally[k] = 0);
  S.sessions.forEach(s => {
    if (s.ts < cutoff) return;
    const routine = S.routines.find(r => r.id === s.routineId);
    if (!routine) return;
    Object.entries(s.exercises || {}).forEach(([exId, sets]) => {
      const ex = routine.exercises.find(e => e.id === exId);
      if (!ex || !Array.isArray(ex.muscles)) return;
      const exVol = sets.reduce((sum, set) => sum + (set.reps||0) * effectiveLoad(ex, set.weight), 0);
      // Divide volume evenly across the muscles trained (so a 3-muscle compound counts each at 1/3)
      const portion = exVol / ex.muscles.length;
      ex.muscles.forEach(m => {
        if (tally[m] !== undefined) tally[m] += portion;
      });
    });
  });
  return tally;
}

const RECOVERY_TONE = { sore: '#F2726B', rec: '#EDB868', fresh: '#63D49B' };
const RECOVERY_LABEL = { sore: 'Sore', rec: 'Recovering', fresh: 'Fresh' };

// Last direct hit for a model region → sore (<24h), recovering (24–48h) or fresh.
function regionRecovery(id) {
  const r = BODY_REGIONS[id];
  let last = 0;
  r.keys.concat(r.whole).forEach(k => {
    ((S.muscleHits && S.muscleHits[k]) || []).forEach(h => { if (!h.derived && h.ts > last) last = h.ts; });
  });
  const hrs = last ? (Date.now() - last) / 3600000 : Infinity;
  return { last, state: hrs < 24 ? 'sore' : hrs < 48 ? 'rec' : 'fresh' };
}

// One figure. Left half is drawn, then mirrored across the centre line.
function bodyFigureSVG(side, states) {
  const front = side === 'front';
  const cx = front ? 364 : 1083.5;
  const x0 = cx - 322;
  const polys = front ? {
    c1: '240,300 370,300 370,352 240,372', c2: '240,372 370,352 370,404 240,388', c3: '240,388 370,404 370,445 240,445',
    d1: '180,290 243,290 232,405 180,405', d2: '243,290 290,290 290,405 232,405',
  } : {
    l1: '950,390 1070,390 1070,500 950,478', l2: '950,478 1070,500 1070,595 950,595',
  };
  const dividers = front
    ? { c1: ['240,372 370,352', '240,388 370,404'], d1: ['243,290 232,405'] }
    : { l1: ['950,478 1070,500'] };
  const id = k => `bm-${side}-${k}`;
  const LINE = 'rgba(255,255,255,0.55)';
  const sel = UI.selectedMuscle;
  const fillOf = region => region === 'hair' ? '#3A3A3C' : (region && states[region]) ? RECOVERY_TONE[states[region].state] : '#2C2C2E';
  const tap = region => (region && BODY_REGIONS[region]) ? ` onclick="toggleMuscleSelected('${region}')" style="cursor:pointer"` : '';
  let defs = `<clipPath id="${id('h')}"><rect x="${x0}" y="0" width="322" height="1448"/></clipPath>`;
  Object.entries(polys).forEach(([k, pts]) => { defs += `<clipPath id="${id(k)}"><polygon points="${pts}"/></clipPath>`; });
  let fills = '', lines = '';
  BODY_MAP[side].forEach(([region, d, clip], i) => {
    const on = region && region === sel;
    const stroke = `fill="none" stroke="${on ? '#FFFFFF' : LINE}" stroke-width="${on ? 1.6 : 0.8}" vector-effect="non-scaling-stroke" stroke-linejoin="round"`;
    if (clip && clip !== 'h') {
      fills += `<path d="${d}" fill="${fillOf(region)}" clip-path="url(#${id(clip)})"${tap(region)}/>`;
      if (dividers[clip]) {
        defs += `<clipPath id="${id('s' + i)}"><path d="${d}"/></clipPath>`;
        lines += `<path d="${d}" fill="none" stroke="${LINE}" stroke-width="0.8" vector-effect="non-scaling-stroke" stroke-linejoin="round" pointer-events="none"/>`;
        dividers[clip].forEach(pts => { lines += `<polyline points="${pts}" fill="none" stroke="${LINE}" stroke-width="0.8" vector-effect="non-scaling-stroke" clip-path="url(#${id('s' + i)})" pointer-events="none"/>`; });
      }
    } else {
      fills += `<path d="${d}" fill="${fillOf(region)}"${clip === 'h' ? ` clip-path="url(#${id('h')})"` : ''}${tap(region)}/>`;
      lines += `<path d="${d}" ${stroke}${clip === 'h' ? ` clip-path="url(#${id('h')})"` : ''} pointer-events="none"/>`;
    }
  });
  const outline = `<path d="${front ? BODY_MAP.outlineFront : BODY_MAP.outlineBack}" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1" vector-effect="non-scaling-stroke" clip-path="url(#${id('h')})" pointer-events="none"/>`;
  const half = fills + lines + outline;
  return `
    <svg viewBox="${x0} 86 644 1266" style="display:block;width:100%;height:auto" role="img" aria-label="${front ? 'Front' : 'Back'} muscle recovery">
      <defs>${defs}</defs>
      <g>${half}</g>
      <g transform="translate(${cx * 2},0) scale(-1,1)">${half}</g>
    </svg>`;
}

function renderMuscleMapWidget() {
  const states = {};
  Object.keys(BODY_REGIONS).forEach(id => { states[id] = regionRecovery(id); });
  const sel = UI.selectedMuscle && BODY_REGIONS[UI.selectedMuscle] ? UI.selectedMuscle : null;
  const legend = ['sore', 'rec', 'fresh'].map(k =>
    `<span class="tone-chip" style="color:${RECOVERY_TONE[k]};background:${RECOVERY_TONE[k]}1A;border-color:${RECOVERY_TONE[k]}55"><i style="background:${RECOVERY_TONE[k]}"></i>${RECOVERY_LABEL[k]}</span>`).join('');
  const caption = sel ? `
      <div style="text-align:center;font-size:12px;color:var(--text-2);margin-top:12px">
        <b style="color:var(--text-1);font-weight:600">${BODY_REGIONS[sel].label}</b> · ${RECOVERY_LABEL[states[sel].state]}${states[sel].last ? ` · trained ${formatRelative(states[sel].last)}` : ''}
      </div>` : '';
  return `
    <div class="glass p-5" style="margin-bottom:11px">
      <div class="card-head">
        <div class="card-title">${icon('activity', 15)}<span>Recovery</span></div>
        <span class="card-note">by muscle</span>
      </div>
      <div style="display:flex;justify-content:center;gap:10px;padding:2px 6px 0">
        <div style="flex:1;max-width:158px">${bodyFigureSVG('front', states)}</div>
        <div style="flex:1;max-width:158px">${bodyFigureSVG('back', states)}</div>
      </div>
      <div style="display:flex;justify-content:center;gap:8px;margin-top:14px">${legend}</div>
      ${caption}
    </div>`;
}

// Format relative time for display (e.g. "2h ago", "3d ago")
function formatRelative(ts) {
  const sec = Math.max(0, (Date.now() - ts) / 1000);
  if (sec < 60) return 'just now';
  if (sec < 3600) return `${Math.floor(sec/60)}m ago`;
  if (sec < 86400) return `${Math.floor(sec/3600)}h ago`;
  const days = Math.floor(sec / 86400);
  if (days < 30) return `${days}d ago`;
  return `${Math.floor(days/30)}mo ago`;
}

window.toggleMuscleSelected = function(m) {
  if (!BODY_REGIONS[m]) return;
  UI.selectedMuscle = UI.selectedMuscle === m ? null : m;
  render();
};

/* ---- Shared session maths ---- */
function sessionVolume(s) {
  const routine = S.routines.find(r => r.id === s.routineId);
  let v = 0;
  Object.entries(s.exercises || {}).forEach(([exId, sets]) => {
    const ex = (s.extras && s.extras[exId]) || routine?.exercises.find(e => e.id === exId);
    (sets || []).forEach(set => v += (set.reps || 0) * effectiveLoad(ex, set.weight));
  });
  return v;
}
function weekStartOf(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; } // Monday
function fmtKg(v) { return v >= 10000 ? (v / 1000).toFixed(1).replace(/\.0$/, '') + 't' : Math.round(v).toLocaleString(); }
function agoLabel(ts) {
  if (!ts) return 'never';
  const d = calendarDaysSince(ts);
  return d <= 0 ? 'today' : d === 1 ? 'yesterday' : `${d}d ago`;
}
function scheduleLabel(days) {
  if (!Array.isArray(days) || days.length === 0) return 'No set days';
  if (days.length === 7) return 'Every day';
  const order = [1, 2, 3, 4, 5, 6, 0];
  return order.filter(d => days.includes(d)).map(d => DAY_NAMES[d]).join(' · ');
}
// Which routine is next: today's (if not already done), else the next scheduled day
function nextRoutine() {
  const today = dayKey();
  const dow = new Date().getDay();
  for (let off = 0; off < 7; off++) {
    const day = (dow + off) % 7;
    const r = S.routines.find(x => x.schedule?.includes(day) &&
      !(off === 0 && S.sessions.some(s => s.routineId === x.id && dayKey(new Date(s.ts)) === today)));
    if (r) return { r, off };
  }
  return null;
}

function renderGym() {
  if (UI.gymView.kind === 'detail') return renderRoutineDetail(UI.gymView.id);
  if (UI.gymView.kind === 'log') return renderSessionLogger(UI.gymView.id);

  const today = dayKey();
  const doneToday = S.sessions.filter(s => dayKey(new Date(s.ts)) === today);
  const nx = nextRoutine();
  const wkStart = weekStartOf(new Date()).getTime();
  const wk = S.sessions.filter(s => s.ts >= wkStart);
  const wkVol = wk.reduce((a, s) => a + sessionVolume(s), 0);
  const planned = new Set(S.routines.flatMap(r => r.schedule || [])).size;

  let upNext = '';
  if (_logState) {
    upNext = activeLogBanner();
  } else if (nx) {
    const { r, off } = nx;
    const last = S.sessions.filter(s => s.routineId === r.id).sort((a, b) => b.ts - a.ts)[0];
    const when = off === 0 ? 'Today' : off === 1 ? 'Tomorrow' : DAY_NAMES[(new Date().getDay() + off) % 7];
    upNext = `
      <div class="glass next">
        <div class="next-eyebrow">${off === 0 ? 'Today’s workout' : doneToday.length ? `Done for today · next up ${when}` : `Next up · ${when}`}</div>
        <div class="next-title">${escapeHtml(r.name)}</div>
        <div class="next-sub">${r.exercises.length} exercise${r.exercises.length === 1 ? '' : 's'} · ${last ? `last done ${agoLabel(last.ts)}` : 'not done yet'}</div>
        ${r.exercises.length ? `<div class="next-list">${r.exercises.slice(0, 5).map(e => `<span>${escapeHtml(e.name)}</span>`).join('')}${r.exercises.length > 5 ? `<span>+${r.exercises.length - 5} more</span>` : ''}</div>` : ''}
        <button class="btn-primary" onclick="setGymView('log', '${r.id}')" ${r.exercises.length === 0 ? 'disabled' : ''}>Start workout</button>
      </div>`;
  }

  return `
    ${upNext}

    <div class="tiles">
      <div class="tile"><small>This week</small><b>${wk.length}${planned ? `<i> / ${planned}</i>` : ''}</b><span>workouts</span></div>
      <div class="tile"><small>Volume</small><b>${fmtKg(wkVol)}</b><span>kg lifted</span></div>
      <button class="tile" onclick="openModal('bodyweight')"><small>Bodyweight</small><b>${S.bodyweight}<i>kg</i></b><span>Tap to update</span></button>
    </div>

    <div class="section-label"><span>Routines</span><button onclick="openModal('routine')">${icon('plus', 12)} New</button></div>
    ${S.routines.length === 0 ? `
      <div class="glass p-5 empty">No routines yet.<div><button class="btn" onclick="openModal('routine')">${icon('plus', 13)} Create a routine</button></div></div>
    ` : S.routines.map(r => routineCardHTML(r)).join('')}

    <div style="height:14px"></div>
    ${renderMuscleMapWidget()}
    ${renderWorkoutNotesLog()}
    ${renderPhysiqueGallery()}
  `;
}

function renderWorkoutNotesLog() {
  const noted = (S.sessions || [])
    .filter(s => (s.notes && s.notes.trim()) || (typeof s.rating === 'number' && s.rating >= 1))
    .sort((a, b) => b.ts - a.ts);
  const shown = noted.slice(0, UI.notesAll ? 30 : 4);
  return `
    <div class="glass p-5" style="margin-bottom:11px">
      <div class="card-head">
        <div class="card-title">${icon('scroll', 16)}<span>Workout notes</span></div>
        ${noted.length > 4 ? `<button class="link" onclick="UI.notesAll=!UI.notesAll;render()">${UI.notesAll ? 'Show less' : `All ${Math.min(noted.length, 30)}`}</button>` : ''}
      </div>
      ${noted.length === 0 ? `<div class="empty small">Notes and ratings from finished workouts show up here.</div>` : shown.map(s => {
        const r = S.routines.find(x => x.id === s.routineId);
        const rating = (typeof s.rating === 'number' && s.rating >= 1 && s.rating <= 5) ? s.rating : 0;
        return `
          <div class="note-row">
            <div class="note-top">
              <b>${escapeHtml(r ? r.name : 'Workout')}</b>

            ${s.notes && s.notes.trim() ? `<p>${escapeHtml(s.notes.trim())}</p>` : ''}
          </div>`;
      }).join('')}

}

        <div style="text-align:center;padding:14px 0;color:rgba(255,255,255,0.30);font-size:12px">No cardio planned for this routine.</div>
      ` : (r.cardio || []).map(c => {
        const muscleLabels = (c.muscles || []).map(m => MUSCLE_GROUPS[m]?.label || m).filter(Boolean).slice(0, 4).join(' · ');

    <button class="btn-primary" onclick="setGymView('log', '${id}')" ${r.exercises.length === 0 ? 'disabled' : ''}>Start workout</button>
    <button class="btn-text" onclick="confirmDeleteRoutine('${id}')" id="del-btn">Delete routine</button>
  `;
}

window.toggleScheduleEdit = function(id) {
  const r = S.routines.find(x => x.id === id);
  if (!r) return;
  const toggle = document.getElementById('sched-toggle');
  const editing = toggle.textContent === 'Edit';
  if (editing) {
    document.querySelectorAll('.sched-day').forEach(b => {
      b.disabled = false;
      b.dataset.locked = '0';
      b.onclick = () => {
        const d = parseInt(b.dataset.day);
        let s = (r._draftSchedule || r.schedule || []).slice();
        s = s.includes(d) ? s.filter(x => x!==d) : s.concat(d);

};

// Session logger state lives outside re-render
let _logState = null;

// Resolve an exercise by id — looks in session-local extras first, then the routine.
function resolveLogExercise(exId) {
  if (!_logState) return null;
  if (_logState.extras && _logState.extras[exId]) return _logState.extras[exId];
  const r = S.routines.find(x => x.id === _logState.routineId);
  if (r) {
    const ex = r.exercises.find(e => e.id === exId);
    if (ex) return ex;
  }
  return null;
}

/* ---- Active workout: survives reloads and tab switches ---- */
const LOG_KEY = 'foundry.activeLog.v1';
function saveActiveLog() {
  try {
    if (_logState) localStorage.setItem(LOG_KEY, JSON.stringify(_logState));
    else localStorage.removeItem(LOG_KEY);
  } catch {}
}
(function restoreActiveLog() {
  try {
    const raw = localStorage.getItem(LOG_KEY);
    if (!raw) return;
    const st = JSON.parse(raw);
    if (st && st.routineId && st.data && Array.isArray(st.order) && S.routines.some(r => r.id === st.routineId)) _logState = st;
    else localStorage.removeItem(LOG_KEY);
  } catch {}
})();

const REST_OPTIONS = [60, 90, 120, 180];
function restSecs() { return REST_OPTIONS.includes(S.restSecs) ? S.restSecs : 90; }
function fmtClock(totalSecs) {
  const s = Math.max(0, Math.floor(totalSecs));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
  return h > 0 ? `${h}:${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}` : `${m}:${String(r).padStart(2, '0')}`;
}
function logVolume() {
  let tv = 0;
  if (!_logState) return 0;
  Object.entries(_logState.data).forEach(([eid, sets]) => {
    const ex = resolveLogExercise(eid);
    sets.forEach(s => tv += (s.reps || 0) * effectiveLoad(ex, s.weight));
  });
  return Math.round(tv);
}
function logSetsDone() {
  let n = 0;
  if (_logState) Object.values(_logState.data).forEach(sets => sets.forEach(s => { if ((s.reps || 0) > 0) n++; }));
  return n;
}
// Banner shown on Today and Gym while a workout is open in the background
function activeLogBanner() {
  if (!_logState) return '';
  const r = S.routines.find(x => x.id === _logState.routineId);
  if (!r) return '';
  return `
    <button class="quick live" onclick="resumeLog()">
      <span class="q-ico">${icon('dumbbell', 16)}</span>
      <div style="flex:1;min-width:0">
        <div class="q-title">${escapeHtml(r.name)} in progress</div>
        <div class="q-sub"><span id="log-elapsed-b">${fmtClock((Date.now() - (_logState.startedAt || Date.now())) / 1000)}</span> · ${logSetsDone()} set${logSetsDone() === 1 ? '' : 's'} logged</div>
      </div>
      <span class="q-go">Resume</span>
    </button>`;
}
window.resumeLog = function() {
  if (!_logState) return;
  UI.tab = 'gym';

function renderSessionLogger(id) {
  const r = S.routines.find(x => x.id === id);
  if (!r) {
    return `<div class="glass p-5" style="text-align:center;color:var(--text-2)">Routine not found.<div style="margin-top:12px"><button class="btn" onclick="setGymView('list')">Back</button></div></div>`;
  }
  const last = S.sessions.filter(s => s.routineId === id).sort((a, b) => b.ts - a.ts)[0];

  // _logState: { routineId, startedAt, data: { exId: [{reps, weight, toFailure}] }, order: [exId],
  //              extras: { exId: exercise } (this workout only), cardio: [], notes, rating, restEndsAt }
  if (!_logState || _logState.routineId !== id) {
    _logState = { routineId: id, startedAt: Date.now(), data: {}, order: [], extras: {}, cardio: [] };
    r.exercises.forEach(ex => {
      const ls = last?.exercises?.[ex.id];
      const setCount = ls?.length || 3;
      _logState.data[ex.id] = Array.from({ length: setCount }, () => ({ reps: 0, weight: 0, toFailure: false }));
      _logState.order.push(ex.id);
    });
  }
  if (!_logState.startedAt) _logState.startedAt = Date.now();
  const resting = _logState.restEndsAt && _logState.restEndsAt > Date.now();

  const fmtSet = (s, isBw) => `${isBw ? (s.weight >= 0 ? '+' : '') + s.weight : s.weight} × ${s.reps}${s.toFailure ? ' F' : ''}`;
  const dateShort = ts => new Date(ts).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });

  // Last-session note, one line, expandable
  let lastNote = '';
  if (last && ((last.notes && last.notes.trim()) || last.rating)) {
    const open = UI.expandedLastSession === true;
    const note = (last.notes || '').trim();
    lastNote = `
      <button class="lg-last" onclick="toggleLastSessionSummary()">
        <div class="lg-last-top">
          <span>Last time · ${dateShort(last.ts)}</span>
          ${last.rating ? `<span class="lg-stars">${[1,2,3,4,5].map(n => `<i class="${n <= last.rating ? 'on' : ''}">${icon('star', 11)}</i>`).join('')}</span>` : ''}
        </div>
        ${note ? `<div class="lg-last-note${open ? ' open' : ''}">${escapeHtml(note)}</div>` : ''}
      </button>`;
  }

  const cards = _logState.order.map(exId => {
    const ex = resolveLogExercise(exId);
    if (!ex) return '';
    const isExtra = !!(_logState.extras && _logState.extras[exId]);
    const isBw = ex.type === 'bodyweight';
    const sets = _logState.data[exId] || [];
    const pr = S.prs[exId];
    const hist = (S.sessions || [])
      .filter(x => x.completed && x.exercises && Array.isArray(x.exercises[exId]) && x.exercises[exId].length > 0)
      .sort((a, b) => b.ts - a.ts).slice(0, 5);
    const lastSets = hist[0] ? hist[0].exercises[exId] : null;
    const histOpen = !!(UI.expandedHistory && UI.expandedHistory[exId]);

    // Progressive overload: all sets at 12 reps on one weight → go up; otherwise +2 reps per set (cap 12)
    const CAP = 12, STEP = 2, RESUME = 8;
    let weightUp = null;
    if (lastSets && lastSets.length >= 3 && lastSets.every(x => (x.reps || 0) >= CAP) && lastSets.every(x => x.weight === lastSets[0].weight)) {
      const nw = lastSets[0].weight + (isBw ? 1 : 2.5);
      weightUp = isBw ? `${nw >= 0 ? '+' : ''}${nw}kg added` : `${nw}kg`;
    }
    const targetFor = i => {
      if (weightUp || !lastSets || !lastSets[i]) return null;
      const reps = lastSets[i].reps || 0;
      if (reps <= 0 || reps >= CAP) return null;
      return Math.min(CAP, reps + STEP);
    };

    const sub = [
      pr && pr.topWeight > 0 ? `PR ${Math.round(pr.topWeight * 10) / 10}kg` : '',
      isBw ? `Bodyweight ${S.bodyweight}kg + added` : '',
      isExtra ? 'This workout only' : '',
    ].filter(Boolean).join(' · ');

    const rows = sets.map((s, i) => {
      const ls = lastSets && lastSets[i];
      const tg = targetFor(i);
      const repsVal = s.reps > 0 ? s.reps : '';
      const weightVal = s.weight !== 0 ? s.weight : '';
      return `
        <div class="st-row${isBw ? ' bw' : ''}${s.toFailure ? ' fail' : ''}">
          <span class="st-n">${i + 1}</span>
          <span class="st-last">${ls ? `<span>${fmtSet(ls, isBw)}</span>${tg ? `<b>aim ${tg}</b>` : ''}` : '<em>—</em>'}</span>
          <input type="number" inputmode="numeric" aria-label="Reps, set ${i + 1}" value="${repsVal}" oninput="updateSet('${exId}', ${i}, 'reps', this.value)" />
          <input type="number" inputmode="decimal" step="${isBw ? '1' : '0.5'}" aria-label="Weight, set ${i + 1}" value="${weightVal}" oninput="updateSet('${exId}', ${i}, 'weight', this.value)" />
          ${isBw ? `<button class="st-btn${s.weight < 0 ? ' neg' : ''}" onclick="flipSetWeight('${exId}', ${i})" aria-label="Flip plus or minus">±</button>` : ''}
          <button class="st-btn${s.toFailure ? ' on' : ''}" onclick="toggleSetFailure('${exId}', ${i})" aria-label="To failure" aria-pressed="${s.toFailure ? 'true' : 'false'}">F</button>
        </div>`;
    }).join('');

    return `
      <div class="glass ex" data-ex="${exId}">
        <div class="ex-head">
          <div style="min-width:0;flex:1">
            <div class="ex-name">${escapeHtml(ex.name)}</div>
            ${sub ? `<div class="ex-sub">${sub}</div>` : ''}
          </div>
          ${hist.length > 0 ? `<button class="ex-btn${histOpen ? ' on' : ''}" onclick="toggleExHistory('${exId}')" aria-label="History">${icon('clock', 16)}</button>` : ''}
          <button class="ex-btn" onclick="removeLogExercise('${exId}')" aria-label="Remove from this workout">${icon('x', 15)}</button>
        </div>
        ${weightUp ? `<div class="ex-hint">${icon('sparkles', 13)}<span>Weight up: <b>${weightUp}</b>, aim for ${RESUME} reps</span></div>` : ''}
        ${histOpen ? `
          <div class="ex-hist">
            ${hist.map(sess => `
              <div class="ex-hist-row">
                <span>${dateShort(sess.ts)}</span>
                <div>
                  <div>${sess.exercises[exId].map(s => fmtSet(s, isBw)).join(' · ')}</div>
                  ${sess.notes && sess.notes.trim() ? `<small>${escapeHtml(sess.notes.length > 120 ? sess.notes.slice(0, 120) + '…' : sess.notes)}</small>` : ''}
                </div>
              </div>`).join('')}
          </div>` : ''}
        <div class="st-row st-headrow${isBw ? ' bw' : ''}">
          <span>Set</span><span>Last</span><span>Reps</span><span>${isBw ? '+kg' : 'Kg'}</span>${isBw ? '<span></span>' : ''}<span></span>
        </div>
        ${rows}
        <div class="ex-foot">
          <button onclick="addLogSet('${exId}')">${icon('plus', 13)} Add set</button>
          ${sets.length > 1 ? `<button class="quiet" onclick="removeLogSet('${exId}', ${sets.length - 1})">Remove set</button>` : ''}
        </div>
      </div>`;
  }).join('');

  const cardio = (_logState.cardio && _logState.cardio.length > 0) ? `
    <div class="section-label"><span>Cardio</span></div>
    ${_logState.cardio.map(c => `
      <div class="glass list-row">
        <span class="list-ico">${icon('activity', 16)}</span>
        <div style="flex:1;min-width:0">
          <div class="list-title">${escapeHtml(c.name)}</div>
          <div class="list-sub">${c.value} ${c.unit}${c.muscles && c.muscles.length ? ` · ${c.muscles.map(m => MUSCLE_GROUPS[m]?.label || m).join(', ')}` : ''}</div>
        </div>
        <button class="ex-btn" onclick="removeLogCardio('${c.id}')" aria-label="Remove">${icon('x', 15)}</button>
      </div>`).join('')}` : '';

  const rating = _logState.rating || 0;
  return `
    <div class="lg-top">
      <button class="pill icon-only" onclick="minimiseLog()" aria-label="Back to Gym">${icon('back', 16)}</button>
      <div class="lg-title">
        <b>${escapeHtml(r.name)}</b>
        <span><span id="log-elapsed">${fmtClock((Date.now() - _logState.startedAt) / 1000)}</span> · <span id="vol-total">${logVolume().toLocaleString()}</span> kg</span>
      </div>
      <button id="rest-chip" class="pill rest${resting ? ' on' : ''}" onclick="toggleRest()">${icon('clock', 14)} <span id="rest-text">${resting ? fmtClock((_logState.restEndsAt - Date.now()) / 1000) : 'Rest'}</span></button>
      <button class="pill solid" onclick="submitLog()">Finish</button>
    </div>

    ${lastNote}
    ${cards}
    ${cardio}

    <div class="grid-2" style="margin-bottom:22px">
      <button class="btn tall" onclick="openAddExercisePicker()">${icon('plus', 14)} Exercise</button>
      <button class="btn tall" onclick="openAddCardioPicker()">${icon('activity', 14)} Cardio</button>
    </div>

    <div class="glass p-5" style="margin-bottom:11px">
      <div class="card-head">
        <div class="card-title"><span>Notes</span></div>
        <div id="workout-rating-row" class="rate">
          ${[1,2,3,4,5].map(n => `<button type="button" class="wr-star${rating && n <= rating ? ' on' : ''}" data-rating="${n}" onclick="setWorkoutRating(${n})" aria-label="${n} star${n > 1 ? 's' : ''}">${icon('star', 15)}</button>`).join('')}
        </div>
      </div>
      <textarea id="workout-notes" placeholder="How it went, cues for next time" style="min-height:76px;resize:vertical;line-height:1.45" oninput="if(_logState){_logState.notes=this.value;saveActiveLog();}">${escapeHtml((_logState && _logState.notes) || '')}</textarea>
      <div class="rest-pick">
        <span>Rest timer</span>
        <div>${REST_OPTIONS.map(s => `<button class="${restSecs() === s ? 'on' : ''}" onclick="setRestSecs(${s})">${fmtClock(s)}</button>`).join('')}</div>
      </div>
    </div>

    <button class="btn-primary" onclick="submitLog()">Finish workout · +${XP.GYM_SESSION} XP</button>
    ${UI.confirmDiscard ? `
      <div class="grid-2" style="margin-top:10px">
        <button class="btn tall" onclick="UI.confirmDiscard=false;render()">Keep going</button>
        <button class="btn tall danger" onclick="cancelLog()">Discard workout</button>
      </div>` : `<button class="btn-text" onclick="UI.confirmDiscard=true;render()">Discard workout</button>`}
  `;
}

window.flipSetWeight = function(exId, i) {
  if (!_logState) return;
  const cur = _logState.data[exId][i].weight || 0;
  _logState.data[exId][i].weight = -cur;
  saveActiveLog();
  render();
};

window.toggleSetFailure = function(exId, i) {
  if (!_logState || !_logState.data[exId] || !_logState.data[exId][i]) return;
  _logState.data[exId][i].toFailure = !_logState.data[exId][i].toFailure;
  render();
};

window.updateSet = function(exId, i, key, v) {
  if (!_logState) return;
  const num = parseFloat(v) || 0;
  _logState.data[exId][i][key] = num;
  const el = document.getElementById('vol-total');
  if (el) el.textContent = logVolume().toLocaleString();
  saveActiveLog();
};
// Leave the logger without ending the workout
window.minimiseLog = function() { UI.gymView = { kind: 'list' }; UI.confirmDiscard = false; render(); };
window.toggleRest = function() {
  if (!_logState) return;
  _logState.restEndsAt = (_logState.restEndsAt && _logState.restEndsAt > Date.now()) ? 0 : Date.now() + restSecs() * 1000;
  saveActiveLog();
  tickLogClock();
};
window.setRestSecs = function(n) { S.restSecs = n; persist(); render(); };
function tickLogClock() {
  if (!_logState) return;
  const t = fmtClock((Date.now() - (_logState.startedAt || Date.now())) / 1000);
  ['log-elapsed', 'log-elapsed-b'].forEach(id => { const el = document.getElementById(id); if (el) el.textContent = t; });
  const chip = document.getElementById('rest-chip'), txt = document.getElementById('rest-text');
  if (_logState.restEndsAt) {
    const left = (_logState.restEndsAt - Date.now()) / 1000;
    if (left <= 0) {
      _logState.restEndsAt = 0; saveActiveLog();
      try { if (navigator.vibrate) navigator.vibrate([180, 90, 180]); } catch {}
      if (chip) { chip.classList.remove('on'); chip.classList.add('done'); setTimeout(() => chip.classList.remove('done'), 2500); }
      if (txt) txt.textContent = 'Go';
      setTimeout(() => { const x = document.getElementById('rest-text'); if (x && !(_logState && _logState.restEndsAt)) x.textContent = 'Rest'; }, 2500);
    } else {

    }
  } else if (chip && chip.classList.contains('on')) {

  }
}

// Returns true when the user can currently see the journal modal OR the
// physique gallery on the Gym tab. Used to auto-lock sensitive surfaces
// the moment the user navigates away from both.
function sensitiveSurfaceVisible() {
  const journalModalOpen = !!(UI.modal && UI.modal.kind === 'journal');
  const physiqueVisible = UI.tab === 'gym';
  return journalModalOpen || physiqueVisible;
}
// Clear the shared unlock window if no sensitive surface is currently visible.
function autoLockIfHidden() {
  if (!sensitiveSurfaceVisible() && S.journal && S.journal.lastUnlock) {
    S.journal.lastUnlock = 0;
    UI.confirmingPinReset = false;
    try { persist(); } catch {}
  }
}

window.setTab = function(t) {
  UI.tab = t;
  // Preserve the active workout session if one is in progress —
  // user might tab over to Focus to time a rest break, then come back.
  // Only reset gymView when leaving gym tab AND not actively logging.
  if (t !== 'gym' && UI.gymView && UI.gymView.kind !== 'log') {
    UI.gymView = { kind: 'list' };
  }
  // Reset preset-edit mode when leaving the Focus tab
  if (t !== 'focus' && UI.editingFocusPresets) UI.editingFocusPresets = false;
  // Lock journal + physique when navigating away from both surfaces.
  autoLockIfHidden();
  render();
};

function render() {
  try {
    if (!UI._histReady) { ensureHabitHistory(); UI._histReady = true; }
    _render();
    if (typeof saveActiveLog === 'function') saveActiveLog();
    // Start focus timer ticker on first render
    startFocusUpdater();
  } catch (e) {
    console.error('Render failed:', e);
    try {
      document.getElementById('app').innerHTML = `
        <div style="max-width:480px;margin:60px auto;padding:24px">
          <div class="glass p-5" style="text-align:center">
            <div style="color:rgba(248,113,113,0.85);margin-bottom:12px">${icon('alert', 32)}</div>
            <h3 style="font-size:18px;font-weight:600;color:rgba(255,255,255,0.95);margin:0 0 8px">Something went wrong</h3>
            <p style="font-size:14px;color:rgba(255,255,255,0.6);margin:0 0 16px;line-height:1.5">The app caught a render error. Tap below to retry. Your data is preserved.</p>
            <details style="text-align:left;margin-bottom:16px;font-size:12px;color:rgba(255,255,255,0.45);background:rgba(255,255,255,0.03);padding:8px;border-radius:12px">
              <summary style="cursor:pointer">Error details</summary>
              <pre style="white-space:pre-wrap;word-break:break-word;margin:8px 0 0">${escapeHtml(String(e && e.message || e))}</pre>
            </details>
            <button onclick="render()" class="btn-primary">Retry</button>
          </div>
        </div>`;
    } catch {}
  }
}

function _render() {
  const disc = discipline();
  const inUrgency = disc < 50;
  const isElite = disc >= 90;
  const totalLv = calcTotalLevel(S.pillars);

  document.body.classList.toggle('urgency', inUrgency);
  document.body.classList.toggle('elite', isElite);

  let content = '';
  if (UI.tab === 'dashboard') content = renderDashboard();
  else if (UI.tab === 'quests') content = renderQuests();
  
  else if (UI.tab === 'gym')    content = renderGym();
  else if (UI.tab === 'fuel')   content = renderFuel();
  else if (UI.tab === 'focus')  content = renderFocus();
  else if (UI.tab === 'progress') content = renderProgress();

  const accent = inUrgency ? '#F2726B' : isElite ? '#63D49B' : '#63D49B';

  const shieldOn = shieldActive();
  const shieldHrsLeft = shieldOn ? Math.ceil((S.shieldActiveUntil - Date.now()) / 3600000) : 0;

  // Global Undo toast — appears regardless of tab when a habit was just checked.
  // Auto-expires from the UI after 60 seconds (next render past the threshold drops it).
  const lastAct = UI.lastHabitAction;
  const undoFresh = lastAct && (Date.now() - lastAct.ts < 60000);
  const undoToast = undoFresh ? `
    <div id="undo-toast" style="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(env(safe-area-inset-bottom), 12px) + 88px);z-index:50;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;border-radius:999px;background:rgba(34,35,40,0.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line-2);box-shadow:0 12px 32px rgba(0,0,0,0.5);max-width:calc(100vw - 32px)">
      <span style="color:#63D49B;flex-shrink:0">${icon('undo', 14)}</span>
      <div style="min-width:0;flex:1">
        <div style="font-size:14px;color:var(--text-1);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px">Checked: ${escapeHtml(lastAct.habitName)}</div>
        <div id="undo-count" style="font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums">${Math.max(0, 60 - Math.floor((Date.now() - lastAct.ts)/1000))}s to undo</div>
      </div>
      <button onclick="undoHabitCheckIn()" style="padding:8px 16px;border-radius:999px;font-size:14px;font-weight:600;background:#FFFFFF;color:#0A0A0A;border:none;flex-shrink:0;cursor:pointer">Undo</button>
    </div>` : '';

  // Header — Today gets the pill header; every other screen gets a title + settings
  const PAGE_TITLES = { quests: 'Habits', focus: 'Focus', gym: 'Gym', fuel: 'Fuel', progress: 'Progress' };
  const loggingNow = UI.tab === 'gym' && UI.gymView && (UI.gymView.kind === 'log' || UI.gymView.kind === 'detail');
  const headerHtml = loggingNow ? '' : UI.tab === 'dashboard' ? renderTodayHeader() : `
    <header>
      <div style="display:flex;align-items:center;gap:10px;min-width:0">
        ${UI.tab === 'quests' ? `<button class="pill icon-only" onclick="setTab('dashboard')" aria-label="Back to Today">${icon('back', 16)}</button>` : ''}
        <h1>${PAGE_TITLES[UI.tab] || 'Foundry'}</h1>
      </div>
      <button class="pill icon-only" onclick="openModal('cold-storage')" aria-label="Settings">${icon('settings', 16)}</button>
    </header>`;

  document.getElementById('app').innerHTML = `
    ${headerHtml}
    <div class="tab-content">${content}</div>
    ${undoToast}
  `;

  // Bottom nav — floating pill. Tasks lives under Today, so Today stays lit there.
  const tabs = [
    { id: 'dashboard', label: 'Today',    icon: 'home' },
    { id: 'gym',       label: 'Gym',      icon: 'dumbbell' },
    { id: 'fuel',      label: 'Fuel',     icon: 'utensils' },
    { id: 'focus',     label: 'Focus',    icon: 'clock' },
    { id: 'progress',  label: 'Progress', icon: 'bar' },
  ];
  const activeTab = UI.tab === 'quests' ? 'dashboard' : UI.tab;
  const sessionActive = !!_logState;
  const tabbar = document.getElementById('tabbar');
  if (tabbar) {
    tabbar.innerHTML = tabs.map(t => `
      <button class="tab-btn ${activeTab === t.id ? 'active' : ''}" onclick="setTab('${t.id}')" aria-label="${t.label}">
        ${icon(t.icon, 21)}
        <span>${t.label}</span>
        ${t.id === 'gym' && sessionActive ? `<span class="tab-dot"></span>` : ''}
      </button>`).join('');
  }

  // Modals
  if (UI.modal) {
    const m = UI.modal;
    let html = '';
    if (m.kind === 'habit') html = modalHabit();
    else if (m.kind === 'habit-edit') html = modalHabit(JSON.parse(m.data));
    else if (m.kind === 'routine') html = modalRoutine();
    else if (m.kind === 'fuel-goals') html = modalFuelGoals();
    else if (m.kind === 'journal') html = modalJournal();
    else if (m.kind === 'cold-storage') html = modalColdStorage();
    else if (m.kind === 'bodyweight') html = modalBodyweight();
    else if (m.kind === 'add-exercise') html = modalAddExercise();
    else if (m.kind === 'add-cardio') html = modalAddCardio();

    document.getElementById('overlays').innerHTML = html;

    if (m.kind === 'habit') attachHabitModalHandlers(null);
    else if (m.kind === 'habit-edit') attachHabitModalHandlers(JSON.parse(m.data));
    else if (m.kind === 'routine') attachRoutineModalHandlers();
    else if (m.kind === 'add-exercise') {
      // Restore focus + caret on the search input across re-renders
      const inp = document.getElementById('add-ex-search');
      if (inp) {
        inp.focus();
        try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch {}
      }
    }
    else if (m.kind === 'journal') {
      // Wire up star rating buttons via event delegation
      const row = document.getElementById('journal-rating-row');
      if (row) {
        row.querySelectorAll('.jr-star').forEach(btn => {
          btn.onclick = (ev) => {
            ev.preventDefault();
            window.setJournalRating(parseInt(btn.dataset.rating));

        // Apply any in-progress selection so the picker reflects state on re-render
        if (typeof UI.journalDraftRating === 'number') {
          window.setJournalRating(UI.journalDraftRating);
          // Note: setJournalRating toggles, so call it twice if needed
          if (UI.journalDraftRating !== null) {
            // Restore by re-applying selection
            const cur = UI.journalDraftRating;
            row.querySelectorAll('.jr-star').forEach(btn => {
              const i = parseInt(btn.dataset.rating);
              const active = cur && i <= cur;
              btn.style.background = active ? 'rgba(99,212,155,0.18)' : 'rgba(255,255,255,0.04)';
              btn.style.borderColor = active ? 'rgba(99,212,155,0.45)' : 'rgba(255,255,255,0.10)';
              btn.style.color = active ? '#63D49B' : 'rgba(255,255,255,0.45)';
            });
          }
        }
      }
    }
  } else if (!document.getElementById('overlays').querySelector('.fs-overlay')) {
    // Don't clear if a fullscreen overlay (level up, death, etc) is showing
    document.getElementById('overlays').innerHTML = '';
  }

  // Physique photo viewer — mount at overlay layer so it always sits above the
  // tab content and can't be swallowed by a parent stacking context. Sits on
  // top of any modal that happens to be open too, which is fine since only one
  // path opens the viewer (tapping a thumbnail from the unlocked gallery).
  const viewerHtml = physiqueViewerOverlayHtml();
  const overlaysEl = document.getElementById('overlays');
  // Always remove any stale viewer instance first
  const stale = overlaysEl.querySelector('[data-viewer="physique"]');
  if (stale) stale.remove();
  if (viewerHtml) {
    overlaysEl.insertAdjacentHTML('beforeend', viewerHtml);
    // Wire up click handlers imperatively — inline onclick attrs sometimes
    // fail to fire on Android WebView when the DOM is freshly injected right
    // after a state change, especially inside insertAdjacentHTML output.
    const root = overlaysEl.querySelector('[data-viewer="physique"]');
    if (root) {
      root.querySelectorAll('[data-action]').forEach(btn => {
        const action = btn.dataset.action;
        const arg = btn.dataset.arg;
        btn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          if (action === 'close') window.closePhysiqueViewer();
          else if (action === 'request-delete') window.requestPhysiqueDelete(arg);
          else if (action === 'cancel-delete') window.cancelPhysiqueDelete();
          else if (action === 'confirm-delete') window.confirmPhysiqueDelete(arg);
        });
      });
      // Backdrop click closes
      root.addEventListener('click', (ev) => {
        if (ev.target === root) window.closePhysiqueViewer();
      });
    }
  }
}

/* ============================================================
   INIT
   ============================================================ */
render();
decayTick();
setInterval(decayTick, 30000);

/* ============================================================
   AUTO-LOCK on session end / app close
   Journal and Physique share S.journal.lastUnlock. Clearing it
   re-locks both. Fires when the page is hidden (tab switch, OS
   backgrounding) or unloaded (close, refresh).
   ============================================================ */
function autoLockSensitive() {
  if (!S || !S.journal) return;
  if (S.journal.lastUnlock) {
    S.journal.lastUnlock = 0;
    try { persist(); } catch {}
  }
}
// `visibilitychange` is the most reliable signal on mobile WebViews.
// When the user backgrounds the app, switches tabs, or locks the phone, lock.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') autoLockSensitive();
});
// Belt-and-braces for desktop/refresh cases.
window.addEventListener('pagehide', autoLockSensitive);
window.addEventListener('beforeunload', autoLockSensitive);

// Re-render every minute for time-sensitive UI (countdowns, etc)
setInterval(() => {
  
}, 60000);

// Tick the Undo toast countdown every second while it's visible
setInterval(() => {
  const a = UI.lastHabitAction;
  if (!a) return;
  const age = Date.now() - a.ts;
  if (age >= 60000) {
    UI.lastHabitAction = null;
    render();
  } else {
    // Just update the visible countdown without a full re-render
    const toast = document.getElementById('undo-toast');
    if (toast) {
      const secs = Math.max(0, 60 - Math.floor(age / 1000));
      const counter = document.getElementById('undo-count');
      if (counter) counter.textContent = `${secs}s to undo`;
    }
  }
}, 1000);

/* ============================================================
   SWIPE NAVIGATION
   ============================================================ */
// Swipe left = next tab, swipe right = previous tab.
// Listens on the scroller element so vertical scrolling still works normally.
(function() {
  const TAB_ORDER = ['dashboard', 'gym', 'fuel', 'focus', 'progress'];
  const SWIPE_MIN_X = 70;          // minimum horizontal travel in px
  const SWIPE_MAX_Y = 60;          // maximum vertical drift allowed
  const SWIPE_MAX_TIME = 600;      // maximum gesture duration in ms

  let startX = 0, startY = 0, startT = 0, tracking = false;

  function isInteractiveTarget(el) {
    // Don't hijack swipes that start on inputs, sliders, scrollable rows,
    // buttons within scrolling content, or inside modals.
    while (el && el !== document.body) {
      const tag = (el.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || tag === 'select') return true;
      if (tag === 'button') return true;
      // Inside an open modal or fullscreen overlay
      if (el.classList && (el.classList.contains('modal-backdrop') || el.classList.contains('fs-overlay'))) return true;
      // Horizontally scrollable content (chip rows in Quests)
      if (el.classList && el.classList.contains('chip-scroll')) return true;
      el = el.parentElement;
    }
    return false;
  }

  const scroller = document.getElementById('scroller');
  if (!scroller) return;

  scroller.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) { tracking = false; return; }
    if (isInteractiveTarget(e.target)) { tracking = false; return; }
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    startT = Date.now();
    tracking = true;
  }, { passive: true });

  scroller.addEventListener('touchend', (e) => {
    if (!tracking) return;
    tracking = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    const dt = Date.now() - startT;
    if (dt > SWIPE_MAX_TIME) return;
    if (Math.abs(dy) > SWIPE_MAX_Y) return;
    if (Math.abs(dx) < SWIPE_MIN_X) return;
    if (Math.abs(dx) < Math.abs(dy) * 1.5) return; // require strong horizontal bias

    // Don't switch tabs if a modal or fullscreen overlay is open
    if (document.querySelector('.modal-backdrop') || document.querySelector('.fs-overlay')) return;
    // Don't switch if user is in a gym sub-view (detail/log) — let them back out manually
    if (UI.tab === 'gym' && UI.gymView && UI.gymView.kind !== 'list') return;

    const curIdx = TAB_ORDER.indexOf(UI.tab);
    if (curIdx === -1) return;
    let nextIdx;
    if (dx < 0) {
      // swipe left → next tab
      nextIdx = curIdx + 1;
      if (nextIdx >= TAB_ORDER.length) return;
    } else {
      // swipe right → previous tab
      nextIdx = curIdx - 1;
      if (nextIdx < 0) return;
    }
    setTab(TAB_ORDER[nextIdx]);
    // Reset scroll position after tab change feels cleaner
    scroller.scrollTop = 0;
  }, { passive: true });
})();
</script>
