<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#151515" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Foundry</title>
<link rel="manifest" href="manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* ============================================================
   FOUNDRY — graphite
   Neutral grey page, lit-edge cards, small crisp type, floating nav.
   ============================================================ */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --bg-0: #151515;
  --bg-1: #1F1F1F;
  --bg-2: #2A2A2A;
  --bg-3: #353535;

  --card: linear-gradient(112deg, #303030 0%, #272727 42%, #1F1F1F 100%);
  --card-soft: linear-gradient(112deg, #2A2A2A 0%, #232323 45%, #1D1D1D 100%);
  --glass-line: rgba(255,255,255,0.12);
  --lit: inset 0 1px 0 rgba(255,255,255,0.10);

  --line-1: rgba(255,255,255,0.07);
  --line-2: rgba(255,255,255,0.12);
  --line-3: rgba(255,255,255,0.24);

  --text-1: #FFFFFF;
  --text-2: #A8ADB8;
  --text-3: #8A8D95;
  --text-4: #5E6066;

  --accent: #63D49B;
  --accent-rgb: 99,212,155;
  --accent-soft: rgba(99,212,155,0.12);
  --accent-line: rgba(99,212,155,0.36);
  --accent-deep: #4FBF87;
  --red: #F2726B;
  --green: #63D49B;
  --amber: #EDB868;

  --r-card: 22px;
  --r-row: 20px;
  --r-ctl: 12px;
  --nav-h: 61px;

  /* Compat aliases — older markup still references these names */
  --glass-top: rgba(255,255,255,0.09);
  --glass-bot: rgba(255,255,255,0.03);
  --accent-copper: var(--accent);
  --accent-copper-deep: var(--accent-deep);
  --accent-copper-glow: var(--accent-line);
  --accent-red: var(--red);
  --accent-gold: var(--amber);
  --accent-green: var(--green);
  --bg-4: var(--bg-2);
  --bg-5: var(--bg-3);
  --line-cold: var(--line-2);
  --rail: 0px;
  --t-display: 22px; --t-h2: 13px; --t-h3: 12.5px; --t-body: 12.5px; --t-sm: 11.5px; --t-xs: 10px;
}
html { background: var(--bg-0); }
html, body {
  margin: 0; padding: 0;
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  font-feature-settings: "cv11", "ss01";
  letter-spacing: -0.005em;
  background: var(--bg-0);
  color: var(--text-1);
  overflow: hidden;
  overscroll-behavior: none;
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none; user-select: none;
  touch-action: manipulation;
}
body::before {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: linear-gradient(180deg, #1B1B1B 0%, #151515 38%, #121212 100%);
}
body::after { display: none; }

#scroller {
  position: absolute; inset: 0;
  overflow-y: auto; overflow-x: hidden;
  overscroll-behavior-y: contain;
  -webkit-overflow-scrolling: touch;
}
#app {
  position: relative; z-index: 1;
  max-width: 520px; margin: 0 auto;
  padding:
    calc(max(env(safe-area-inset-top), 14px) + 8px)
    13px
    calc(max(env(safe-area-inset-bottom), 14px) + var(--nav-h) + 34px)
    13px;
  min-height: 100%;
}

button, input, select, textarea { font-family: inherit; }
button { cursor: pointer; color: inherit; }
input, textarea, select {
  -webkit-user-select: text; user-select: text;
  color: var(--text-1) !important;
  caret-color: var(--accent);
  background-color: rgba(0,0,0,0.22) !important;
  border: 1px solid var(--line-2);
  border-radius: var(--r-ctl);
  padding: 11px 13px;
  font-size: 14px; font-weight: 500;
  outline: none; width: 100%;
  letter-spacing: -0.005em;
  transition: border-color 0.15s, background-color 0.15s;
}
select option { background: var(--bg-1); color: var(--text-1); }
input:focus, textarea:focus, select:focus { border-color: rgba(255,255,255,0.38); }
input::placeholder, textarea::placeholder { color: var(--text-4) !important; font-weight: 400; }
input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus {
  -webkit-text-fill-color: var(--text-1) !important;
  -webkit-box-shadow: 0 0 0 1000px var(--bg-2) inset !important;
  transition: background-color 5000s ease-in-out 0s;
}
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type="number"] { -moz-appearance: textfield; }
input[type="range"] { accent-color: var(--accent); padding: 0; background: transparent !important; border: none; }
input[type="checkbox"], input[type="radio"] { width: auto; accent-color: var(--accent); }
::-webkit-scrollbar { width: 0; height: 0; display: none; }
* { scrollbar-width: none; -ms-overflow-style: none; }

/* ============================================================
   CARDS
   ============================================================ */
.glass {
  position: relative;
  background: var(--card);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-card);
  box-shadow: var(--lit), 0 10px 26px rgba(0,0,0,0.30);
}
.glass.p-5 { padding: 17px 18px 18px; }
.glass.p-4 { padding: 14px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; min-height: 20px; }
.card-title { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; color: var(--text-1); }
.card-title svg { color: var(--text-1); flex-shrink: 0; }
.card-note { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }

/* ============================================================
   HEADER
   ============================================================ */
header {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  margin: 0 7px 22px; min-height: 28px;
}
h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.025em; margin: 0; color: var(--text-1); line-height: 28px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  height: 28px; padding: 0 11px; border-radius: 999px;
  background: linear-gradient(112deg, #303030, #222222);
  border: 1px solid var(--glass-line);
  box-shadow: var(--lit);
  color: var(--text-1); font-size: 14px; font-weight: 600;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.pill.caps { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 0 12px; }
.pill.icon-only { width: 28px; padding: 0; justify-content: center; }
.eyebrow { font-size: 12px; color: var(--text-3); margin-bottom: 4px; font-weight: 500; }
.lv-pill {
  display: inline-flex; align-items: center; height: 17px; padding: 0 7px; border-radius: 999px;
  background: rgba(0,0,0,0.22); border: 1px solid rgba(255,255,255,0.05);
  color: var(--text-1); font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: 0.01em;
}
.section-label {
  display: flex; align-items: center; justify-content: space-between;
  margin: 0 7px 9px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--text-3);
}
.section-label button {
  background: none; border: none; padding: 2px 0; color: var(--text-2);
  font-size: 12px; font-weight: 600; letter-spacing: 0; text-transform: none;
  display: inline-flex; align-items: center; gap: 2px;
}

/* ============================================================
   HERO
   ============================================================ */
.hero { display: flex; align-items: center; gap: 12px; padding: 15px 14px 15px 19px; min-height: 124px; margin-bottom: 22px; }
.hero-title { font-size: 19px; font-weight: 600; letter-spacing: -0.035em; line-height: 1.15; }
.hero-sub { font-size: 12px; color: var(--text-3); margin-top: 5px; line-height: 1.32; max-width: 215px; }
.hero-xp-label { font-size: 11px; color: var(--text-3); margin-top: 9px; }
.hero-xp { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
.ring { position: relative; width: 94px; height: 94px; flex-shrink: 0; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
.ring circle { fill: none; stroke-width: 6.6; }
.ring .track { stroke: #3A3A3A; }
.ring .fill { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 0.7s ease; }
.ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring-center small { font-size: 11px; color: var(--text-3); font-weight: 400; }
.ring-center b { font-size: 19px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.2; }

/* Quick action row — full pill */
.quick {
  width: 100%; min-height: 50px; display: flex; align-items: center; gap: 12px; text-align: left;
  padding: 8px 20px 8px 18px; margin-bottom: 11px;
  border-radius: 999px;
  background: var(--card-soft);
  border: 1px solid var(--glass-line);
  box-shadow: var(--lit);
  color: var(--text-1);
}
.quick.gap-after { margin-bottom: 22px; }
.quick .q-ico {
  width: 28px; height: 28px; border-radius: 999px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: #333333; color: var(--text-1);
}
.quick .q-title { font-size: 13px; font-weight: 600; letter-spacing: -0.005em; }
.quick .q-sub { font-size: 11px; color: var(--text-3); margin-top: 2px; }
.quick .q-arrow { margin-left: auto; color: var(--text-4); display: flex; }

/* ============================================================
   MISSION CARD
   ============================================================ */
.mission {
  width: 100%; display: flex; align-items: flex-start; gap: 12px; text-align: left;
  padding: 14px 11px 11px 12px; margin-bottom: 11px;
  border-radius: var(--r-row);
  background: var(--card);
  border: 1px solid var(--glass-line);
  box-shadow: var(--lit), 0 8px 20px rgba(0,0,0,0.25);
  color: var(--text-1);
}
.mcheck {
  width: 31px; height: 31px; border-radius: 999px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: #0A0A0A; padding: 0; border: none;
}
.mcheck i {
  width: 18px; height: 18px; border-radius: 999px;
  display: flex; align-items: center; justify-content: center;
  border: 1.6px solid #EDEDED; color: transparent;
}
.mission.done .mcheck i { background: var(--accent); border-color: var(--accent); color: #0A0A0A; }
.m-body { flex: 1; min-width: 0; }
.m-title { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 600; letter-spacing: -0.005em; line-height: 18px; }
.m-title > span.m-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.m-title .m-ico { color: var(--text-1); display: flex; flex-shrink: 0; }
.m-meta { display: flex; align-items: center; gap: 8px; margin-top: 8px; height: 18px; font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.m-meta .m-meta-l { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.xp-chip {
  display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0;
  height: 18px; padding: 0 9px; border-radius: 999px;
  background: #353535; border: 1px solid rgba(255,255,255,0.07);
  color: var(--text-1); font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.m-bar { height: 4.5px; border-radius: 999px; background: rgba(255,255,255,0.06); margin-top: 9px; overflow: hidden; }
.m-bar > i { display: block; height: 100%; border-radius: 999px; background: #505058; transition: width 0.5s ease; }
.mission.done .m-bar > i { background: var(--accent); }

/* Progress rows (pillars) */
.prow { padding-bottom: 14px; }
.prow:last-child { padding-bottom: 0; }
.prow-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; }
.prow-name { font-size: 12px; font-weight: 600; }
.prow-bar { height: 4.5px; border-radius: 999px; min-width: 4.5px; transition: width 0.6s ease; }
.prow-xp { font-size: 11px; color: var(--text-3); margin-top: 8px; font-variant-numeric: tabular-nums; }

/* ============================================================
   BOTTOM NAV
   ============================================================ */
#tabbar {
  position: fixed; z-index: 30;
  left: 50%; transform: translateX(-50%);
  bottom: max(env(safe-area-inset-bottom), 14px);
  width: calc(100% - 26px); max-width: 494px; height: var(--nav-h);
  display: flex; align-items: center; justify-content: space-around;
  padding: 0 10px;
  border-radius: 30px;
  background: linear-gradient(100deg, rgba(64,64,64,0.94) 0%, rgba(42,42,42,0.94) 38%, rgba(31,31,31,0.94) 100%);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.12);
  box-shadow: var(--lit), 0 16px 34px rgba(0,0,0,0.55);
}
.tab-btn {
  flex: 1; min-width: 0; height: 48px; position: relative;
  background: transparent; border: none; padding: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  color: #8B8F98;
  transition: color 0.15s;
}
.tab-btn svg { width: 21px; height: 21px; }
.tab-btn span { font-size: 11px; font-weight: 500; letter-spacing: 0; }
.tab-btn.active { color: #FFFFFF; }
.tab-btn .tab-dot {
  position: absolute; top: 5px; right: calc(50% - 15px);
  width: 6px; height: 6px; border-radius: 999px; background: var(--accent);
}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn {
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--line-2);
  color: var(--text-1);
  height: 30px; padding: 0 13px; border-radius: 999px;
  font-size: 13px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn:active { background: rgba(255,255,255,0.12); }
.btn-ghost { background: transparent; border: 1px solid var(--line-2); color: var(--text-1); height: 30px; padding: 0 13px; border-radius: 999px; font-size: 13px; font-weight: 600; }
.btn-primary {
  background: #FFFFFF; color: #0A0A0A; border: 1px solid #FFFFFF;
  height: 44px; padding: 0 20px; border-radius: 999px;
  font-weight: 600; font-size: 14px; width: 100%;
}
.btn-primary:active { background: #DADADA; }
.btn-white { background: #FFFFFF; color: #0A0A0A; border: none; height: 38px; border-radius: 999px; font-size: 13px; font-weight: 600; }
.btn-danger { background: var(--red); color: #1A0706; border: none; height: 38px; padding: 0 16px; border-radius: 999px; font-size: 13px; font-weight: 600; }
.btn-pillar { padding: 6px 13px; border-radius: 999px; font-size: 13px; font-weight: 600; border: 1px solid; }
.btn[disabled], button[disabled] { opacity: 0.4; cursor: not-allowed; }

/* ============================================================
   SHARED BITS
   ============================================================ */
.statbar { width: 100%; height: 4.5px; background: rgba(255,255,255,0.07); border-radius: 999px; overflow: hidden; }
.statbar > div { height: 100%; border-radius: 999px; transition: width 0.6s ease; }
.ring-wrap { position: relative; display: inline-flex; align-items: center; justify-content: center; }
.ring-wrap svg { transform: rotate(-90deg); }
.ring-wrap circle { transition: stroke-dashoffset 0.8s ease; }
.ring-label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring-sub { font-size: 11px; color: var(--text-3); }
.ring-val { font-size: 19px; font-weight: 600; color: var(--text-1); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

.pillar-card { background: rgba(0,0,0,0.18); border: 1px solid var(--line-1); border-radius: 16px; padding: 12px 13px; }
.pillar-card .pc-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 9px; }
.pillar-card .pc-name { font-size: 13px; font-weight: 600; color: var(--text-1); display: flex; align-items: center; gap: 7px; }
.pillar-card .pc-lv { font-size: 11px; padding: 2px 7px; border-radius: 999px; font-variant-numeric: tabular-nums; font-weight: 600; }
.pillar-card .pc-xp { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-3); margin-top: 7px; font-variant-numeric: tabular-nums; }

/* Task / routine row */
.row-card {
  background: var(--card);
  border: 1px solid var(--glass-line);
  box-shadow: var(--lit);
  border-radius: var(--r-row); padding: 13px; margin-bottom: 10px;
}
.row-card .row-top { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 11px; }
.row-card .row-icon { width: 31px; height: 31px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.row-card .row-name { font-size: 14px; font-weight: 600; color: var(--text-1); line-height: 1.3; word-break: break-word; letter-spacing: -0.005em; }
.row-card .row-meta { display: flex; flex-wrap: wrap; gap: 3px 9px; font-size: 12px; color: var(--text-3); margin-top: 4px; }
.row-card .row-actions { display: flex; justify-content: space-between; align-items: center; padding-top: 11px; border-top: 1px solid var(--line-1); gap: 8px; }
.row-card .row-actions-left { display: flex; gap: 6px; }

/* Tinted status chip (recovery legend) */
.tone-chip {
  display: inline-flex; align-items: center; gap: 6px;
  height: 24px; padding: 0 10px; border-radius: 999px; border: 1px solid;
  font-size: 12px; font-weight: 600;
}
.tone-chip i { width: 6px; height: 6px; border-radius: 999px; }

/* Muscle picker */
.mp-groups { display: flex; flex-wrap: wrap; gap: 6px; }
.mp-group {
  display: inline-flex; align-items: center; height: 30px; padding: 0 12px; border-radius: 999px;
  background: rgba(255,255,255,0.05); border: 1px solid var(--line-2);
  color: var(--text-2); font-size: 13px; font-weight: 600;
}
.mp-group.has { color: var(--text-1); }
.mp-group.open { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.4); color: var(--text-1); }
.mp-group b {
  margin-left: 6px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--accent); color: #0A0A0A; font-size: 11px; font-weight: 700;
}
.mp-subs {
  display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; padding: 10px;
  border-radius: 14px; background: rgba(0,0,0,0.22); border: 1px solid var(--line-1);
}
.mp-chip {
  height: 28px; padding: 0 11px; border-radius: 999px;
  background: rgba(255,255,255,0.05); border: 1px solid var(--line-2);
  color: var(--text-2); font-size: 12.5px; font-weight: 500;
}
.mp-chip.on { background: #FFFFFF; border-color: #FFFFFF; color: #0A0A0A; font-weight: 600; }

/* Activity calendar */
.fuel-quick { display: flex; gap: 7px; margin: 14px -2px 0; padding: 0 2px; overflow-x: auto; scrollbar-width: none; }
.fuel-quick::-webkit-scrollbar { display: none; }
.fuel-quick button { flex-shrink: 0; height: 32px; padding: 0 13px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid var(--line-2); color: var(--text-1); font-size: 13px; font-weight: 600; white-space: nowrap; }
.fuel-quick button:active { background: rgba(255,255,255,0.14); }
.heat { display: flex; gap: 8px; }
.heat-days { display: grid; grid-template-rows: repeat(7, 1fr); gap: 3px; margin-top: 15px; font-size: 11px; color: var(--text-3); }
.heat-days span { display: flex; align-items: center; }
.heat-months { display: grid; gap: 3px; height: 12px; margin-bottom: 3px; font-size: 11px; color: var(--text-3); }
.heat-months span { white-space: nowrap; overflow: visible; width: 0; }
.heat-grid { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, auto); gap: 3px; }
.heat-grid i { aspect-ratio: 1; border-radius: 3px; background: rgba(255,255,255,0.07); }
.heat-grid i.l1 { background: rgba(99,212,155,0.18); }
.heat-grid i.l2 { background: rgba(99,212,155,0.66); }
.heat-grid i.l3 { background: #63D49B; }
.heat-grid i.future { background: transparent; }

/* ============================================================
   MODALS
   ============================================================ */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(8,8,8,0.68);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  display: flex; align-items: flex-end; justify-content: center; padding: 13px;
  animation: fadeIn 0.2s ease;
}
@media (min-width: 640px) { .modal-backdrop { align-items: center; } }
.modal {
  width: 100%; max-width: 460px;
  background: linear-gradient(112deg, #2E2E2E 0%, #242424 45%, #1C1C1C 100%);
  border: 1px solid rgba(255,255,255,0.13);
  border-radius: 24px; padding: 18px;
  max-height: 86vh; overflow-y: auto;
  box-shadow: var(--lit), 0 30px 80px rgba(0,0,0,0.6);
  animation: slideUp 0.26s ease-out;
}

.wr-star { width: 36px; height: 36px; border-radius: 999px; background: none; border: none; color: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center; }

.rest-pick { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; font-size: 13.5px; color: var(--text-3); }
.rest-pick > div { display: flex; padding: 3px; border-radius: 999px; background: rgba(0,0,0,0.22); border: 1px solid var(--line-1); }
.rest-pick button { height: 32px; padding: 0 12px; border-radius: 999px; background: none; border: none; color: var(--text-3); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.rest-pick button.on { background: rgba(255,255,255,0.14); color: var(--text-1); }

/* Habits */
.hb { padding: 14px 12px 14px 14px; margin-bottom: 10px; border-radius: 20px; }
.hb.rest { opacity: 0.6; }
.hb-top { display: flex; align-items: center; gap: 12px; }
.hb-body { flex: 1; min-width: 0; }
.hb-name { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; letter-spacing: -0.015em; }
.hb-name span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb-meta { font-size: 13px; color: var(--text-3); margin-top: 3px; font-variant-numeric: tabular-nums; }
.hb.done .mcheck i { background: var(--accent); border-color: var(--accent); color: #0A0A0A; }
.wk { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 14px 2px 0 52px; }
.wk span { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.wk i { width: 100%; height: 6px; border-radius: 999px; background: rgba(255,255,255,0.08); }
.wk small { font-size: 11px; color: var(--text-4); font-weight: 600; }
.wk .on i { background: var(--accent); }
.wk .miss i { background: rgba(255,255,255,0.2); }
.wk .today i { background: rgba(255,255,255,0.08); box-shadow: 0 0 0 1px rgba(255,255,255,0.4); }
.wk .today small { color: var(--text-1); }
.wk .off i { background: transparent; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); }
.hb-stats { display: flex; gap: 18px; margin-top: 14px; font-size: 13px; color: var(--text-3); }
.hb-stats b { color: var(--text-1); font-weight: 600; font-variant-numeric: tabular-nums; }
.grp { width: 100%; display: flex; align-items: center; gap: 8px; margin: 18px 0 10px; padding: 4px 6px; background: none; border: none; color: var(--text-2); font-size: 13px; font-weight: 600; letter-spacing: 0.04em; }
.grp-chev { display: inline-flex; color: var(--text-3); transition: transform 0.2s; }
.grp-chev.open { transform: rotate(90deg); }
.vice { border-radius: 16px; background: rgba(255,255,255,0.035); border: 1px solid var(--line-1); padding: 4px 6px 4px 4px; }
.vice-main { gap: 12px; padding: 8px 8px 8px 12px; }
.vice-dot { width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0; }
.vice-log { font-size: 13px; font-weight: 600; color: var(--text-2); flex-shrink: 0; }
.tier-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.tier-row label { cursor: pointer; margin: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 6px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid var(--line-1); color: var(--text-3); }
.tier-row label b { font-size: 13.5px; font-weight: 600; }
.tier-row label small { font-size: 12px; }
.tier-row label.on { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); color: var(--text-1); }

/* Fuel */
.meters { display: flex; flex-direction: column; gap: 14px; }
.meter-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--text-3); margin-bottom: 7px; font-variant-numeric: tabular-nums; }
.meter-top b { color: var(--text-1); font-weight: 600; font-size: 15px; }
.meters.big .meter-top b { font-size: 22px; letter-spacing: -0.03em; }
.meter-bar { height: 7px; border-radius: 999px; background: rgba(255,255,255,0.07); overflow: hidden; }
.meters.big .meter-bar { height: 9px; }
.meter-bar > div { height: 100%; border-radius: 999px; transition: width 0.5s ease; }
.fuel-quick { gap: 8px; margin: 16px -18px 0; padding: 0 18px; }
.fuel-quick button { height: 40px; padding: 0 15px; font-size: 14px; }
.qa-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.qa-grid button { height: 58px; border-radius: 16px; background: rgba(255,255,255,0.06); border: 1px solid var(--line-2); color: var(--text-1); font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
.qa-grid button:active { background: rgba(255,255,255,0.14); }
.qa-grid small { font-size: 11.5px; font-weight: 500; color: var(--text-3); }
.exact { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; margin-top: 10px; }
.exact input { text-align: center; min-width: 0; padding: 12px 8px; }
.meals { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.meal { display: flex; align-items: center; border-radius: 16px; background: rgba(255,255,255,0.035); border: 1px solid var(--line-1); padding: 2px 4px 2px 2px; }
.meal-main { flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 12px; }
.meal-main b { font-size: 15px; font-weight: 600; }
.meal-main small { font-size: 13px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.hist-row { display: grid; grid-template-columns: 1fr auto 64px; gap: 14px; padding: 12px 2px; border-bottom: 1px solid var(--line-1); font-size: 14px; font-variant-numeric: tabular-nums; }
.hist-row:last-child { border-bottom: none; }
.hist-row span { color: var(--text-2); text-align: right; }
.hist-row span:first-child { color: var(--text-1); text-align: left; }
.hist-row span.hit { color: var(--accent); }

/* Charts */
.chart { display: flex; gap: 10px; }
.chart-y { display: flex; flex-direction: column; justify-content: space-between; height: 130px; font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; text-align: right; min-width: 28px; }
.chart-main { flex: 1; min-width: 0; position: relative; }
.chart-main svg { display: block; width: 100%; height: 130px; overflow: visible; }
.chart-dot { position: absolute; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 999px; background: #fff; box-shadow: 0 0 0 4px rgba(255,255,255,0.14); }
.chart-main .chart-dot { top: 0; }
.chart-x { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--text-3); margin-top: 9px; font-variant-numeric: tabular-nums; }

.chart-cap { font-size: 12px; color: var(--text-3); margin-top: 10px; }

.bars > div { height: 100%; display: flex; align-items: flex-end; }
.bars i { display: block; width: 100%; border-radius: 6px 6px 0 0; background: rgba(255,255,255,0.28); }
.bars i.now { background: #fff; }
.bars-x { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
.bars-x span { text-align: center; font-size: 10.5px; overflow: hidden; white-space: nowrap; }

.heat { gap: 8px; }
.heat-days { font-size: 10.5px; gap: 3px; margin-top: 17px; }
.heat-months { font-size: 11px; height: 14px; }
.heat-grid { gap: 3px; }
.heat-grid i { border-radius: 4px; }
.prow-name { font-size: 15px; }
.prow-xp { font-size: 12.5px; }

/* Body-map legend */
.tone-chip { height: 28px; font-size: 12.5px; padding: 0 12px; }

/* Bottom nav */
:root { --nav-h: 66px; }
.tab-btn { height: 54px; gap: 4px; }
.tab-btn span, .tab-btn .tab-label { font-size: 11.5px; }

.float-xp { left: 50% !important; bottom: auto; top: calc(max(env(safe-area-inset-top), 12px) + 6px); padding: 9px 16px; border-radius: 999px; background: rgba(40,40,40,0.96); border: 1px solid var(--line-2); box-shadow: 0 10px 28px rgba(0,0,0,0.5); font-size: 14px; font-weight: 600; letter-spacing: -0.005em; text-shadow: none !important; white-space: nowrap; z-index: 70; animation: toastIn 1.6s ease forwards; }

.modal-head h3 { font-size: 22px; }
.modal-close { width: 38px; height: 38px; }
.modal label { font-size: 13px; margin-bottom: 8px; }
.day-chip { height: 42px; font-size: 13px; }
.mp-group, .mp-chip { min-height: 38px; font-size: 14px; }

.st-row { grid-template-columns: 22px minmax(0, 1fr) 68px 68px 44px; }
.st-row.bw { grid-template-columns: 22px minmax(0, 1fr) 58px 58px 38px 42px; }
.st-last { display: flex; flex-direction: column; gap: 1px; line-height: 1.2; }
.st-last span { overflow: hidden; text-overflow: ellipsis; }
.st-last b { margin-left: 0; font-size: 12px; }
.days7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.days7 .day-chip { height: 44px; padding: 0; }
.rx { display: flex; align-items: center; gap: 6px; padding: 8px 0; border-bottom: 1px solid var(--line-1); }
.rx:last-child { border-bottom: none; }
.rx-move { display: flex; flex-direction: column; margin-left: -6px; }
.rx-move button { width: 36px; height: 26px; background: none; border: none; color: var(--text-3); display: flex; align-items: center; justify-content: center; }
.rx-move button[disabled] { opacity: 0.2; }
.rx .rt-body b i { color: var(--text-2); background: rgba(255,255,255,0.08); }

.note-row { padding: 12px 0; border-bottom: 1px solid var(--line-1); }
.note-row:first-of-type { padding-top: 0; }
.note-row:last-child { border-bottom: none; padding-bottom: 0; }
.note-top { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-3); }
.note-top b { font-size: 15px; font-weight: 600; color: var(--text-1); }
.note-top .lg-stars { margin-left: auto; }
.note-row p { margin: 6px 0 0; font-size: 14px; color: var(--text-2); line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }

.modal-form > button.btn-primary { margin-top: 20px; }
.link, .section-label button { min-height: 36px; }
button.tile { text-align: left; color: inherit; font-family: inherit; cursor: pointer; }
button.tile:active { background: var(--bg-2); }
/* V3_END */

const xpForLevel = (lvl) => Math.floor(100 * Math.pow(lvl, 1.5));
const hoursSince = (ts) => (Date.now() - ts) / 36e5;
const daysSince = (ts) => (Date.now() - ts) / 86400000;
const dayKey = (d = new Date()) => d.toISOString().slice(0,10);

// Calendar days between two timestamps. Returns the integer difference.
// e.g. yesterday → today = 1, today → today = 0.
function calendarDaysSince(ts) {
  if (!ts) return Infinity;
  const a = new Date(ts); a.setHours(0,0,0,0);
  const b = new Date();   b.setHours(0,0,0,0);
  return Math.round((b - a) / 86400000);
}

// Habit "due today" check — calendar-based for daily habits, hours-based for weekly.
// If a habit has a `days` array (0=Sun..6=Sat), it's only due on those weekdays.
function habitScheduledToday(h) {
  if (!Array.isArray(h.days) || h.days.length === 0) return true; // no restriction
  return h.days.includes(new Date().getDay());
}
function habitDueToday(h) {
  if (!habitScheduledToday(h)) return false;
  if (!h.lastCheckIn) return true;
  if (h.frequency === 'daily') {
    return calendarDaysSince(h.lastCheckIn) >= 1;
  }
  // Weekly: use rolling 168-hour window
  return hoursSince(h.lastCheckIn) >= 168 * 0.9;
}

// Streak still safe? Daily habits keep streaks across one missed calendar day boundary
// (i.e. checked in yesterday counts as 'still going'). Broken if 2+ days missed.
// For day-of-week scheduled habits, only scheduled days count against the streak —
// e.g. a Mon/Wed/Fri habit doesn't break if you skip a Tuesday.
function habitStreakBroken(h) {
  if (!h.lastCheckIn || h.streak === 0) return false;
  if (h.frequency === 'daily') {
    if (Array.isArray(h.days) && h.days.length > 0) {
      // Count how many scheduled days have passed since last check-in
      const lastDay = new Date(h.lastCheckIn);
      lastDay.setHours(0,0,0,0);
      const today = new Date();
      today.setHours(0,0,0,0);
      let scheduledMissed = 0;
      for (let d = new Date(lastDay.getTime() + 86400000); d < today; d = new Date(d.getTime() + 86400000)) {
        if (h.days.includes(d.getDay())) scheduledMissed += 1;
      }
      return scheduledMissed >= 2;
    }
    return calendarDaysSince(h.lastCheckIn) >= 2;
  }
  // Weekly: original rule — broken if > 1.5x the period
  return hoursSince(h.lastCheckIn) > 168 * 1.5;
}

// Continuation check used by checkInHabit to decide if streak increments or resets.
// For daily habits, you continue if your last check-in was today or yesterday.
function habitStreakContinues(h) {
  if (!h.lastCheckIn) return false;
  if (h.frequency === 'daily') {
    return calendarDaysSince(h.lastCheckIn) <= 1;
  }
  return hoursSince(h.lastCheckIn) < 168 * 1.5;
}

const startOfWeek = () => {
  const d = new Date();
  const day = d.getDay();
  const diff = day === 0 ? 6 : day - 1;
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() - diff);
  return d.getTime();
};
const endOfWeek = () => {
  const d = new Date(startOfWeek());
  d.setDate(d.getDate() + 6);
  d.setHours(23,59,59,999);
  return d.getTime();
};

const calcTotalLevel = (pillars) => {
  const lvls = Object.values(pillars).map(p => p.level);
  return Math.max(1, Math.floor(lvls.reduce((a,b) => a+b, 0) / lvls.length));
};

const disciplineMultiplier = (d) => {
  if (d >= 90) return { mult: 1.5, tier: 'Elite',      color: '#63D49B' };
  if (d >= 70) return { mult: 1.2, tier: 'Consistent', color: '#63D49B' };
  if (d >= 50) return { mult: 1.0, tier: 'Steady',     color: '#EDB868' };
  return            { mult: 0.5, tier: 'Slacking',   color: '#F2726B' };
};

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

   ============================================================ */
function applyXpToPillar(pillarKey, amount) {
  const p = { ...S.pillars[pillarKey] };
  let xp = p.xp + amount;
  let level = p.level;
  const ups = [];
  let needed = xpForLevel(level);
  let safety = 0;
  while (xp >= needed && safety < 50) {
    xp -= needed;
    level += 1;
    ups.push({ pillar: pillarKey, newLevel: level });
    needed = xpForLevel(level);
    safety++;
  }
  S.pillars[pillarKey] = { level, xp };
  return ups;
}

// Returns the ISO week key, e.g. '2026-W19', for use in weeklyXp tracking
function weekKey(d) {
  d = d ? new Date(d) : new Date();
  const dt = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = (dt.getUTCDay() + 6) % 7;
  dt.setUTCDate(dt.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(dt.getUTCFullYear(), 0, 4));
  const diff = (dt - firstThursday) / 86400000;
  const week = 1 + Math.round((diff - 3 + ((firstThursday.getUTCDay() + 6) % 7)) / 7);
  return `${dt.getUTCFullYear()}-W${String(week).padStart(2, '0')}`;
}

function shieldActive() {
  return (S.shieldActiveUntil || 0) > Date.now();
}

function awardXp(baseXp, pillarKey, applyMult = true) {
  if (!PILLARS[pillarKey]) pillarKey = 'intellect'; // safe fallback
  const m = applyMult ? disciplineMultiplier(discipline()).mult : 1;
  const finalXp = Math.max(0, Math.round(baseXp * m));
  const ups = applyXpToPillar(pillarKey, finalXp);
  S.lifetimeXp += finalXp;
  S.credits = (S.credits || 0) + finalXp;

  // Track weekly XP for Shadow Protocol
  const wk = weekKey();
  S.weeklyXp[wk] = (S.weeklyXp[wk] || 0) + finalXp;
  // Per-day XP feeds the activity calendar on Today
  if (!S.dailyXp || typeof S.dailyXp !== 'object') S.dailyXp = {};
  const dk = dayKey();
  S.dailyXp[dk] = (S.dailyXp[dk] || 0) + finalXp;

  if (ups.length > 0) {
    const last = ups[ups.length - 1];
    showLevelUp(last.pillar, last.newLevel);
  }
  return finalXp;
}

function checkPerfectDay() {
  const today = dayKey();
  if (S.perfectDays.includes(today)) return;
  if (S.habits.length === 0) return;
  const allDone = S.habits.every(h => h.lastCheckIn && !habitDueToday(h));
  if (!allDone) return;
  S.perfectDays.push(today);
  const per = Math.floor(XP.PERFECT_DAY / 4);
  Object.keys(PILLARS).forEach(p => awardXp(per, p, true));
  spawnFloat(`PERFECT DAY +${XP.PERFECT_DAY} XP`, '#63D49B');
  S.log.unshift({ id: `${Date.now()}-perfect`, ts: Date.now(), type: 'victory',
    text: `Perfect day · all habits done · +${XP.PERFECT_DAY} XP` });
}

function checkInHabit(id) {
  const h = S.habits.find(x => x.id === id);
  if (!h) return;
  if (!habitDueToday(h)) return; // already done today

  // Snapshot pre-mutation state so we can undo a misclick
  const snapshot = {
    habitId: id,
    prevStreak: h.streak,
    prevLastCheckIn: h.lastCheckIn,
    prevPillar: { ...S.pillars[h.pillar] },
    prevCredits: S.credits || 0,
    prevLifetimeXp: S.lifetimeXp || 0,
    prevWeeklyXp: { ...(S.weeklyXp || {}) },
    prevDailyXp: { ...(S.dailyXp || {}) },
    prevPerfectDays: [...(S.perfectDays || [])],
    prevDisciplineCount: (S.disciplineEvents || []).length,
    ts: Date.now(),
  };

  const continued = habitStreakContinues(h);
  const newStreak = continued ? h.streak + 1 : 1;
  const streakMult = newStreak >= 7 ? 1.5 : newStreak >= 3 ? 1.25 : 1;
  const habitXp = (typeof h.xp === 'number' && h.xp > 0) ? h.xp : XP.HABIT;
  const baseXp = Math.round(habitXp * streakMult);

  const p = PILLARS[h.pillar];
  const display = awardXp(baseXp, h.pillar);
  spawnFloat(`+${display} XP`, p.color);

  h.streak = newStreak;
  h.lastCheckIn = Date.now();
  if (!Array.isArray(h.history)) h.history = [];
  if (!h.history.includes(dayKey())) h.history.push(dayKey());
  if (h.history.length > 400) h.history = h.history.slice(-400);
  snapshot.prevBest = h.best || 0;
  h.best = Math.max(h.best || 0, newStreak);

  S.disciplineEvents = S.disciplineEvents
    .filter(e => e.ts >= Date.now() - 30*86400000)
    .concat({ ts: Date.now(), type: 'completion', source: 'habit', habitId: id });

  const logEntryId = `${Date.now()}-${id}`;
  S.log.unshift({ id: logEntryId, ts: Date.now(), type: 'gain',
    text: `"${h.name}" complete · +${display} XP${streakMult>1?` · ${newStreak}🔥`:''}` });
  S.log = S.log.slice(0, 200);

  // Save undo handle on UI — last action eligible for one-tap undo
  UI.lastHabitAction = { ...snapshot, logEntryId, habitName: h.name };

  checkPerfectDay();
  persist();
  render();
}

// Undo the most recent habit check-in. Only works for the last action,
// and only within a short window after the tap.
function undoHabitCheckIn() {
  const a = UI.lastHabitAction;
  if (!a) return;
  const h = S.habits.find(x => x.id === a.habitId);
  if (!h) { UI.lastHabitAction = null; return; }
  // Restore habit fields
  h.streak = a.prevStreak;
  h.lastCheckIn = a.prevLastCheckIn;
  if (Array.isArray(h.history)) h.history = h.history.filter(k => k !== dayKey(new Date(a.ts)));
  if (typeof a.prevBest === 'number') h.best = a.prevBest;
  // Restore stats
  S.pillars[h.pillar] = { ...a.prevPillar };
  S.credits = a.prevCredits;
  S.lifetimeXp = a.prevLifetimeXp;
  S.weeklyXp = { ...a.prevWeeklyXp };
  if (a.prevDailyXp) S.dailyXp = { ...a.prevDailyXp };
  S.perfectDays = [...a.prevPerfectDays];
  // Strip the discipline event we added (just remove the most recent one matching this habit)
  if (Array.isArray(S.disciplineEvents)) {
    // Trim back to the count we had before, in case multiple events came in
    while (S.disciplineEvents.length > a.prevDisciplineCount) {
      S.disciplineEvents.pop();
    }
  }
  // Remove the log entry we added
  if (a.logEntryId) {
    S.log = S.log.filter(e => e.id !== a.logEntryId);
  }
  UI.lastHabitAction = null;
  spawnFloat(`Undone: ${a.habitName}`, 'rgba(255,255,255,0.85)');
  persist();
  render();
}
window.undoHabitCheckIn = undoHabitCheckIn;

// Reorder an exercise inside a routine by one step (dir = -1 up, +1 down).

function moveExercise(routineId, exId, dir) {

  if (!r || !Array.isArray(r.exercises)) return;

// Effective load per rep, accounting for bodyweight exercises.
// - weighted: just the bar weight
// - bodyweight: bodyweight + added weight (added can be negative for assistance)
function effectiveLoad(exercise, weightInput) {
  const w = (typeof weightInput === 'number') ? weightInput : parseFloat(weightInput) || 0;
  if (exercise && exercise.type === 'bodyweight') {
    return Math.max(0, (S.bodyweight || 75) + w);
  }
  return w;
}

function logSession(routineId, exerciseSets, opts) {
  const now = Date.now();
  const routine = S.routines.find(r => r.id === routineId);
  const notes = (opts && typeof opts.notes === 'string') ? opts.notes.trim().slice(0, 500) : '';
  let rating = (opts && typeof opts.rating === 'number') ? opts.rating : null;
  if (rating !== null && (rating < 1 || rating > 5)) rating = null;
  const extras = (opts && opts.extras && typeof opts.extras === 'object') ? opts.extras : {};
  const cardio = Array.isArray(opts && opts.cardio) ? opts.cardio : [];
  const session = {
    id: `s-${now}`, routineId, ts: now, completed: true,
    exercises: exerciseSets, notes, rating,
    extras, cardio,
  };

  // Resolve any exercise id against routine OR session extras
  const resolveEx = (exId) => (extras && extras[exId]) || (routine?.exercises.find(e => e.id === exId));

  let totalVolume = 0;
  const prList = [];
  const hitMuscles = new Set();
  const muscleVolume = {};

  Object.entries(exerciseSets).forEach(([exId, sets]) => {
    const ex = resolveEx(exId);
    if (!ex) return;
    // Allow negative weights for assisted bodyweight movements
    const minWeight = ex.type === 'bodyweight' ? -1000 : 0;
    const valid = sets.filter(s => s.reps > 0 && s.weight >= minWeight);
    if (!valid.length) return;

    // Track effective loads for PR purposes
    const effLoads = valid.map(s => effectiveLoad(ex, s.weight));
    const topEffWeight = Math.max(...effLoads);
    // Volume uses effective load too — so bodyweight pulls accumulate real tonnage
    const vol = valid.reduce((sum, s, idx) => sum + s.reps * effLoads[idx], 0);
    totalVolume += vol;

    // Track which muscles got worked + how much volume they absorbed.
    // Volume is divided evenly across the muscles trained, then weighted by
    // primary/secondary priority (primary = first in list = 1.5x weight,
    // secondary = 0.75x). This matches how compounds actually fatigue muscles.
    if (Array.isArray(ex.muscles) && ex.muscles.length > 0) {
      ex.muscles.forEach((m, idx) => {
        hitMuscles.add(m);
        const priorityWeight = idx === 0 ? 1.5 : 0.75;
        const share = (vol / ex.muscles.length) * priorityWeight;
        muscleVolume[m] = (muscleVolume[m] || 0) + share;
      });
    }

    const exName = ex.name || 'Exercise';
    const existing = S.prs[exId] || { topWeight: 0, topVolume: 0, topWeightTs: 0, topVolumeTs: 0 };

    if (topEffWeight > existing.topWeight && existing.topWeight > 0) {
      S.prs[exId] = { ...existing, topWeight: topEffWeight, topWeightTs: now };
      prList.push({ exerciseName: exName, type: 'weight', value: Math.round(topEffWeight*10)/10, prev: Math.round(existing.topWeight*10)/10, isBodyweight: ex.type === 'bodyweight' });
    } else if (topEffWeight > 0 && existing.topWeight === 0) {
      S.prs[exId] = { ...existing, topWeight: topEffWeight, topWeightTs: now };
    }
    if (vol > existing.topVolume && existing.topVolume > 0) {
      S.prs[exId] = { ...(S.prs[exId] || existing), topVolume: vol, topVolumeTs: now };
      if (!prList.find(p => p.exerciseName === exName)) {
        prList.push({ exerciseName: exName, type: 'volume', value: Math.round(vol), prev: Math.round(existing.topVolume), isBodyweight: ex.type === 'bodyweight' });
      }
    } else if (vol > 0 && existing.topVolume === 0) {
      S.prs[exId] = { ...(S.prs[exId] || existing), topVolume: vol, topVolumeTs: now };
    }
  });

  // Track per-muscle hit history for recovery state.
  // When a subdivision (e.g. upperChest) is hit, also record the parent (chest)
  // so the overview state for the parent stays accurate.
  if (!S.muscleHits || typeof S.muscleHits !== 'object') S.muscleHits = {};
  const expandedVolumes = {};
  const directHit = {};   // muscles named on an exercise, as opposed to inherited by a parent
  Object.keys(muscleVolume).forEach(m => {
    expandedVolumes[m] = muscleVolume[m];
    directHit[m] = true;
    const parent = MUSCLE_PARENT[m];
    if (parent) {
      // Parent absorbs the full subdivision volume — back gets hit when lats are hit
      expandedVolumes[parent] = (expandedVolumes[parent] || 0) + muscleVolume[m];
    }
  });
  Object.entries(expandedVolumes).forEach(([m, vol]) => {
    if (!MUSCLE_GROUPS[m]) return;
    if (!Array.isArray(S.muscleHits[m])) S.muscleHits[m] = [];
    // Normalised load: volume × profile loadScale.
    // The profile.loadScale acts as a per-muscle calibration — smaller muscles
    // accumulate fatigue faster per unit of volume.
    const prof = profileFor(m);
    const load = Math.max(1, Math.round(vol * prof.loadScale));
    const hit = { ts: now, sessionId: session.id, load };
    if (!directHit[m]) hit.derived = true;
    S.muscleHits[m].push(hit);
    // Keep last 200 hits per muscle
    if (S.muscleHits[m].length > 200) S.muscleHits[m] = S.muscleHits[m].slice(-200);
  });

  // Cardio: push each entry into S.cardioLog and record muscle hits for recovery.
  // Cardio load per muscle is modest — scaled by duration/value, not weight.
  if (Array.isArray(S.cardioLog) === false) S.cardioLog = [];
  cardio.forEach(c => {
    S.cardioLog.unshift({ ts: now, sessionId: session.id, name: c.name, value: c.value, unit: c.unit, muscles: c.muscles || [] });
    // Approximate recovery load per cardio muscle so radar status reflects it
    (c.muscles || []).forEach(m => {
      if (!MUSCLE_GROUPS[m]) return;
      if (!Array.isArray(S.muscleHits[m])) S.muscleHits[m] = [];
      // Modest load — tune so 20 min of sprints registers as a real stimulus but not a lift
      const load = Math.max(60, Math.round((parseFloat(c.value) || 0) * 15));
      S.muscleHits[m].push({ ts: now, sessionId: session.id, load });
      if (S.muscleHits[m].length > 200) S.muscleHits[m] = S.muscleHits[m].slice(-200);
    });
  });
  S.cardioLog = S.cardioLog.slice(0, 200);

  const baseGymXp = XP.GYM_SESSION + (prList.length * XP.PR_BONUS);
  const display = awardXp(baseGymXp, 'strength');
  spawnFloat(`+${display} XP`, '#F2726B');

  if (prList.length > 0) {
    showPR(prList[0]);
  }

  S.sessions.push(session);
  S.disciplineEvents = S.disciplineEvents
    .filter(e => e.ts >= now - 30*86400000)
    .concat({ ts: now, type: 'completion', source: 'gym', routineId });

  const routineName = routine?.name || 'Workout';
  prList.forEach(pr => S.log.unshift({
    id: `${now}-pr-${pr.exerciseName}`, ts: now, type: 'pr',
    text: `🏆 PR: ${pr.exerciseName} — ${pr.type === 'weight' ? `${pr.value}kg${pr.isBodyweight?' (effective)':''}` : `${pr.value} vol`} (was ${pr.prev || '0'})`,
  }));
  S.log.unshift({ id: `${now}-session`, ts: now, type: 'gain',
    text: `Logged "${routineName}" · vol ${Math.round(totalVolume)} · +${display} XP${prList.length?` (${prList.length} PR${prList.length>1?'s':''})`:''}` });
  S.log = S.log.slice(0, 200);

  UI.gymView = { kind: 'list' };
  persist(); render();
}

/* ============================================================
   DAILY TELEMETRY
   ============================================================ */
// Given a date key, count how many of the 5 daily targets were satisfied that day.
// Returns { count, total, items } where items is an ordered breakdown.
// The 5 targets are: tasks-all-done, calories-goal, protein-goal, workout-done-or-restday, body-recovered.
function computeDayStatus(key) {
  const items = [];
  // Tasks (habits): all cleared that day. We check by comparing lastCheckIn vs the day.
  // Since streaks reset on day change, we approximate by counting habits with lastCheckIn
  // that falls on that date. This isn't perfect for historical days but is right for
  // "yesterday" which is the primary use case.
  const dayStart = new Date(key + 'T00:00:00').getTime();
  const dayEnd = dayStart + 86400000;
  const habitsCount = (S.habits || []).length;
  let habitsDoneOnDay = 0;
  (S.habits || []).forEach(h => {
    if (h.lastCheckIn >= dayStart && h.lastCheckIn < dayEnd) habitsDoneOnDay += 1;
  });
  const tasksOk = habitsCount > 0 && habitsDoneOnDay === habitsCount;
  items.push({ id: 'tasks', ok: tasksOk, label: 'All habits done' });

  // Calories on that day
  const nut = (S.nutrition && S.nutrition[key]) || { cals: 0, protein: 0 };
  const calsOk = nut.cals >= (S.nutritionGoals?.cals || 2500);
  items.push({ id: 'cals', ok: calsOk, label: 'Calorie goal hit' });

  // Protein on that day
  const proteinOk = nut.protein >= (S.nutritionGoals?.protein || 160);
  items.push({ id: 'protein', ok: proteinOk, label: 'Protein goal hit' });

  // Workout: either a session was completed that day, or it was a rest day
  const dow = new Date(dayStart).getDay();
  const scheduledRoutine = (S.routines || []).find(r => r.schedule?.includes(dow));
  const workoutDone = (S.sessions || []).some(s =>
    s.completed && dayKey(new Date(s.ts)) === key
  );
  const workoutOk = workoutDone || !scheduledRoutine;
  items.push({ id: 'workout', ok: workoutOk, label: workoutDone ? 'Workout complete' : 'Rest day' });

  // Body: no muscles were sore going into next morning. Since we can't reliably
  // reconstruct historical muscleHits recovery state, treat this as "sessions
  // logged in past 48h didn't leave muscles in the sore stage". Approximation
  // for a single-day retrospective: use the current sore count if key is yesterday.
  // For older days, fall back to always-ok.
  const yesterdayKey = dayKey(new Date(Date.now() - 86400000));
  let bodyOk = true;
  if (key === yesterdayKey) {
    // Count muscles that were hit within 24h of the day's end
    let soreCount = 0;
    if (S.muscleHits && typeof S.muscleHits === 'object') {
      Object.entries(S.muscleHits).forEach(([k, hits]) => {
        if (typeof MUSCLE_GROUPS !== 'undefined' && MUSCLE_GROUPS[k] && MUSCLE_GROUPS[k].parent) return;
        if (!Array.isArray(hits) || hits.length === 0) return;
        const lastTs = hits[hits.length - 1].ts;
        if (Date.now() - lastTs < 86400000) soreCount += 1;
      });
    }
    bodyOk = soreCount === 0;
  }
  items.push({ id: 'body', ok: bodyOk, label: bodyOk ? 'Body recovered' : 'Muscles still sore' });

  const count = items.filter(x => x.ok).length;
  return { count, total: items.length, items };
}

// Dismiss the day-status banner for yesterday. Marks it as seen so it doesn't

function dismissYesterdayStatus() {

/* Discipline tier — categorical replacement for the old slider scale.
   Maps the numeric discipline (0–100) into one of three system tiers. */
function disciplineTier() {
  const d = discipline();
  if (d >= 80) return { id: 'optimal',  label: 'Optimal',  color: '#63D49B', bg: 'rgba(99,212,155,0.10)', border: 'rgba(99,212,155,0.35)' };
  if (d >= 50) return { id: 'nominal',  label: 'Nominal',  color: '#EDB868', bg: 'rgba(240,180,90,0.08)', border: 'rgba(240,180,90,0.28)' };
  return         { id: 'degraded', label: 'Degraded', color: '#F2726B', bg: 'rgba(242,114,107,0.10)',   border: 'rgba(242,114,107,0.35)' };
}

// ============ NUTRITION ============
function ensureNutritionDay(key) {
  if (!S.nutrition[key]) S.nutrition[key] = { cals: 0, protein: 0, entries: [] };
  return S.nutrition[key];
}

function addNutrition(cals, protein) {
  cals = Math.max(0, parseInt(cals) || 0);
  protein = Math.max(0, parseInt(protein) || 0);
  if (cals === 0 && protein === 0) return;
  const today = dayKey();
  const day = ensureNutritionDay(today);
  const beforeCals = day.cals;
  const beforeProtein = day.protein;
  day.cals += cals;
  day.protein += protein;
  day.entries.push({ ts: Date.now(), cals, protein });
  // Vitality XP for crossing daily targets — once per day
  if (beforeProtein < S.nutritionGoals.protein && day.protein >= S.nutritionGoals.protein) {
    const gained = awardXp(25, 'vitality');
    spawnFloat(`+${gained} XP · protein goal`, '#63D49B');
  }
  if (beforeCals < S.nutritionGoals.cals && day.cals >= S.nutritionGoals.cals) {
    const gained = awardXp(20, 'vitality');
    spawnFloat(`+${gained} XP · calorie goal`, '#63D49B');
  }
  persist();
  updateFuelInPlace();
  updatePillarsInPlace();
}

function undoLastNutrition() {
  const today = dayKey();
  const day = S.nutrition[today];
  if (!day || day.entries.length === 0) return;
  const last = day.entries.pop();
  day.cals = Math.max(0, day.cals - last.cals);
  day.protein = Math.max(0, day.protein - last.protein);
  persist();
  updateFuelInPlace();
}

function resetToday() {
  const today = dayKey();
  if (S.nutrition[today]) {
    delete S.nutrition[today];
    persist();
  }
  updateFuelInPlace();
}

function setNutritionGoals(cals, protein) {
  if (cals && cals > 0) S.nutritionGoals.cals = Math.max(500, Math.min(10000, parseInt(cals)));
  if (protein && protein > 0) S.nutritionGoals.protein = Math.max(10, Math.min(500, parseInt(protein)));
  persist(); render();
}

// ============ MEAL PRESETS — quick-add saved meals ============
function addMealPreset(name, cals, protein) {
  name = (name || '').trim().slice(0, 40);
  cals = Math.max(0, parseInt(cals) || 0);
  protein = Math.max(0, parseInt(protein) || 0);

/* ============================================================
   DECAY TICK
   ============================================================ */
function decayTick() {
  const now = Date.now();
  let changed = false;
  const cutoff = now - 30 * 86400000;
  S.disciplineEvents = S.disciplineEvents.filter(e => e.ts >= cutoff);
  const shielded = shieldActive();

  if (now - S.lastDecayCheck > 30000) {
    S.habits.forEach(h => {
      if (h.lastCheckIn === 0) return;
      // Break streak if a full calendar day has elapsed without check-in (for daily),
      // or the 168h * 1.5 grace passed (for weekly).
      if (habitStreakBroken(h) && h.streak > 0) {
        const lost = h.streak;
        // Ice Shield consumes one charge to preserve the streak instead of breaking it.
        // Updates lastCheckIn to yesterday so the habit reads as "due today, streak alive."
        if ((S.iceShields || 0) > 0) {
          S.iceShields -= 1;
          h.lastCheckIn = now - 86400000; // backdate to keep streak alive but mark as due today
          h.lastFrozenAt = now;
          S.log.unshift({ id: `${now}-${h.id}-frozen`, ts: now, type: 'gain',
            text: `Streak Freeze used: "${h.name}" — ${lost}-day streak preserved. ${S.iceShields} freeze(s) left.` });
          changed = true;
          return; // skip damage entirely
        }
        const lost_h = h.streak;
        // Shield: no discipline event from missed habits
        if (!shielded) {
          S.disciplineEvents.push({ ts: now, type: 'miss', source: 'habit', habitId: h.id });
          S.log.unshift({ id: `${now}-${h.id}-miss`, ts: now, type: 'miss',
            text: `Missed "${h.name}" — streak of ${lost_h} broken.` });
        } else {
          S.log.unshift({ id: `${now}-${h.id}-shielded`, ts: now, type: 'gain',
            text: `Missed "${h.name}" — Tactical Shield absorbed the penalty.` });
        }
        h.streak = 0;
        changed = true;
      }
    });
    S.lastDecayCheck = now;
  }

  // Yesterday's missed gym
  const today = dayKey(new Date(now));
  const y = dayKey(new Date(now - 86400000));
  if (S.lastGymSkipCheck !== today) {
    const yDow = new Date(now - 86400000).getDay();
    const sched = S.routines.filter(r => r.schedule?.includes(yDow));
    sched.forEach(r => {
      const done = S.sessions.some(s => s.routineId === r.id && s.completed && dayKey(new Date(s.ts)) === y);
      if (!done) {
        if (!shielded) {
          S.disciplineEvents.push({ ts: now, type: 'miss', source: 'gym', routineId: r.id });
          S.log.unshift({ id: `${now}-${r.id}-skip`, ts: now, type: 'miss',
            text: `Skipped scheduled workout: "${r.name}".` });
        }
        changed = true;
      }
    });
    S.lastGymSkipCheck = today;
  }

  // Focus timer completion — only fire if timer is running AND not paused
  if (S.focusTimer && S.focusTimer.running && !S.focusTimer.paused && S.focusTimer.endsAt && now >= S.focusTimer.endsAt) {
    const mins = S.focusTimer.durationMins;
    if (isBreakDuration(mins)) {
      S.focusTimer = { running: false, paused: false, pausedRemainingMs: 0, endsAt: 0, durationMins: mins, startedAt: 0 };
      S.log.unshift({ id: `${now}-break`, ts: now, type: 'gain',
        text: `Break complete · ${mins} min · time to refocus` });
      showFocusComplete(mins, 0, true);
    } else {
      const baseXp = Math.max(5, mins);
      const gained = awardXp(baseXp, 'resolve');
      S.focusTimer = { running: false, paused: false, pausedRemainingMs: 0, endsAt: 0, durationMins: mins, startedAt: 0 };
      S.log.unshift({ id: `${now}-focus`, ts: now, type: 'gain',
        text: `Focus block complete · ${mins} min · +${gained} XP · +${gained} credits` });
      showFocusComplete(mins, gained, false);
    }
    changed = true;
  }

  S.log = S.log.slice(0, 200);
  if (changed) { persist(); render(); }
}

/* ============================================================
   MUSCLE PICKER — six groups, each opens to its sub-muscles
   ============================================================ */
const _mp = {};   // pickerId -> { sel: Set, open: groupId|null }
function mpInit(id, selected) {
  const sel = new Set();
  (selected || []).forEach(m => {
    if (m === 'lats') { sel.add('upperLats'); sel.add('lowerLats'); }
    else if (m === 'core') sel.add('abs');
    else if (MUSCLE_GROUPS[m]) sel.add(m);
  });
  _mp[id] = { sel, open: null };
  return _mp[id];
}
function mpGet(id) { return _mp[id] ? Array.from(_mp[id].sel) : []; }
function mpInner(id) {
  const st = _mp[id];
  const groups = MUSCLE_TREE.map(g => {
    const keys = (g.whole ? [g.whole] : []).concat(g.items);
    const n = keys.filter(k => st.sel.has(k)).length;
    return `<button type="button" class="mp-group${st.open === g.id ? ' open' : ''}${n ? ' has' : ''}" onclick="mpOpen('${id}','${g.id}')">${g.label}${n ? `<b>${n}</b>` : ''}</button>`;
  }).join('');
  const g = MUSCLE_TREE.find(x => x.id === st.open);
  const subs = g ? `<div class="mp-subs">${
    (g.whole ? [[g.whole, 'Whole ' + g.label.toLowerCase()]] : [])
      .concat(g.items.map(k => [k, MUSCLE_GROUPS[k].label]))
      .map(([k, l]) => `<button type="button" class="mp-chip${st.sel.has(k) ? ' on' : ''}" onclick="mpToggle('${id}','${k}')">${l}</button>`).join('')
  }</div>` : '';
  return `<div class="mp-groups">${groups}</div>${subs}`;
}
// Renders the picker. State survives re-renders; call mpInit(id, [...]) to reset it.
function musclePickerHTML(id, selected) {
  if (!_mp[id]) mpInit(id, selected);
  return `<div class="mp" id="mp-${id}">${mpInner(id)}</div>`;
}
function mpRefresh(id) { const el = document.getElementById('mp-' + id); if (el && _mp[id]) el.innerHTML = mpInner(id); }
window.mpOpen = function(id, g) { const st = _mp[id]; if (!st) return; st.open = st.open === g ? null : g; mpRefresh(id); };
window.mpToggle = function(id, k) {
  const st = _mp[id]; if (!st || !MUSCLE_GROUPS[k]) return;
  if (st.sel.has(k)) st.sel.delete(k); else st.sel.add(k);
  mpRefresh(id);
};

function attachHabitModalHandlers(initial) {
  let name = initial?.name || '';
  let pillar = initial?.pillar || 'strength';
  let frequency = initial?.frequency || 'daily';
  let xp = typeof initial?.xp === 'number' ? initial.xp : 15;
  let days = Array.isArray(initial?.days) ? initial.days.slice() : [];
  const updatePillarStyles = () => {
    document.querySelectorAll('.pillar-btn').forEach(btn => {
      const k = btn.dataset.pillar;
      const p = PILLARS[k];
      const sel = pillar === k;
      btn.style.background = sel ? p.soft : 'rgba(255,255,255,0.03)';
      btn.style.borderColor = sel ? p.color + '66' : 'rgba(255,255,255,0.07)';
      btn.style.color = sel ? p.color : 'rgba(255,255,255,0.7)';
    });
  };
  const updateFreqStyles = () => {
    document.querySelectorAll('.freq-btn').forEach(btn => {
      const f = btn.dataset.freq;
      const sel = frequency === f;
      btn.style.background = sel ? 'rgba(255,255,255,0.14)' : 'rgba(255,255,255,0.03)';
      btn.style.borderColor = sel ? 'rgba(255,255,255,0.45)' : 'rgba(255,255,255,0.07)';
      btn.style.color = sel ? '#FFFFFF' : 'rgba(255,255,255,0.7)';
    });
    // Days block only meaningful for daily habits
    const daysBlock = document.getElementById('m-days-block');
    if (daysBlock) daysBlock.style.display = frequency === 'daily' ? '' : 'none';
  };
  const updateDayStyles = () => {
    document.querySelectorAll('.day-btn').forEach(btn => {
      const i = parseInt(btn.dataset.day);
      const sel = days.includes(i);
      btn.style.background = sel ? 'rgba(99,212,155,0.14)' : 'rgba(255,255,255,0.03)';
      btn.style.borderColor = sel ? 'rgba(99,212,155,0.45)' : 'rgba(255,255,255,0.07)';
      btn.style.color = sel ? '#63D49B' : 'rgba(255,255,255,0.7)';
    });
    // Update the "N selected / Every day" label
    const label = document.querySelector('#m-days-block label span:last-child');
    if (label) label.textContent = days.length === 0 ? 'Every day' : `${days.length} selected`;
  };
  document.querySelectorAll('.pillar-btn').forEach(btn => {
    btn.onclick = () => { pillar = btn.dataset.pillar; updatePillarStyles(); };
  });
  document.querySelectorAll('.freq-btn').forEach(btn => {
    btn.onclick = () => { frequency = btn.dataset.freq; updateFreqStyles(); };
  });
  document.querySelectorAll('.day-btn').forEach(btn => {
    btn.onclick = () => {
      const i = parseInt(btn.dataset.day);
      const idx = days.indexOf(i);
      if (idx >= 0) days.splice(idx, 1);
      else days.push(i);
      updateDayStyles();
    };
  });
  // Initial style sync for frequency-driven visibility
  updateFreqStyles();
  const nameInput = document.getElementById('m-name');
  nameInput.addEventListener('input', e => name = e.target.value);
  // Keep slider + numeric input in sync
  const xpSlider = document.getElementById('m-xp');
  const xpNum = document.getElementById('m-xp-num');
  const clamp = v => Math.max(1, Math.min(100, parseInt(v) || 1));
  if (xpSlider) xpSlider.addEventListener('input', e => {
    xp = clamp(e.target.value);
    if (xpNum) xpNum.value = xp;
  });
  if (xpNum) xpNum.addEventListener('input', e => {
    xp = clamp(e.target.value);
    if (xpSlider) xpSlider.value = xp;
  });
  document.getElementById('m-save').onclick = () => {
    const groupVal = (document.getElementById('m-group')?.value || '').trim().slice(0, 24);
    // Weekly habits don't use the day picker
    const daysArg = frequency === 'daily' ? days : [];
    if (initial) updateHabit(initial.id, { name, pillar, frequency, xp, group: groupVal, days: daysArg });
    else addHabit({ name, pillar, frequency, xp, group: groupVal, days: daysArg });
    closeModal();
  };
  setTimeout(() => nameInput.focus(), 50);
}

function attachRoutineModalHandlers() {
  let name = '';
  let template = 'full';
  let schedule = [1,3,5];
  const saveBtn = document.getElementById('m-rsave');
  const updateTmpl = () => {
    document.querySelectorAll('.tmpl-btn').forEach(b => {
      const sel = b.dataset.tmpl === template;
      b.style.background = sel ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.03)';
      b.style.borderColor = sel ? 'rgba(255,255,255,0.4)' : 'rgba(255,255,255,0.07)';
      b.style.color = sel ? '#FFFFFF' : 'rgba(255,255,255,0.7)';
    });
  };
  const updateDays = () => {
    document.querySelectorAll('.day-btn').forEach(b => {
      const sel = schedule.includes(parseInt(b.dataset.day));
      b.classList.toggle('selected', sel);
    });
  };
  document.querySelectorAll('.tmpl-btn').forEach(b => {
    b.onclick = () => { template = b.dataset.tmpl; updateTmpl(); };
  });
  document.querySelectorAll('.day-btn').forEach(b => {
    b.onclick = () => {
      const d = parseInt(b.dataset.day);
      schedule = schedule.includes(d) ? schedule.filter(x => x!==d) : schedule.concat(d);
      updateDays();
    };
  });
  const ni = document.getElementById('m-rname');
  ni.addEventListener('input', e => {
    name = e.target.value;
    saveBtn.disabled = !name.trim();
  });
  saveBtn.onclick = () => {
    if (!name.trim()) return;
    addRoutine({ name, template, schedule });
    closeModal();
  };
  setTimeout(() => ni.focus(), 50);
}

  const clamped = Math.max(20, Math.min(250, Math.round(num * 2) / 2));
  const slider = document.getElementById('bw-slider');

  if (slider && slider !== document.activeElement) slider.value = clamped;

        msg.textContent = label;
        msg.style.color = success ? 'rgba(99,212,155,0.95)' : 'rgba(99,212,155,0.95)';
      }
    };
    // Try modern clipboard API first; fall back to textarea trick
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(data).then(
        () => finalize(`Copied · ${data.length.toLocaleString()} chars`, true),
        () => fallbackCopy(data, finalize)
      );
    } else {
      fallbackCopy(data, finalize);
    }
  } catch (e) {
    if (msg) {
      msg.textContent = 'Backup failed: ' + (e && e.message || e);
      msg.style.color = 'rgba(242,114,107,0.95)';
    }
  }
};

function fallbackCopy(text, done) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    done(ok ? `Copied · ${text.length.toLocaleString()} chars` : 'Copy failed — long-press the textarea below', ok);
    if (!ok) {
      // As a last resort, drop the text into the restore textarea so user can manually copy it
      const restore = document.getElementById('restore-text');
      if (restore) {
        restore.value = text;
        restore.placeholder = 'Long-press to select all and copy this text';
      }
    }
  } catch (e) {
    done('Copy failed: ' + (e && e.message || e), false);
  }
}

window.restoreData = function() {
  const ta = document.getElementById('restore-text');
  const msg = document.getElementById('restore-msg');
  if (!ta) return;
  const txt = (ta.value || '').trim();
  if (!txt) {
    if (msg) msg.textContent = 'Paste backup data first.';
    return;
  }
  let parsed;
  try {
    parsed = JSON.parse(txt);
  } catch (e) {
    if (msg) {
      msg.textContent = 'Invalid JSON. Make sure you pasted the entire backup.';
      msg.style.color = 'rgba(242,114,107,0.95)';
    }
    return;
  }
  if (!parsed || typeof parsed !== 'object') {
    if (msg) {
      msg.textContent = 'Backup data is not a valid object.';
      msg.style.color = 'rgba(242,114,107,0.95)';
    }
    return;
  }
  // Sanity check: at minimum should have pillars or habits to look like Foundry data
  if (!parsed.pillars && !parsed.habits) {
    if (msg) {
      msg.textContent = 'This doesn\'t look like Foundry backup data.';
      msg.style.color = 'rgba(242,114,107,0.95)';
    }
    return;
  }
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
    if (msg) {
      msg.textContent = 'Restored. Reloading...';
      msg.style.color = 'rgba(99,212,155,0.95)';
    }
    setTimeout(() => { location.reload(); }, 600);
  } catch (e) {
    if (msg) {
      msg.textContent = 'Restore failed: ' + (e && e.message || e);
      msg.style.color = 'rgba(242,114,107,0.95)';
    }
  }
};

function ringHTML(value, max, color, opts = {}) {
  const size = opts.size || 110;
  const stroke = opts.stroke || 9;
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const pct = Math.max(0, Math.min(1, value / max));
  const id = `rg-${color.replace('#','')}-${size}-${Math.random().toString(36).slice(2,5)}`;
  return `
    <div class="ring-wrap" style="width:${size}px;height:${size}px">
      <svg width="${size}" height="${size}">
        <defs>
          <linearGradient id="${id}" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="${color}" stop-opacity="0.7"/>
            <stop offset="100%" stop-color="${color}" stop-opacity="0.95"/>
          </linearGradient>
        </defs>
        <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="${stroke}"/>
        <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#${id})" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct)}"/>
      </svg>
      <div class="ring-label">
        <div class="ring-sub">${opts.sublabel || ''}</div>
        <div class="ring-val">${opts.label != null ? opts.label : value}</div>
      </div>
    </div>`;
}

function statBarHTML(value, max, color, h = 6) {
  const pct = Math.max(0, Math.min(100, (value/max)*100));
  return `<div class="statbar" style="height:${h}px"><div style="width:${pct}%;background:${color}"></div></div>`;
}

function sparklineHTML(data, color, opts = {}) {
  if (!data || data.length === 0) return '';
  const w = opts.width || 100;
  const h = opts.height || 28;
  if (data.length === 1) data = [data[0], data[0]];
  const min = Math.min(...data, 0);
  const max = Math.max(...data, 1);
  const range = max - min || 1;
  const path = data.map((v,i) => {
    const x = (i / (data.length - 1)) * w;
    const y = h - ((v - min) / range) * h;
    return `${i===0?'M':'L'} ${x.toFixed(1)} ${y.toFixed(1)}`;
  }).join(' ');
  const fill = opts.fill !== false;
  const id = `sp-${color.replace('#','')}-${Math.random().toString(36).slice(2,6)}`;
  return `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" preserveAspectRatio="none">
      ${fill?`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
      </linearGradient></defs>
      <path d="${path} L ${w} ${h} L 0 ${h} Z" fill="url(#${id})"/>`:''}
      <path d="${path}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
}

function startFocusTimer(mins) {
  if (S.focusTimer.running) return;
  mins = parseFloat(mins);
  if (!isFinite(mins) || mins <= 0) mins = 25;
  // Clamp between 6 seconds (0.1 min) and 180 minutes
  mins = Math.max(0.1, Math.min(180, mins));
  // Round to 1 decimal so the display + math stay clean
  mins = Math.round(mins * 10) / 10;
  const now = Date.now();
  S.focusTimer = {
    running: true,
    paused: false,
    pausedRemainingMs: 0,
    endsAt: now + mins * 60000,
    durationMins: mins,
    startedAt: now,
  };
  persist(); render();
}
function pauseFocusTimer() {
  const t = S.focusTimer;
  if (!t.running || t.paused) return;
  const remaining = Math.max(0, t.endsAt - Date.now());
  S.focusTimer = { ...t, paused: true, pausedRemainingMs: remaining };
  persist(); render();
}
function resumeFocusTimer() {
  const t = S.focusTimer;
  if (!t.running || !t.paused) return;
  const remaining = t.pausedRemainingMs || 0;
  S.focusTimer = { ...t, paused: false, pausedRemainingMs: 0, endsAt: Date.now() + remaining };
  persist(); render();
}
function cancelFocusTimer() {
  S.focusTimer = { running: false, paused: false, pausedRemainingMs: 0, endsAt: 0, durationMins: S.focusTimer.durationMins || 25, startedAt: 0 };
  persist(); render();
}
window.pauseFocusTimer = pauseFocusTimer;
window.resumeFocusTimer = resumeFocusTimer;
function showFocusComplete(mins, xp, isBreak) {

  const accent = isBreak ? 'rgba(99,212,155,0.85)' : 'rgba(99,212,155,0.85)';
  const label = isBreak ? 'Break complete' : 'Focus complete';
  const sub = isBreak
    ? `Take a breath — back to it when ready`
    : `+${xp} Resolve XP · +${xp} Credits`;
  showOverlay(`
    <div class="fs-overlay">
      <div class="fs-content">
        <div style="margin-bottom:12px;color:${accent}">${icon('clock', 56)}</div>
        <div style="font-size:12px;letter-spacing:0.32em;color:${accent};margin-bottom:4px">${label}</div>
        <div style="font-size:30px;font-weight:600;color:rgba(255,255,255,0.95);margin-bottom:4px">${mins} minutes</div>
        <div style="font-size:15px;color:rgba(255,255,255,0.65)">${sub}</div>
      </div>
    </div>`, 2400);
}

window.addFocusPreset = function() {
  const inp = document.getElementById('focus-new-preset-mins');
  if (!inp) return;
  const m = parseFloat(inp.value);
  if (!isFinite(m) || m <= 0 || m > 180) {
    spawnFloat('Enter 0.1–180 minutes', '#F2726B');
    return;
  }
  // Round to 1 decimal for consistency with startFocusTimer's rounding
  const mins = Math.round(m * 10) / 10;
  if (!Array.isArray(S.focusPresets)) S.focusPresets = [];
  // No duplicates
  if (S.focusPresets.some(p => p.mins === mins)) {
    spawnFloat('Preset already exists', '#F2726B');
    return;
  }
  S.focusPresets.push({ mins });
  // Sort ascending so they appear in a sensible order
  S.focusPresets.sort((a, b) => a.mins - b.mins);
  inp.value = '';
  persist(); render();
};
window.removeFocusPreset = function(mins) {
  if (!Array.isArray(S.focusPresets)) return;
  S.focusPresets = S.focusPresets.filter(p => p.mins !== mins);
  persist(); render();
};

// Tick the timer display every second when the Focus tab is visible
let _focusInterval = null;
function startFocusUpdater() {
  if (_focusInterval) return;
  _focusInterval = setInterval(() => {
    if (UI.tab !== 'focus') return;
    if (!S.focusTimer.running) return;
    if (S.focusTimer.paused) return; // freeze display while paused
    const now = Date.now();
    if (now >= S.focusTimer.endsAt) {
      decayTick(); // will trigger completion
      return;
    }
    const remainingMs = Math.max(0, S.focusTimer.endsAt - now);
    const remainingSec = Math.floor(remainingMs / 1000);
    const mm = Math.floor(remainingSec / 60);
    const ss = remainingSec % 60;
    const timeStr = `${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
    const timeEl = document.getElementById('focus-time');
    if (timeEl) timeEl.textContent = timeStr;
    const ringEl = document.getElementById('focus-ring');
    if (ringEl) {
      const totalMs = S.focusTimer.durationMins * 60000;
      const pct = 1 - (remainingMs / totalMs);
      const c = 2 * Math.PI * ((240 - 14) / 2);
      ringEl.setAttribute('stroke-dashoffset', String(c * (1 - pct)));
    }
  }, 1000);
}

// Deduct XP from a pillar without going below current-level minimum.
// Levels are never lost; only progress toward the next level is. Lifetime XP
// is unaffected (it's "lifetime earned"). Credits already in your balance
// are also not clawed back.
function deductXp(amount, pillarKey) {
  if (!PILLARS[pillarKey]) pillarKey = 'resolve';
  amount = Math.max(0, parseInt(amount) || 0);
  if (amount === 0) return 0;
  const p = S.pillars[pillarKey] || { level: 1, xp: 0 };
  const actual = Math.min(p.xp, amount);
  p.xp = Math.max(0, p.xp - amount);
  S.pillars[pillarKey] = p;
  return actual;
}

function slipVice(id) {
  const v = S.vices.find(x => x.id === id);
  if (!v) return;
  const now = Date.now();
  const shielded = shieldActive();
  const tier = VICE_TIERS[v.tier] || VICE_TIERS.major;

  // Resolve XP penalty ALWAYS applies (even with shield active)
  const xpDeducted = deductXp(tier.xp, 'resolve');
  spawnFloat(`−${xpDeducted} Resolve XP`, tier.color);

  // Discipline penalties only apply if shield is NOT active
  if (!shielded) {
    triggerShake();
    // Heavier tiers stamp multiple discipline misses so the bar drops more
    for (let i = 0; i < tier.discMisses; i++) {
      S.disciplineEvents.push({ ts: now + i, type: 'miss', source: 'vice', viceId: id });
    }
  }

  v.totalSlips = (v.totalSlips || 0) + 1;
  v.lastSlip = now;

  S.log.unshift({
    id: `${now}-vice-${id}`,
    ts: now,
    type: shielded ? 'gain' : 'miss',
    text: shielded
      ? `${tier.label} slip: "${v.name}" — shield absorbed HP/discipline. −${xpDeducted} Resolve XP.`
      : `${tier.label} slip: "${v.name}" — −${hpDmg} HP · −${xpDeducted} Resolve XP · discipline hit.`,
  });
  S.log = S.log.slice(0, 200);

  persist(); render();
}

// Hash a PIN with SHA-256, hex-encoded. Used by both the Journal and the
// Physique gallery (they share a single pinHash on S.journal). Falls back to
// a deterministic small hash if SubtleCrypto isn't available (e.g. file://
// schemes on some old WebViews).
async function hashPin(pin) {
  try {
    const enc = new TextEncoder().encode(String(pin));
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  } catch {
    let h = 0;
    String(pin).split('').forEach(c => { h = ((h << 5) - h) + c.charCodeAt(0); h |= 0; });
    return String(h);
  }
}

async function trySetJournalPin(pin) {
  if (!/^\d{6}$/.test(String(pin))) {
    return { ok: false, msg: 'PIN must be exactly 6 digits.' };
  }
  S.journal.pinHash = await hashPin(pin);
  S.journal.lastUnlock = Date.now();
  persist();
  return { ok: true };
}

async function tryUnlockJournal(pin) {
  if (!S.journal.pinHash) return { ok: false, msg: 'No PIN set.' };
  const h = await hashPin(pin);
  if (h === S.journal.pinHash) {
    S.journal.lastUnlock = Date.now();
    persist();
    return { ok: true };
  }
  return { ok: false, msg: 'Wrong PIN.' };
}

function journalUnlocked() {
  // Stay unlocked for 5 minutes after a correct PIN
  return S.journal.lastUnlock && (Date.now() - S.journal.lastUnlock < 5 * 60000);
}
