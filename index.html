// Returns true when the user can currently see the journal modal OR the
// physique gallery on the Gym tab. Used to auto-lock sensitive surfaces
// the moment the user navigates away from both.
function sensitiveSurfaceVisible() {
  const journalModalOpen = !!(UI.modal && UI.modal.kind === 'journal');
  const physiqueVisible = UI.tab === 'gym';
  return journalModalOpen || physiqueVisible;
}
// Clear the shared unlock window if no sensitive surface is currently visible.
function autoLockIfHidden() {
  if (!sensitiveSurfaceVisible() && S.journal && S.journal.lastUnlock) {
    S.journal.lastUnlock = 0;
    UI.confirmingPinReset = false;
    try { persist(); } catch {}
  }
}

window.setTab = function(t) {
  UI.tab = t;
  // Preserve the active workout session if one is in progress —
  // user might tab over to Focus to time a rest break, then come back.
  // Only reset gymView when leaving gym tab AND not actively logging.
  if (t !== 'gym' && UI.gymView && UI.gymView.kind !== 'log') {
    UI.gymView = { kind: 'list' };
    _logState = null;
  }
  // Reset preset-edit mode when leaving the Focus tab
  if (t !== 'focus' && UI.editingFocusPresets) UI.editingFocusPresets = false;
  // Lock journal + physique when navigating away from both surfaces.
  autoLockIfHidden();
  render();
};

function render() {
  try {
    _render();
    // Start focus timer ticker on first render
    startFocusUpdater();
  } catch (e) {
    console.error('Render failed:', e);
    try {
      document.getElementById('app').innerHTML = `
        <div style="max-width:480px;margin:60px auto;padding:24px">
          <div class="glass p-5" style="text-align:center">
            <div style="color:rgba(248,113,113,0.85);margin-bottom:12px">${icon('alert', 32)}</div>
            <h3 style="font-size:18px;font-weight:600;color:rgba(255,255,255,0.95);margin:0 0 8px">Something went wrong</h3>
            <p style="font-size:13px;color:rgba(255,255,255,0.6);margin:0 0 16px;line-height:1.5">The app caught a render error. Tap below to retry. Your data is preserved.</p>
            <details style="text-align:left;margin-bottom:16px;font-size:11px;color:rgba(255,255,255,0.45);background:rgba(255,255,255,0.03);padding:8px;border-radius:8px">
              <summary style="cursor:pointer">Error details</summary>
              <pre style="white-space:pre-wrap;word-break:break-word;margin:8px 0 0">${escapeHtml(String(e && e.message || e))}</pre>
            </details>
            <button onclick="render()" class="btn-primary">Retry</button>
          </div>
        </div>`;
    } catch {}
  }
}

function _render() {
  const disc = discipline();
  const inUrgency = disc < 50;
  const isElite = disc >= 90;
  const totalLv = calcTotalLevel(S.pillars);

  document.body.classList.toggle('urgency', inUrgency);
  document.body.classList.toggle('elite', isElite);

  let content = '';
  if (UI.tab === 'dashboard') content = renderDashboard();
  else if (UI.tab === 'quests') content = renderQuests();
  
  else if (UI.tab === 'gym')    content = renderGym();
  else if (UI.tab === 'fuel')   content = renderFuel();
  else if (UI.tab === 'focus')  content = renderFocus();

  const accent = inUrgency ? '#D9534F' : isElite ? '#C97B3A' : '#C97B3A';

  const shieldOn = shieldActive();
  const shieldHrsLeft = shieldOn ? Math.ceil((S.shieldActiveUntil - Date.now()) / 3600000) : 0;

  // Global Undo toast — appears regardless of tab when a habit was just checked.
  // Auto-expires from the UI after 60 seconds (next render past the threshold drops it).
  const lastAct = UI.lastHabitAction;
  const undoFresh = lastAct && (Date.now() - lastAct.ts < 60000);
  const undoToast = undoFresh ? `
    <div id="undo-toast" style="position:fixed;left:50%;transform:translateX(-50%);bottom:88px;z-index:50;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:rgba(20,20,24,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(201,123,58,0.3);box-shadow:0 8px 24px rgba(0,0,0,0.5);max-width:calc(100vw - 32px)">
      <span style="color:#C97B3A;flex-shrink:0">${icon('undo', 14)}</span>
      <div style="min-width:0;flex:1">
        <div style="font-size:12px;color:rgba(255,255,255,0.95);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px">Checked: ${escapeHtml(lastAct.habitName)}</div>
        <div style="font-size:9px;color:rgba(255,255,255,0.45);font-variant-numeric:tabular-nums">${Math.max(0, 60 - Math.floor((Date.now() - lastAct.ts)/1000))}s to undo</div>
      </div>
      <button onclick="undoHabitCheckIn()" style="padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600;background:#C97B3A;color:#1a1a1a;border:none;flex-shrink:0;cursor:pointer">Undo</button>
    </div>` : '';

  document.getElementById('app').innerHTML = `
    <header>
      <div>
        <div class="eyebrow">Productivity engine</div>
        <h1>Foundry<span style="color:${accent}"> OS</span><span style="color:${accent}">.</span></h1>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
        <div style="display:inline-flex;align-items:center;gap:6px">
          <button onclick="openModal('cold-storage')" title="Cold Storage" aria-label="Cold Storage" style="width:26px;height:26px;border-radius:999px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.10);color:rgba(255,255,255,0.6);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0">
            ${icon('settings', 12)}
          </button>
          <span id="header-lv" class="lv-pill ${isElite?'elite':''}">LV ${String(totalLv).padStart(2,'0')}</span>
        </div>
        ${shieldOn ? `<span style="display:inline-flex;align-items:center;gap:3px;font-size:9px;letter-spacing:0.08em;padding:2px 6px;border-radius:999px;background:rgba(156,63,44,0.15);border:1px solid rgba(156,63,44,0.4);color:#9C3F2C;text-shadow:0 0 6px rgba(156,63,44,0.5);box-shadow:0 0 12px rgba(156,63,44,0.25)">${icon('shield', 8)} ${shieldHrsLeft}h</span>` : ''}
      </div>
    </header>
    <div class="tab-content">${content}</div>
    ${undoToast}
  `;

  // Tab bar
  const tabs = [
    { id: 'dashboard', label: 'Dash',     icon: 'home' },
    { id: 'quests',    label: 'Tasks',    icon: 'check' },
    { id: 'focus',     label: 'Focus',    icon: 'clock' },
    { id: 'gym',       label: 'Gym',      icon: 'dumbbell' },
    { id: 'fuel',      label: 'Fuel',     icon: 'utensils' },
  ];
  const sessionActive = UI.gymView && UI.gymView.kind === 'log' && _logState;
  document.getElementById('tabbar').innerHTML = tabs.map(t => {
    const isGymActive = t.id === 'gym' && sessionActive;
    return `
    <button class="tab-btn ${UI.tab===t.id?'active':''}" onclick="setTab('${t.id}')" style="position:relative">
      ${icon(t.icon, 18)}
      <span>${t.label}</span>
      ${isGymActive ? `<span style="position:absolute;top:6px;right:18px;width:7px;height:7px;border-radius:999px;background:#D9534F;box-shadow:0 0 6px rgba(217,83,79,0.7);animation:pulse-dot 1.4s ease-in-out infinite"></span>` : ''}
    </button>`;
  }).join('');

  // Modals
  if (UI.modal) {
    const m = UI.modal;
    let html = '';
    if (m.kind === 'habit') html = modalHabit();
    else if (m.kind === 'habit-edit') html = modalHabit(JSON.parse(m.data));
    else if (m.kind === 'routine') html = modalRoutine();
    else if (m.kind === 'fuel-goals') html = modalFuelGoals();
    else if (m.kind === 'journal') html = modalJournal();
    else if (m.kind === 'cold-storage') html = modalColdStorage();
    else if (m.kind === 'bodyweight') html = modalBodyweight();

    document.getElementById('overlays').innerHTML = html;

    if (m.kind === 'habit') attachHabitModalHandlers(null);
    else if (m.kind === 'habit-edit') attachHabitModalHandlers(JSON.parse(m.data));
    else if (m.kind === 'routine') attachRoutineModalHandlers();
    else if (m.kind === 'journal') {
      // Wire up star rating buttons via event delegation
      const row = document.getElementById('journal-rating-row');
      if (row) {
        row.querySelectorAll('.jr-star').forEach(btn => {
          btn.onclick = (ev) => {
            ev.preventDefault();
            window.setJournalRating(parseInt(btn.dataset.rating));
          };
        });
        // Apply any in-progress selection so the picker reflects state on re-render
        if (typeof UI.journalDraftRating === 'number') {
          window.setJournalRating(UI.journalDraftRating);
          // Note: setJournalRating toggles, so call it twice if needed
          if (UI.journalDraftRating !== null) {
            // Restore by re-applying selection
            const cur = UI.journalDraftRating;
            row.querySelectorAll('.jr-star').forEach(btn => {
              const i = parseInt(btn.dataset.rating);
              const active = cur && i <= cur;
              btn.style.background = active ? 'rgba(201,123,58,0.18)' : 'rgba(255,255,255,0.04)';
              btn.style.borderColor = active ? 'rgba(201,123,58,0.45)' : 'rgba(255,255,255,0.10)';
              btn.style.color = active ? '#C97B3A' : 'rgba(255,255,255,0.45)';
            });
          }
        }
      }
    }
  } else if (!document.getElementById('overlays').querySelector('.fs-overlay')) {
    // Don't clear if a fullscreen overlay (level up, death, etc) is showing
    document.getElementById('overlays').innerHTML = '';
  }

  // Physique photo viewer — mount at overlay layer so it always sits above the
  // tab content and can't be swallowed by a parent stacking context. Sits on
  // top of any modal that happens to be open too, which is fine since only one
  // path opens the viewer (tapping a thumbnail from the unlocked gallery).
  const viewerHtml = physiqueViewerOverlayHtml();
  const overlaysEl = document.getElementById('overlays');
  // Always remove any stale viewer instance first
  const stale = overlaysEl.querySelector('[data-viewer="physique"]');
  if (stale) stale.remove();
  if (viewerHtml) {
    overlaysEl.insertAdjacentHTML('beforeend', viewerHtml);
    // Wire up click handlers imperatively — inline onclick attrs sometimes
    // fail to fire on Android WebView when the DOM is freshly injected right
    // after a state change, especially inside insertAdjacentHTML output.
    const root = overlaysEl.querySelector('[data-viewer="physique"]');
    if (root) {
      root.querySelectorAll('[data-action]').forEach(btn => {
        const action = btn.dataset.action;
        const arg = btn.dataset.arg;
        btn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          if (action === 'close') window.closePhysiqueViewer();
          else if (action === 'request-delete') window.requestPhysiqueDelete(arg);
          else if (action === 'cancel-delete') window.cancelPhysiqueDelete();
          else if (action === 'confirm-delete') window.confirmPhysiqueDelete(arg);
        });
      });
      // Backdrop click closes
      root.addEventListener('click', (ev) => {
        if (ev.target === root) window.closePhysiqueViewer();
      });
    }
  }
}

/* ============================================================
   INIT
   ============================================================ */
render();
decayTick();
setInterval(decayTick, 30000);

/* ============================================================
   AUTO-LOCK on session end / app close
   Journal and Physique share S.journal.lastUnlock. Clearing it
   re-locks both. Fires when the page is hidden (tab switch, OS
   backgrounding) or unloaded (close, refresh).
   ============================================================ */
function autoLockSensitive() {
  if (!S || !S.journal) return;
  if (S.journal.lastUnlock) {
    S.journal.lastUnlock = 0;
    try { persist(); } catch {}
  }
}
// `visibilitychange` is the most reliable signal on mobile WebViews.
// When the user backgrounds the app, switches tabs, or locks the phone, lock.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') autoLockSensitive();
});
// Belt-and-braces for desktop/refresh cases.
window.addEventListener('pagehide', autoLockSensitive);
window.addEventListener('beforeunload', autoLockSensitive);

// Re-render every minute for time-sensitive UI (countdowns, etc)
setInterval(() => {
  
}, 60000);

// Tick the Undo toast countdown every second while it's visible
setInterval(() => {
  const a = UI.lastHabitAction;
  if (!a) return;
  const age = Date.now() - a.ts;
  if (age >= 60000) {
    UI.lastHabitAction = null;
    render();
  } else {
    // Just update the visible countdown without a full re-render
    const toast = document.getElementById('undo-toast');
    if (toast) {
      const secs = Math.max(0, 60 - Math.floor(age / 1000));
      const counter = toast.querySelector('div > div:nth-child(2)');
      if (counter) counter.textContent = `${secs}s to undo`;
    }
  }
}, 1000);

/* ============================================================
   SWIPE NAVIGATION
   ============================================================ */
// Swipe left = next tab, swipe right = previous tab.
// Listens on the scroller element so vertical scrolling still works normally.
(function() {
  const TAB_ORDER = ['dashboard', 'quests', 'focus', 'gym', 'fuel'];
  const SWIPE_MIN_X = 70;          // minimum horizontal travel in px
  const SWIPE_MAX_Y = 60;          // maximum vertical drift allowed
  const SWIPE_MAX_TIME = 600;      // maximum gesture duration in ms

  let startX = 0, startY = 0, startT = 0, tracking = false;

  function isInteractiveTarget(el) {
    // Don't hijack swipes that start on inputs, sliders, scrollable rows,
    // buttons within scrolling content, or inside modals.
    while (el && el !== document.body) {
      const tag = (el.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || tag === 'select') return true;
      if (tag === 'button') return true;
      // Inside an open modal or fullscreen overlay
      if (el.classList && (el.classList.contains('modal-backdrop') || el.classList.contains('fs-overlay'))) return true;
      // Horizontally scrollable content (chip rows in Quests)
      if (el.classList && el.classList.contains('chip-scroll')) return true;
      el = el.parentElement;
    }
    return false;
  }

  const scroller = document.getElementById('scroller');
  if (!scroller) return;

  scroller.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) { tracking = false; return; }
    if (isInteractiveTarget(e.target)) { tracking = false; return; }
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    startT = Date.now();
    tracking = true;
  }, { passive: true });

  scroller.addEventListener('touchend', (e) => {
    if (!tracking) return;
    tracking = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    const dt = Date.now() - startT;
    if (dt > SWIPE_MAX_TIME) return;
    if (Math.abs(dy) > SWIPE_MAX_Y) return;
    if (Math.abs(dx) < SWIPE_MIN_X) return;
    if (Math.abs(dx) < Math.abs(dy) * 1.5) return; // require strong horizontal bias

    // Don't switch tabs if a modal or fullscreen overlay is open
    if (document.querySelector('.modal-backdrop') || document.querySelector('.fs-overlay')) return;
    // Don't switch if user is in a gym sub-view (detail/log) — let them back out manually
    if (UI.tab === 'gym' && UI.gymView && UI.gymView.kind !== 'list') return;

    const curIdx = TAB_ORDER.indexOf(UI.tab);
    if (curIdx === -1) return;
    let nextIdx;
    if (dx < 0) {
      // swipe left → next tab
      nextIdx = curIdx + 1;
      if (nextIdx >= TAB_ORDER.length) return;
    } else {
      // swipe right → previous tab
      nextIdx = curIdx - 1;
      if (nextIdx < 0) return;
    }
    setTab(TAB_ORDER[nextIdx]);
    // Reset scroll position after tab change feels cleaner
    scroller.scrollTop = 0;
  }, { passive: true });
})();
</script>
