}

/* ============================================================
   DASHBOARD
   ============================================================ */
function renderDashboard() {
  const disc = discipline();
  const m = disciplineMultiplier(disc);
  const inUrgency = disc < 50;
  const isElite = disc >= 90;
  const totalLv = calcTotalLevel(S.pillars);

  // Today
  const today = dayKey();
  const dueToday = S.habits.filter(habitDueToday);
  const todayDone = S.habits.length - dueToday.length;

  // Today routine
  const dow = new Date().getDay();
  const todayRoutine = S.routines.find(r => r.schedule?.includes(dow));
  const todaySession = todayRoutine && S.sessions.find(s =>
    s.routineId === todayRoutine.id && dayKey(new Date(s.ts)) === today);

  // BODY: count sore muscles across upper-body radar + lower-body cardio (<24h)
  const nowTs = Date.now();
  let soreCount = 0;
  if (S.muscleHits && typeof S.muscleHits === 'object') {
    Object.entries(S.muscleHits).forEach(([k, hits]) => {
      // Only count parent groups to avoid double-counting subdivisions
      if (typeof MUSCLE_GROUPS !== 'undefined' && MUSCLE_GROUPS[k] && MUSCLE_GROUPS[k].parent) return;
      if (!Array.isArray(hits) || hits.length === 0) return;
      const lastTs = hits[hits.length - 1].ts;
      if (nowTs - lastTs < 86400000) soreCount += 1;
    });
  }
  const lowerSore = new Set();
  (S.cardioLog || []).forEach(c => {
    if (nowTs - c.ts >= 86400000) return;
    (c.muscles || []).forEach(m => lowerSore.add(m));
  });
  soreCount += lowerSore.size;

  // Master status — use the 3-tier discipline meter (Optimal / Nominal / Degraded)
  const tier = disciplineTier();
  const masterStatus = tier.label;
  const masterColor = tier.color;
  const masterBg = tier.bg;
  const masterBorder = tier.border;

  // Telemetry row — mirrors the pillar-card row layout used elsewhere
  const telemetryRow = (label, value, ok, hint) => `
    <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04)">
      <div style="display:flex;align-items:center;gap:8px;min-width:0">
        <span style="width:6px;height:6px;border-radius:999px;background:${ok?'#7AB17A':'rgba(255,255,255,0.30)'};flex-shrink:0"></span>
        <span style="font-size:13px;color:rgba(255,255,255,0.85);font-weight:500">${label}</span>
      </div>
      <div style="display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums">
        <span style="font-size:13px;font-weight:600;color:${ok?'#7AB17A':'rgba(255,255,255,0.92)'}">${value}</span>
        ${hint ? `<span style="font-size:10px;color:rgba(255,255,255,0.35);font-weight:500">${hint}</span>` : ''}
      </div>
    </div>`;

  // Status sub-label for under the STATUS heading
  const statusSubtext = masterStatus === 'Optimal'
    ? 'All systems nominal · running peak'
    : masterStatus === 'Degraded'
      ? 'Attention required · address red rows'
      : 'Holding steady · review metrics below';

  // Pillars
  const maxPillarXp = Math.max(100, ...Object.values(S.pillars).map(p => xpForLevel(p.level)));

  // ============================================================
  // CONTEXTUAL NUDGES — open-app reminders that keep you on track.
  // Each nudge is { priority, tone, icon, text, action(optional tab) }.
  // Higher priority surfaces first. Tone drives the accent color.
  // ============================================================
  const nudges = [];
  const hour = new Date().getHours();
  const isEvening = hour >= 18;
  const isLateEvening = hour >= 21;
  const isMorning = hour < 11;

  // 1. Streak at risk — habits with a live streak still due, in the evening
  const streakAtRisk = dueToday.filter(h => h.streak >= 2);
  if (isEvening && streakAtRisk.length > 0) {
    const topStreak = Math.max(...streakAtRisk.map(h => h.streak));
    nudges.push({
      priority: 90, tone: 'warn', icon: 'flame',
      text: streakAtRisk.length === 1
        ? `"${escapeHtml(streakAtRisk[0].name)}" — ${streakAtRisk[0].streak}-day streak at risk`
        : `${streakAtRisk.length} streaks at risk (longest: ${topStreak} days)`,
      tab: 'quests', cta: 'Check in',
    });
  }

  // 4. Tasks still due — general, evening
  else if (isEvening && dueToday.length > 0) {
    nudges.push({
      priority: 70, tone: 'warn', icon: 'scroll',
      text: `${dueToday.length} task${dueToday.length > 1 ? 's' : ''} still due today`,
      tab: 'quests', cta: 'Open',
    });
  }

  // 5. Weight not logged in 7+ days
  const lastWeight = (S.weightHistory || [])[0];
  if (!lastWeight || (nowTs - lastWeight.ts > 7 * 86400000)) {
    if (S.weightHistory && S.weightHistory.length > 0) {
      const daysSince = Math.floor((nowTs - lastWeight.ts) / 86400000);
      nudges.push({
        priority: 40, tone: 'info', icon: 'activity',
        text: `Weigh-in due — last logged ${daysSince}d ago`,
        tab: 'fuel', cta: 'Log',
      });
    }
  }

  // 7. Scheduled workout today not yet done
  if (todayRoutine && !todaySession && hour >= 8) {
    nudges.push({
      priority: 60, tone: 'warn', icon: 'dumbbell',
      text: `${escapeHtml(todayRoutine.name)} scheduled today — not logged`,
      tab: 'gym', cta: 'Train',
    });
  }

  // 8. Journal nudge — late evening, no entry today
  const journaledToday = (S.journal?.entries || []).some(e => dayKey(new Date(e.ts)) === today);
  if (isLateEvening && !journaledToday && (S.journal?.entries || []).length > 0) {
    nudges.push({
      priority: 30, tone: 'info', icon: 'book',
      text: `Reflect on your day — no journal entry yet`,
      tab: 'dashboard', cta: null,
    });
  }

  // 9. Positive reinforcement — everything done, show a win (only if nothing else urgent)
  const allHabitsDone = S.habits.length > 0 && dueToday.length === 0;
  if (nudges.length === 0 && allHabitsDone && isEvening) {
    nudges.push({
      priority: 10, tone: 'good', icon: 'check',
      text: `All tasks cleared today. Strong work.`,
      tab: null, cta: null,
    });
  }

  // Sort by priority desc, take top 3 to avoid overwhelming
  nudges.sort((a, b) => b.priority - a.priority);
  const topNudges = nudges.slice(0, 3);

  // Tone → colors
  const toneColors = {
    crit: { bg: 'rgba(217,83,79,0.10)',  border: 'rgba(217,83,79,0.35)',  fg: '#E07975', icon: '#D9534F' },
    warn: { bg: 'rgba(201,123,58,0.10)', border: 'rgba(201,123,58,0.35)', fg: '#C97B3A', icon: '#C97B3A' },
    info: { bg: 'rgba(255,255,255,0.03)',border: 'rgba(255,255,255,0.08)', fg: 'rgba(255,255,255,0.8)', icon: 'rgba(255,255,255,0.6)' },
    good: { bg: 'rgba(122,160,112,0.10)',border: 'rgba(122,160,112,0.35)', fg: '#9BC48E', icon: '#7AA070' },
  };

  const nudgeBanner = topNudges.length === 0 ? '' : `
    <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:14px">
      ${topNudges.map(n => {
        const c = toneColors[n.tone] || toneColors.info;
        const clickable = !!n.tab;
        return `
          <div ${clickable ? `onclick="setTab('${n.tab}')"` : ''} style="
            display:flex;align-items:center;gap:11px;
            padding:11px 13px;border-radius:12px;
            background:${c.bg};border:1px solid ${c.border};
            ${clickable ? 'cursor:pointer;' : ''}
          ">
            <span style="color:${c.icon};flex-shrink:0;display:flex">${icon(n.icon, 16)}</span>
            <span style="flex:1;min-width:0;font-size:13px;font-weight:500;color:${c.fg};line-height:1.35">${n.text}</span>
            ${n.cta ? `<span style="flex-shrink:0;font-size:11px;font-weight:700;letter-spacing:0.04em;color:${c.icon};display:flex;align-items:center;gap:3px">${n.cta} ${icon('chev', 11)}</span>` : ''}
          </div>`;
      }).join('')}
    </div>`;

  // Yesterday day-status banner — shown at the top of the Dashboard until dismissed.
  // Triggers: 5/5 targets = Perfect Day; 4/5 = Good Day. Below 4, nothing shows.
  const yesterdayKey = dayKey(new Date(nowTs - 86400000));
  const yStatus = computeDayStatus(yesterdayKey);
  const yStatusSeen = !!(S.dailyTelemetry && S.dailyTelemetry[yesterdayKey] && S.dailyTelemetry[yesterdayKey].statusSeen);
  let dayStatusBanner = '';
  if (!yStatusSeen && yStatus.count >= 4) {
    const isPerfect = yStatus.count === yStatus.total;
    const heading = isPerfect ? 'Perfect Day yesterday' : 'Good Day yesterday';
    const sub = isPerfect ? 'Everything hit. Keep the streak going.' : `${yStatus.count} of ${yStatus.total} targets hit. Push for the full run today.`;
    const bg = isPerfect ? 'rgba(201,123,58,0.10)' : 'rgba(122,177,122,0.08)';
    const border = isPerfect ? 'rgba(201,123,58,0.45)' : 'rgba(122,177,122,0.35)';
    const fg = isPerfect ? '#C97B3A' : '#9BC48E';
    const iconName = isPerfect ? 'sparkles' : 'check';
    dayStatusBanner = `
      <div style="display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:${bg};border:1px solid ${border};margin-bottom:14px">
        <div style="width:36px;height:36px;border-radius:10px;background:${border};display:flex;align-items:center;justify-content:center;color:${fg};flex-shrink:0">
          ${icon(iconName, 18)}
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:700;color:${fg};letter-spacing:-0.005em">${heading}</div>
          <div style="font-size:11px;color:rgba(255,255,255,0.60);margin-top:2px;line-height:1.4">${sub}</div>
        </div>
        <button onclick="dismissYesterdayStatus()" title="Dismiss" style="width:28px;height:28px;border-radius:999px;background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.10);color:rgba(255,255,255,0.6);display:flex;align-items:center;justify-content:center;flex-shrink:0">${icon('x', 12)}</button>
      </div>`;
  }

  return `
    ${dayStatusBanner}
    ${nudgeBanner}
    <!-- Operational Telemetry -->
    <div class="glass p-5" style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="color:rgba(255,255,255,0.7)">${icon('activity', 16)}</span>
          <h2 class="section-title">Operational Telemetry</h2>
        </div>
        <span style="font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:rgba(255,255,255,0.4)">${new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}</span>
      </div>

      <!-- Status banner — uses the same card pattern as pillar-card -->
      <div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:${masterBg};border:1px solid ${masterBorder};margin-bottom:6px">
        <span style="width:10px;height:10px;border-radius:999px;background:${masterColor};flex-shrink:0;box-shadow:0 0 8px ${masterColor}"></span>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:2px">
            <span style="font-size:10px;text-transform:uppercase;letter-spacing:0.12em;color:rgba(255,255,255,0.45);font-weight:600">Status</span>
            <span style="font-size:14px;font-weight:700;color:${masterColor};letter-spacing:-0.005em">${masterStatus}</span>
          </div>
          <div style="font-size:11px;color:rgba(255,255,255,0.5);line-height:1.4">${statusSubtext}</div>
        </div>
      </div>

      <div>
        ${telemetryRow('Tasks',     `${todayDone}`,             S.habits.length > 0 && todayDone === S.habits.length, `/ ${S.habits.length} cleared`)}
        ${telemetryRow('Body',      soreCount === 0 ? 'Ready' : `${soreCount}`, soreCount === 0, soreCount === 0 ? '' : 'sore muscles')}
        ${telemetryRow('Calories',  `${(S.nutrition[today]?.cals||0)}`, (S.nutrition[today]?.cals||0) >= S.nutritionGoals.cals, `/ ${S.nutritionGoals.cals}`)}
        ${telemetryRow('Protein',   `${(S.nutrition[today]?.protein||0)}g`, (S.nutrition[today]?.protein||0) >= S.nutritionGoals.protein, `/ ${S.nutritionGoals.protein}g`)}
        ${telemetryRow('Workout',   todaySession ? 'Done' : (todayRoutine ? 'Pending' : 'Rest day'), !!todaySession || !todayRoutine, todaySession ? '✓' : '')}
      </div>
    </div>

    <!-- Pillars -->
    <div class="glass p-5" style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h2 class="section-title">Pillars</h2>
        <span id="pillars-lifetime" style="font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:rgba(255,255,255,0.4)">
          Total LV ${totalLv} · ${S.lifetimeXp.toLocaleString()} XP
        </span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
        ${Object.entries(PILLARS).map(([k,p]) => {
          const pl = S.pillars[k] || { level: 1, xp: 0 };
          const needed = xpForLevel(pl.level);
          return `
            <div class="pillar-card">
              <div class="pc-head">
                <span class="pc-name" style="color:rgba(255,255,255,0.85)">
                  <span style="color:${p.color}">${icon(p.icon, 13)}</span> ${p.label}
                </span>
                <span class="pc-lv" id="pillar-${k}-lv" style="background:${p.color}1F;color:${p.color}">LV ${pl.level}</span>
              </div>
              <div class="statbar" style="height:5px"><div id="pillar-${k}-bar" style="width:${Math.min(100,(pl.xp/needed)*100)}%;background:${p.color};height:100%;border-radius:999px;transition:width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);opacity:0.85"></div></div>
              <div class="pc-xp"><span id="pillar-${k}-cur">${pl.xp}</span><span id="pillar-${k}-need">${needed}</span></div>
            </div>`;
        }).join('')}
      </div>

      <div style="border-top:1px solid rgba(255,255,255,0.05);padding-top:16px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:12px;color:rgba(255,255,255,0.65)">Discipline · 30 days</span>
            <span style="font-size:9px;text-transform:uppercase;letter-spacing:0.06em;padding:2px 6px;border-radius:999px;background:${m.color}1F;color:${m.color};border:1px solid ${m.color}55">
              ${m.tier} · ${m.mult}× XP
            </span>
          </div>
          <span style="font-size:12px;font-variant-numeric:tabular-nums;color:${m.color}">${disc}%</span>
        </div>
        ${statBarHTML(disc, 100, m.color, 8)}
        ${inUrgency ? `<div style="display:flex;align-items:center;gap:8px;margin-top:12px;padding:8px 12px;border-radius:12px;background:rgba(217,83,79,0.1);border:1px solid rgba(217,83,79,0.2);color:rgba(252,165,165,0.9);font-size:12px">
          ${icon('alert', 13)} Slacking. XP earned at half value.
        </div>` : ''}
        ${isElite ? `<div style="display:flex;align-items:center;gap:8px;margin-top:12px;padding:8px 12px;border-radius:12px;background:rgba(201,123,58,0.08);border:1px solid rgba(201,123,58,0.3);color:#C97B3A;font-size:12px">
          ${icon('award', 13)} Elite tier. 1.5× XP multiplier active.
        </div>` : ''}
      </div>
    </div>

    <!-- Fuel widget (promoted to top, replacing the workout card slot) -->
    ${renderFuelDashWidget()}

    <!-- Shadow Protocol -->
    ${renderShadowDashWidget()}

    <!-- Journal quick-access -->
    <div style="margin-bottom:14px">
      <button onclick="openModal('journal')" class="glass" style="width:100%;padding:12px 14px;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);cursor:pointer;text-align:left;color:#fff;border-radius:12px">

}

function renderQuests() {
  const todayDue = S.habits.filter(habitDueToday);
  const todayDone = S.habits.length - todayDue.length;
  const base = UI.questView === 'today' ? todayDue : S.habits;
  const filtered = UI.questFilter === 'all' ? base : base.filter(h => h.pillar === UI.questFilter);

  const chipBase = (active, color, label, action) => {
    const c = color || '#FFFFFF';
    return `<button onclick="${action}" style="
      flex-shrink:0;padding:6px 12px;border-radius:999px;
      background:${active?c+'1F':'rgba(255,255,255,0.03)'};
      border:1px solid ${active?c+'55':'rgba(255,255,255,0.07)'};
      color:${active?(c==='#FFFFFF'?'#fff':c):'rgba(255,255,255,0.6)'};
      font-size:12px;font-weight:500;
    ">${label}</button>`;
  };

  return `
    <div class="glass p-5">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h2 class="section-title">Tasks</h2>
        <button class="btn" onclick="openModal('habit')">${icon('plus', 13)} Add</button>
      </div>

      <div class="seg-bar">
        <button class="${UI.questView==='all'?'active':''}" onclick="setQuestView('all')">All · ${S.habits.length}</button>
        <button class="${UI.questView==='today'?'active':''}" onclick="setQuestView('today')">Today · ${todayDue.length}</button>
      </div>

      ${UI.questView === 'today' ? `
        <div style="font-size:11px;color:rgba(255,255,255,0.45);margin-bottom:12px;display:flex;align-items:center;gap:8px">
          ${icon('activity', 11)} <span>${todayDone} of ${S.habits.length} complete today${todayDone===S.habits.length && S.habits.length>0?' · Perfect Day ⭐':''}</span>
        </div>
      ` : ''}

      <div class="chip-scroll" style="margin-bottom:16px">
        ${chipBase(UI.questFilter === 'all', null, 'All', "setQuestFilter('all')")}
        ${Object.entries(PILLARS).map(([k,p]) => {
          const ct = base.filter(h => h.pillar === k).length;
          return chipBase(UI.questFilter === k, p.color, `${p.label} · ${ct}`, `setQuestFilter('${k}')`);
        }).join('')}
      </div>

      ${filtered.length === 0 ? `
        <div style="text-align:center;padding:40px 0;color:rgba(255,255,255,0.35);font-size:14px">
          ${UI.questView === 'today' ? 'Nothing due. Rest earned.' : 'No quests yet. Add one to begin.'}
        </div>
      ` : renderGroupedHabits(filtered)}

      <div style="font-size:10px;color:rgba(255,255,255,0.3);margin-top:16px;text-align:center;letter-spacing:0.06em">
        ${S.habits.length} / 100 habits
      </div>
    </div>

// Render a flat list of habits clustered by `group` field. Ungrouped habits show first.
// Groups have collapsible headers showing name + count + how many are done.
function renderGroupedHabits(habits) {
  if (!habits.length) return '';
  // Bucket habits by group
  const buckets = new Map(); // groupName -> habits[]
  habits.forEach(h => {
    const g = (h.group || '').trim();
    if (!buckets.has(g)) buckets.set(g, []);
    buckets.get(g).push(h);
  });
  // Order: ungrouped (empty string) first, then groups alphabetically
  const groupNames = Array.from(buckets.keys()).sort((a, b) => {
    if (a === '') return -1;
    if (b === '') return 1;
    return a.localeCompare(b);
  });

  if (!UI.collapsedGroups) UI.collapsedGroups = {};

  return groupNames.map(g => {
    const groupHabits = buckets.get(g);
    if (g === '') {
      // Ungrouped — render plainly without header
      return groupHabits.map(h => habitRowHTML(h)).join('');

    const doneCount = groupHabits.filter(h => !habitDueToday(h)).length;
    const collapsed = !!UI.collapsedGroups[g];

    const groupKey = escapeHtml(g).replace(/'/g, "\\'");

/* ============================================================
   MUSCLE MAP — visual body diagram + recovery tracking
   ============================================================ */
// Compute recovery state for a muscle group based on last hit timestamp.
// ============================================================
// RECOVERY MODEL
// Each session deposits a "fatigue load" on the muscle. That load decays
// exponentially with a half-life calibrated per muscle group. The current
// fatigue level is the sum of all decayed deposits at this moment.
//
//   fatigue(now) = Σ load_i × 0.5^((now - ts_i) / halfLife)
//
// We then express it as a 0-100% number relative to a "max useful" deposit,
// which is one full optimal session for that muscle group. The current
// fatigue % drives the cycle phase shown to the user.
// ============================================================

// Rough "fully fatigued from one session" value — calibration constant.
// In practice this varies, but provides a stable normaliser.
const FATIGUE_REF_LOAD = 2000; // matches a solid hypertrophy session

function muscleFatigue(muscleKey) {
  const hits = (S.muscleHits && S.muscleHits[muscleKey]) || [];
  if (hits.length === 0) return 0;
  const prof = profileFor(muscleKey);
  const halfLife = prof.halfLifeHours;
  const now = Date.now();
  let fatigue = 0;
  hits.forEach(h => {
    const load = h.load || 100; // legacy hits without load field count as small deposit
    const hoursAgo = (now - h.ts) / 3600000;
    if (hoursAgo < 0) return;
    // Skip ancient hits — beyond 6 half-lives the decay is negligible
    if (hoursAgo > halfLife * 6) return;
    const decay = Math.pow(0.5, hoursAgo / halfLife);
    fatigue += load * decay;
  });
  return fatigue;
}

// Convert raw fatigue into a 0-1 ratio against the reference load
function muscleFatigueRatio(muscleKey) {
  return Math.min(2, muscleFatigue(muscleKey) / FATIGUE_REF_LOAD);
}

// Cycle phase: Spent → Loading → Primed → Stale → Untrained
// Uses fatigue ratio + time since last hit.
function muscleRecoveryState(muscleKey) {
  const hits = (S.muscleHits && S.muscleHits[muscleKey]) || [];
  if (hits.length === 0) {
    return { stage: 'untrained', fatigue: 0, hoursAgo: Infinity, lastTs: 0,
             color: 'rgba(255,255,255,0.06)', label: 'Untrained' };
  }
  const lastTs = hits[hits.length - 1].ts;
  const hoursAgo = (Date.now() - lastTs) / 3600000;
  const fatigue = muscleFatigue(muscleKey);
  const ratio = fatigue / FATIGUE_REF_LOAD;

  // Stale: no work in 10+ days = detraining territory
  if (hoursAgo > 240) {
    return { stage: 'stale', fatigue, ratio, hoursAgo, lastTs,
             color: 'rgba(255,255,255,0.18)', label: 'Stale' };
  }

  // Cycle phases by fatigue ratio
  if (ratio >= 0.70) {
    return { stage: 'spent', fatigue, ratio, hoursAgo, lastTs,
             color: '#D9534F', label: 'Spent' };
  }
  if (ratio >= 0.30) {
    return { stage: 'loading', fatigue, ratio, hoursAgo, lastTs,
             color: '#C97B3A', label: 'Loading' };
  }
  return { stage: 'primed', fatigue, ratio, hoursAgo, lastTs,
           color: '#7AB17A', label: 'Primed' };
}

// Weekly frequency tracker — how many sessions hit this muscle in the last 7 days?
// Returns { hits, target, ratio } where ratio > 1 means over-target.
function muscleWeeklyFrequency(muscleKey) {
  const cutoff = Date.now() - 7 * 86400000;
  const hits = (S.muscleHits && S.muscleHits[muscleKey]) || [];
  // Dedupe by session (a muscle hit twice in the same session counts as one hit)
  const sessions = new Set();
  hits.forEach(h => {
    if (h.ts >= cutoff && h.sessionId) sessions.add(h.sessionId);
  });
  const count = sessions.size;
  const target = profileFor(muscleKey).weeklyTarget;
  return { hits: count, target, ratio: count / target };
}

// Frequency status label / color
function muscleFrequencyStatus(muscleKey) {
  const f = muscleWeeklyFrequency(muscleKey);
  if (f.hits === 0) return { ...f, status: 'idle',    color: 'rgba(255,255,255,0.4)',  label: 'Idle' };
  if (f.ratio < 0.5)  return { ...f, status: 'low',     color: '#C97B3A',                label: 'Under' };
  if (f.ratio <= 1.2) return { ...f, status: 'ontarget', color: '#7AB17A',                label: 'On target' };
  return                { ...f, status: 'over',     color: '#D9534F',                label: 'Over' };
}

// Imbalance check: push vs pull, quad vs hamstring, left/right (not applicable here).
// Returns array of warnings with { kind, severity, message }.
function detectImbalances() {
  const warnings = [];
  const vol = muscleVolumeLast30();
  const push = (vol.chest || 0) + (vol.upperChest || 0) + (vol.lowerChest || 0)
             + (vol.frontDelts || 0) + (vol.sideDelts || 0) + (vol.triceps || 0);
  const pull = (vol.back || 0) + (vol.lats || 0) + (vol.traps || 0)
             + (vol.lowerBack || 0) + (vol.rearDelts || 0) + (vol.biceps || 0);
  if (push > 100 && pull > 0) {
    const ratio = push / pull;
    if (ratio > 1.4) {
      warnings.push({ kind: 'push-pull', severity: 'warn',
        message: `Push volume is ${ratio.toFixed(1)}× pull. Add rows or pulls.` });
    } else if (ratio < 0.7) {
      warnings.push({ kind: 'push-pull', severity: 'warn',
        message: `Pull volume is ${(1/ratio).toFixed(1)}× push. Add pressing.` });
    }
  }
  const quads = vol.quads || 0;
  const hams = vol.hamstrings || 0;
  if (quads > 200 && hams > 0 && quads / hams > 2) {
    warnings.push({ kind: 'quad-ham', severity: 'warn',
      message: `Quads ${(quads/hams).toFixed(1)}× hamstrings. Add hinges/curls.` });
  }
  return warnings;
}

// Which muscles are Primed AND under their weekly target?
// Suggestion order: most under-target first.
function muscleTrainSuggestions() {
  const list = [];
  Object.keys(MUSCLE_GROUPS).forEach(k => {
    // Skip subdivisions — only suggest top-level parent groups
    if (MUSCLE_GROUPS[k].parent) return;
    const rec = muscleRecoveryState(k);
    if (rec.stage !== 'primed' && rec.stage !== 'untrained' && rec.stage !== 'stale') return;
    const freq = muscleWeeklyFrequency(k);
    if (freq.ratio >= 1) return; // already on/over target
    list.push({
      muscle: k,
      label: MUSCLE_GROUPS[k].label,
      hits: freq.hits,
      target: freq.target,
      stage: rec.stage,
      deficit: freq.target - freq.hits,
    });
  });
  list.sort((a, b) => b.deficit - a.deficit);
  return list.slice(0, 5);
}

// Last-30-day "strength" leaderboard — total effective volume per muscle
function muscleVolumeLast30() {
  const cutoff = Date.now() - 30 * 86400000;
  const tally = {};
  Object.keys(MUSCLE_GROUPS).forEach(k => tally[k] = 0);
  S.sessions.forEach(s => {
    if (s.ts < cutoff) return;
    const routine = S.routines.find(r => r.id === s.routineId);
    if (!routine) return;
    Object.entries(s.exercises || {}).forEach(([exId, sets]) => {
      const ex = routine.exercises.find(e => e.id === exId);
      if (!ex || !Array.isArray(ex.muscles)) return;
      const exVol = sets.reduce((sum, set) => sum + (set.reps||0) * effectiveLoad(ex, set.weight), 0);
      // Divide volume evenly across the muscles trained (so a 3-muscle compound counts each at 1/3)
      const portion = exVol / ex.muscles.length;
      ex.muscles.forEach(m => {
        if (tally[m] !== undefined) tally[m] += portion;
      });
    });
  });
  return tally;
}

function renderMuscleMapWidget() {
  // ============================================================
  // FULL-BODY READINESS RADAR
  // 10 axes covering the whole body — upper, core, and legs.
  // Two layers:
  //   1. WEB (volume) — 14-day total volume per axis, normalised
  //   2. VERTEX COLOR (readiness) — from last-hit timestamp
  // ============================================================

  const RADAR_AXES = [
    { key: 'chest',     label: 'Chest',     groups: ['chest','upperChest','lowerChest'] },
    { key: 'shoulders', label: 'Shoulders', groups: ['shoulders','frontDelts','sideDelts','rearDelts'] },
    { key: 'triceps',   label: 'Triceps',   groups: ['triceps'] },
    { key: 'biceps',    label: 'Biceps',    groups: ['biceps','forearms'] },
    { key: 'core',      label: 'Core',      groups: ['abs','obliques'] },
    { key: 'back',      label: 'Back',      groups: ['back','lats','traps','lowerBack'] },
    { key: 'quads',     label: 'Quads',     groups: ['quads','adductors'] },
    { key: 'hams',      label: 'Hamstrings',groups: ['hamstrings'] },
    { key: 'glutes',    label: 'Glutes',    groups: ['glutes'] },
    { key: 'calves',    label: 'Calves',    groups: ['calves'] },
  ];

  const now = Date.now();
  const cutoff14 = now - 14 * 86400000;

  // Compute per-axis volume (14d) and last-hit timestamp
  const axisData = RADAR_AXES.map(a => {
    let vol = 0;
    let lastTs = 0;
    a.groups.forEach(g => {
      const hits = (S.muscleHits && S.muscleHits[g]) || [];
      hits.forEach(h => {
        if (h.ts >= cutoff14) vol += (h.load || 100);
        if (h.ts > lastTs) lastTs = h.ts;
      });
    });
    const hoursAgo = lastTs > 0 ? (now - lastTs) / 3600000 : Infinity;
    let status, color;
    if (hoursAgo < 24) { status = 'Sore';        color = '#D9534F'; }
    else if (hoursAgo < 48) { status = 'Recovering'; color = '#C97B3A'; }
    else { status = 'Ready'; color = '#7AB17A'; }
    return { ...a, vol, lastTs, hoursAgo, status, color };
  });

  const maxVol = Math.max(1, ...axisData.map(a => a.vol));
  const normalized = axisData.map(a => ({ ...a, norm: a.vol > 0 ? Math.max(0.08, a.vol / maxVol) : 0 }));

  // SVG geometry
  const cx = 200, cy = 200;
  const R = 118;
  const N = RADAR_AXES.length;
  const angleFor = (i) => (i / N) * 2 * Math.PI - Math.PI / 2;

  // Background rings + spokes
  const ringRatios = [0.33, 0.66, 1.0];
  const webRings = ringRatios.map(r => {
    const pts = Array.from({ length: N }, (_, i) => {
      const a = angleFor(i);
      return `${(cx + Math.cos(a) * R * r).toFixed(2)},${(cy + Math.sin(a) * R * r).toFixed(2)}`;
    }).join(' ');
    return `<polygon points="${pts}" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.8"/>`;
  }).join('');

  const spokes = Array.from({ length: N }, (_, i) => {
    const a = angleFor(i);
    const x = cx + Math.cos(a) * R;
    const y = cy + Math.sin(a) * R;
    return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(2)}" y2="${y.toFixed(2)}" stroke="rgba(255,255,255,0.06)" stroke-width="0.8"/>`;
  }).join('');

  // Volume polygon
  const dataPoints = normalized.map((a, i) => {
    const ang = angleFor(i);
    const r = a.norm * R;
    return {
      x: cx + Math.cos(ang) * r,
      y: cy + Math.sin(ang) * r,
      ...a,
      ang,
    };
  });
  const polygonPts = dataPoints.map(p => `${p.x.toFixed(2)},${p.y.toFixed(2)}`).join(' ');

  // Vertex dots — colored by readiness
  const vertexDots = dataPoints.map(p =>
    `<circle cx="${p.x.toFixed(2)}" cy="${p.y.toFixed(2)}" r="3.6" fill="${p.color}" stroke="rgba(0,0,0,0.5)" stroke-width="0.6"/>`
  ).join('');

  // Numbered axis markers — placed just outside each vertex.
  // The grid below matches dot ↔ number so users can cross-reference.
  const vertexNumbers = dataPoints.map((p, i) => {
    const ang = angleFor(i);
    const labelR = R + 16;
    const lx = cx + Math.cos(ang) * labelR;
    const ly = cy + Math.sin(ang) * labelR;
    return `<text x="${lx.toFixed(2)}" y="${ly.toFixed(2)}" text-anchor="middle" dy="0.35em" font-size="11" font-weight="600" fill="rgba(255,255,255,0.55)" font-family="-apple-system,system-ui,sans-serif">${i + 1}</text>`;
  }).join('');

  // Legend
  const legend = [
    { color: '#D9534F', label: 'Sore' },
    { color: '#C97B3A', label: 'Recovering' },
    { color: '#7AB17A', label: 'Ready' },
  ];

  // Summary counts by status
  const soreCount = axisData.filter(a => a.status === 'Sore').length;
  const recoveringCount = axisData.filter(a => a.status === 'Recovering').length;
  const readyCount = axisData.filter(a => a.status === 'Ready').length;
  const untrainedCount = axisData.filter(a => a.lastTs === 0).length;

  return `
    <div class="glass p-5" style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="color:rgba(255,255,255,0.7)">${icon('dumbbell', 16)}</span>
          <h2 class="section-title">Readiness Radar</h2>
        </div>
        <button onclick="openModal('bodyweight')" style="font-size:10px;color:rgba(255,255,255,0.55);background:none;border:none;letter-spacing:0.06em">BW · ${S.bodyweight}kg</button>
      </div>
      <div style="font-size:10px;color:rgba(255,255,255,0.4);margin-bottom:8px">
        Ready: ${readyCount} · Recovering: ${recoveringCount} · Sore: ${soreCount}${untrainedCount > 0 ? ` · Untrained: ${untrainedCount}` : ''}
      </div>

      <div style="display:flex;justify-content:center;padding:0 0 4px">
        <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;max-width:280px;height:auto;margin:0 auto" preserveAspectRatio="xMidYMid meet">
          ${webRings}
          ${spokes}
          <polygon points="${polygonPts}" fill="rgba(201,123,58,0.16)" stroke="#D89060" stroke-width="1.6" stroke-linejoin="round" style="filter:drop-shadow(0 0 6px rgba(201,123,58,0.35))"/>
          ${vertexDots}
          ${vertexNumbers}
        </svg>
      </div>

      <!-- Numbered status grid — matches dot ↔ number in the radar above -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:10px">
        ${axisData.map((a, i) => `
          <div style="display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:8px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04)">
            <span style="width:18px;height:18px;border-radius:999px;background:${a.color}22;border:1px solid ${a.color}66;color:${a.color};font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-variant-numeric:tabular-nums">${i + 1}</span>
            <div style="flex:1;min-width:0;display:flex;justify-content:space-between;align-items:baseline;gap:6px">
              <span style="font-size:11px;color:rgba(255,255,255,0.85);font-weight:500">${a.label}</span>
              <span style="font-size:9px;color:rgba(255,255,255,0.4);font-variant-numeric:tabular-nums;letter-spacing:0.02em">${a.lastTs ? formatRelative(a.lastTs) : '—'}</span>
            </div>
          </div>
        `).join('')}
      </div>

      <!-- Legend -->
      <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.05);justify-content:center">
        ${legend.map(l => `
          <div style="display:inline-flex;align-items:center;gap:5px;font-size:10px;color:rgba(255,255,255,0.5)">
            <span style="width:7px;height:7px;border-radius:999px;background:${l.color}"></span>
            <span>${l.label}</span>
          </div>
        `).join('')}
      </div>
    </div>`;
}

// Format relative time for display (e.g. "2h ago", "3d ago")
function formatRelative(ts) {
  const sec = Math.max(0, (Date.now() - ts) / 1000);
  if (sec < 60) return 'just now';
  if (sec < 3600) return `${Math.floor(sec/60)}m ago`;
  if (sec < 86400) return `${Math.floor(sec/3600)}h ago`;
  const days = Math.floor(sec / 86400);
  if (days < 30) return `${days}d ago`;
  return `${Math.floor(days/30)}mo ago`;
}

function renderGym() {
  if (UI.gymView.kind === 'detail') return renderRoutineDetail(UI.gymView.id);
  if (UI.gymView.kind === 'log') return renderSessionLogger(UI.gymView.id);

  // Volume chart — uses effective load so bodyweight tonnage shows up properly
  const last7Vol = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(Date.now() - i*86400000);
    const k = dayKey(d);
    const vol = S.sessions.filter(s => dayKey(new Date(s.ts)) === k).reduce((sum, s) => {
      const routine = S.routines.find(r => r.id === s.routineId);
      let v = 0;
      Object.entries(s.exercises || {}).forEach(([exId, sets]) => {
        const ex = routine?.exercises.find(e => e.id === exId);
        sets.forEach(set => v += (set.reps||0) * effectiveLoad(ex, set.weight));
      });
      return sum + v;
    }, 0);
    last7Vol.push(vol);
  }
  const totalWeek = last7Vol.reduce((a,b) => a+b, 0);
  const sessionsWeek = S.sessions.filter(s => Date.now() - s.ts < 7*86400000).length;
  const prCount = Object.keys(S.prs).length;
  const max = Math.max(...last7Vol, 1);

  return `
    ${renderMuscleMapWidget()}

    <div class="glass p-5" style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h2 class="section-title">Routines</h2>
        <button class="btn" onclick="openModal('routine')">${icon('plus', 13)} Routine</button>
      </div>
      ${S.routines.length === 0 ? `
        <div style="text-align:center;padding:40px 0;color:rgba(255,255,255,0.35);font-size:14px">No routines. Create one to start.</div>
      ` : S.routines.map(r => routineCardHTML(r)).join('')}
    </div>

    <div class="glass p-5" style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="color:rgba(255,255,255,0.7)">${icon('bar', 16)}</span>
          <h2 class="section-title">7-Day Volume</h2>
        </div>
        <span style="font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:rgba(255,255,255,0.4)">Reps × weight</span>
      </div>
      <div>
        <div style="display:flex;align-items:flex-end;gap:6px;height:80px">
          ${last7Vol.map((v, i) => {
            const h = max > 0 ? (v/max)*100 : 0;
            const isToday = i === last7Vol.length - 1;
            return `
              <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
                <div style="font-size:8px;font-variant-numeric:tabular-nums;color:rgba(255,255,255,0.4)">${v>0?Math.round(v):''}</div>
                <div class="vol-bar" style="height:${Math.max(2,h)}%;width:100%;background:${v===0?'rgba(255,255,255,0.05)':isToday?'#D9534F':'rgba(217,83,79,0.5)'}"></div>
              </div>`;
          }).join('')}
        </div>
        <div style="display:flex;gap:6px;margin-top:4px">
          ${['6d','5d','4d','3d','2d','1d','Today'].map(l => `<div style="flex:1;text-align:center;font-size:9px;color:rgba(255,255,255,0.35);font-variant-numeric:tabular-nums">${l}</div>`).join('')}
        </div>
      </div>
      <div class="grid-3" style="margin-top:16px">
        ${[['This week', Math.round(totalWeek).toLocaleString()], ['Sessions', sessionsWeek], ['PRs set', prCount]].map(([l,v]) => `
          <div style="border-radius:12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05);padding:8px 10px">
            <div style="font-size:9px;text-transform:uppercase;letter-spacing:0.06em;color:rgba(255,255,255,0.4)">${l}</div>
            <div style="font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;color:rgba(255,255,255,0.95)">${v}</div>
          </div>
        `).join('')}
      </div>

  `;
}

window.toggleScheduleEdit = function(id) {
  const r = S.routines.find(x => x.id === id);
  if (!r) return;
  const toggle = document.getElementById('sched-toggle');
  const editing = toggle.textContent === 'Edit';
  if (editing) {
    document.querySelectorAll('.sched-day').forEach(b => {
      b.disabled = false;
      b.dataset.locked = '0';
      b.onclick = () => {
        const d = parseInt(b.dataset.day);
        let s = (r._draftSchedule || r.schedule || []).slice();
        s = s.includes(d) ? s.filter(x => x!==d) : s.concat(d);
        r._draftSchedule = s;
        b.classList.toggle('selected', s.includes(d));
      };
    });
    toggle.textContent = 'Save';
  } else {
    if (r._draftSchedule) {
      updateRoutine(id, { schedule: r._draftSchedule });
      delete r._draftSchedule;
    }
  }
};
window.toggleAddExercise = function() {
  const row = document.getElementById('ex-add-row');
  const t = document.getElementById('ex-toggle');
  const showing = row.style.display === 'block';
  row.style.display = showing ? 'none' : 'block';
  t.textContent = showing ? '+ Add' : 'Cancel';
  if (!showing) {
    _exAddState = { type: 'weighted', muscles: new Set() };
    setTimeout(() => document.getElementById('ex-name')?.focus(), 50);
  }
};
let _exAddState = { type: 'weighted', muscles: new Set() };
window.selectExType = function(t) {
  _exAddState.type = t === 'bodyweight' ? 'bodyweight' : 'weighted';
  document.querySelectorAll('.ex-type-btn').forEach(btn => {
    const sel = btn.dataset.exType === _exAddState.type;
    btn.style.background = sel ? 'rgba(74,144,194,0.14)' : 'rgba(255,255,255,0.03)';
    btn.style.borderColor = sel ? 'rgba(156,63,44,0.45)' : 'rgba(255,255,255,0.07)';
    btn.style.color = sel ? '#C97B3A' : 'rgba(255,255,255,0.7)';
  });
};
window.toggleExMuscle = function(m) {
  if (!MUSCLE_GROUPS[m]) return;
  if (_exAddState.muscles.has(m)) _exAddState.muscles.delete(m);
  else _exAddState.muscles.add(m);
  const btn = document.querySelector(`.ex-muscle-btn[data-muscle="${m}"]`);
  if (btn) {
    const sel = _exAddState.muscles.has(m);
    btn.style.background = sel ? 'rgba(217,83,79,0.16)' : 'rgba(255,255,255,0.03)';
    btn.style.borderColor = sel ? 'rgba(217,83,79,0.45)' : 'rgba(255,255,255,0.07)';
    btn.style.color = sel ? '#E07975' : 'rgba(255,255,255,0.6)';
  }
};
window.onExNameInput = function() {
  // If user typed/selected a known exercise, autofill type + muscles unless user already changed them
  const inp = document.getElementById('ex-name');
  if (!inp) return;
  const v = inp.value.trim().toLowerCase();
  const known = EXERCISE_LIBRARY.find(e => e.name.toLowerCase() === v);
  if (!known) return;
  // Only auto-fill if user hasn't selected any muscles yet
  if (_exAddState.muscles.size === 0) {
    known.muscles.forEach(m => _exAddState.muscles.add(m));
    document.querySelectorAll('.ex-muscle-btn').forEach(btn => {
      const m = btn.dataset.muscle;
      if (_exAddState.muscles.has(m)) {
        btn.style.background = 'rgba(217,83,79,0.16)';
        btn.style.borderColor = 'rgba(217,83,79,0.45)';
        btn.style.color = '#E07975';
      }
    });
    window.selectExType(known.type);
  }
};
window.confirmAddExercise = function(routineId) {
  const v = document.getElementById('ex-name').value.trim();
  if (!v) return;
  addExerciseToRoutine(routineId, v, {
    type: _exAddState.type,
    muscles: Array.from(_exAddState.muscles),
  });
  _exAddState = { type: 'weighted', muscles: new Set() };
};

// Inline edit state for existing exercises
let _exEditState = { type: 'weighted', muscles: new Set() };
window.startExEdit = function(exId) {
  // Find the exercise across all routines so we can seed local state
  let foundEx = null;
  S.routines.forEach(r => {
    const x = r.exercises.find(e => e.id === exId);
    if (x) foundEx = x;
  });
  _exEditState = {
    type: foundEx?.type === 'bodyweight' ? 'bodyweight' : 'weighted',
    muscles: new Set(Array.isArray(foundEx?.muscles) ? foundEx.muscles : []),
  };
  UI.editingExercise = exId;
  render();
};
window.cancelExEdit = function() {
  UI.editingExercise = null;
  render();
};
window.selectExEditType = function(t) {
  _exEditState.type = t === 'bodyweight' ? 'bodyweight' : 'weighted';
  // Update visual state on the two pills without re-rendering the whole tree
  document.querySelectorAll('[data-ex-edit-type]').forEach(btn => {
    const sel = btn.dataset.exEditType === _exEditState.type;
    btn.style.background = sel ? 'rgba(74,144,194,0.14)' : 'rgba(255,255,255,0.03)';
    btn.style.borderColor = sel ? 'rgba(156,63,44,0.45)' : 'rgba(255,255,255,0.07)';
    btn.style.color = sel ? '#C97B3A' : 'rgba(255,255,255,0.7)';
  });
};
window.toggleExEditMuscle = function(m) {
  if (!MUSCLE_GROUPS[m]) return;
  if (_exEditState.muscles.has(m)) _exEditState.muscles.delete(m);
  else _exEditState.muscles.add(m);
  const btn = document.querySelector(`[data-edit-muscle="${m}"]`);
  if (btn) {
    const sel = _exEditState.muscles.has(m);
    btn.style.background = sel ? 'rgba(217,83,79,0.16)' : 'rgba(255,255,255,0.03)';
    btn.style.borderColor = sel ? 'rgba(217,83,79,0.45)' : 'rgba(255,255,255,0.07)';
    btn.style.color = sel ? '#E07975' : 'rgba(255,255,255,0.6)';
  }
};
window.saveExEdit = function(routineId, exId) {
  const nameEl = document.getElementById('ex-edit-name');
  const newName = nameEl ? nameEl.value.trim() : '';
  updateExercise(routineId, exId, {
    name: newName || undefined,
    type: _exEditState.type,
    muscles: Array.from(_exEditState.muscles),
  });
  UI.editingExercise = null;
  // updateExercise calls render() already
};
let _delConfirm = null;
window.confirmDeleteRoutine = function(id) {
  const btn = document.getElementById('del-btn');
  if (_delConfirm === id) {
    removeRoutine(id);
    _delConfirm = null;
    return;
  }
  _delConfirm = id;
  btn.textContent = 'Tap again to confirm';
  btn.style.background = 'rgba(217,83,79,0.18)';
  btn.style.borderColor = 'rgba(217,83,79,0.5)';
  btn.style.color = '#E07975';
  setTimeout(() => {
    if (_delConfirm === id) {
      _delConfirm = null;
      try {
        btn.textContent = 'Delete Routine';
        btn.style.background = 'rgba(255,255,255,0.04)';
        btn.style.borderColor = 'rgba(255,255,255,0.08)';
        btn.style.color = 'rgba(255,150,150,0.85)';
      } catch {}
    }
  }, 3000);
};

// Session logger state lives outside re-render
let _logState = null;
function renderSessionLogger(id) {
  const r = S.routines.find(x => x.id === id);
  if (!r) {
    return `<div class="glass p-5" style="text-align:center;color:rgba(255,255,255,0.55)">Routine not found.<button onclick="setGymView('list')" style="display:block;margin:12px auto;background:none;border:none;color:rgba(255,255,255,0.85);font-size:12px">Back</button></div>`;
  }
  const sessions = S.sessions.filter(s => s.routineId === id);
  const last = sessions.sort((a,b) => b.ts - a.ts)[0];

  // Init state if needed. Fields start empty every workout — you fill them
  // in as you go. The number of sets defaults to what you did last time (or 1
  // if this is a first attempt), and your last session's reps × weight is shown
  // below each set as a reference, but not pre-filled.
  if (!_logState || _logState.routineId !== id) {
    _logState = { routineId: id, data: {} };
    r.exercises.forEach(ex => {
      const ls = last?.exercises?.[ex.id];
      const setCount = ls?.length || 1;
      _logState.data[ex.id] = Array.from({ length: setCount }, () => ({ reps: 0, weight: 0 }));
    });
  }

  let totalVol = 0;
  Object.entries(_logState.data).forEach(([exId, sets]) => {
    const ex = r.exercises.find(e => e.id === exId);
    sets.forEach(s => totalVol += (s.reps||0) * effectiveLoad(ex, s.weight));
  });

  return `
    <div class="glass p-5">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
        <button onclick="cancelLog()" style="width:32px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:#fff">${icon('back', 14)}</button>
        <div style="flex:1;min-width:0">
          <div style="font-size:10px;text-transform:uppercase;letter-spacing:0.22em;color:rgba(248,113,113,0.8)">Logging</div>
          <h2 class="section-title" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(r.name)}</h2>
        </div>
        <div style="text-align:right">
          <div style="font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:rgba(255,255,255,0.4)">Volume</div>
          <div id="vol-total" style="font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;color:#D9534F">${Math.round(totalVol)}</div>
        </div>
      </div>

      ${(() => {
        // Last session summary card — shows rating, notes, and date at the top.
        // Only draws when the previous session actually has rating or notes.
        if (!last) return '';
        const hasRating = typeof last.rating === 'number' && last.rating >= 1 && last.rating <= 5;
        const hasNotes = last.notes && last.notes.trim();
        if (!hasRating && !hasNotes) return '';
        const showFull = UI.expandedLastSession === true;
        const d = new Date(last.ts);
        const dateStr = d.toLocaleDateString('en-GB', { weekday: 'short', day: '2-digit', month: 'short' });
        const stars = hasRating ? `
          <span style="display:inline-flex;align-items:center;gap:1px;color:#C97B3A;font-variant-numeric:tabular-nums">
            ${[1,2,3,4,5].map(n => `<span style="opacity:${n<=last.rating?'1':'0.18'};display:inline-flex">${icon('star', 10)}</span>`).join('')}
            <span style="margin-left:4px;font-size:10px;font-weight:600">${last.rating}/5</span>
          </span>` : '';
        const noteText = hasNotes ? last.notes.trim() : '';
        const preview = noteText.length > 90 ? noteText.slice(0, 90) + '…' : noteText;
        return `
          <div style="border-radius:14px;background:rgba(201,123,58,0.06);border:1px solid rgba(201,123,58,0.22);padding:10px 12px;margin-bottom:14px">
            <button onclick="toggleLastSessionSummary()" style="display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:none;padding:0;color:inherit;cursor:pointer;text-align:left">
              <div style="min-width:0;flex:1">
                <div style="font-size:9px;text-transform:uppercase;letter-spacing:0.08em;color:rgba(201,123,58,0.85);margin-bottom:3px;display:flex;align-items:center;gap:6px">
                  ${icon('scroll', 10)} Last session · ${dateStr}
                </div>
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                  ${stars}
                  ${hasNotes && !showFull ? `<span style="font-size:11px;color:rgba(255,255,255,0.72);font-style:italic;overflow:hidden;text-overflow:ellipsis">"${escapeHtml(preview)}"</span>` : ''}
                </div>
              </div>
              ${hasNotes ? `<span style="color:rgba(201,123,58,0.75);transform:rotate(${showFull?'180':'0'}deg);transition:transform 0.15s;flex-shrink:0;margin-left:8px">${icon('chev', 11)}</span>` : ''}
            </button>
            ${showFull && hasNotes ? `
              <div style="margin-top:8px;padding-top:8px;border-top:1px solid rgba(201,123,58,0.15);font-size:12px;color:rgba(255,255,255,0.85);line-height:1.5;white-space:pre-wrap;word-wrap:break-word">${escapeHtml(noteText)}</div>
            ` : ''}
          </div>`;
      })()}

      <div>
      ${r.exercises.map(ex => {
        const lastSets = last?.exercises?.[ex.id];
        const pr = S.prs[ex.id];
        const sets = _logState.data[ex.id] || [];
        const isBw = ex.type === 'bodyweight';
        return `
          <div style="border-radius:16px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);padding:12px;margin-bottom:12px" data-ex="${ex.id}">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
              <div style="display:flex;align-items:center;gap:8px;min-width:0">
                <span style="color:${isBw?'#7AB17A':'rgba(255,255,255,0.55)'};flex-shrink:0">${icon(isBw?'flame':'dumbbell', 14)}</span>
                <span style="font-size:14px;font-weight:500;color:rgba(255,255,255,0.95);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(ex.name)}${isBw?` <span style="font-size:9px;color:#7AB17A;letter-spacing:0.06em;text-transform:uppercase;margin-left:4px">BW</span>`:''}</span>
              </div>
              ${pr && pr.topWeight > 0 ? `<span style="font-size:9px;text-transform:uppercase;letter-spacing:0.06em;color:rgba(252,211,77,0.8);font-variant-numeric:tabular-nums;flex-shrink:0">PR ${Math.round(pr.topWeight*10)/10}kg${isBw?' eff.':''}</span>` : ''}
            </div>

            ${isBw ? `
              <div style="font-size:10px;color:rgba(122,177,122,0.75);background:rgba(122,177,122,0.06);border:1px solid rgba(122,177,122,0.2);padding:6px 8px;border-radius:6px;margin-bottom:8px;line-height:1.4">
                Bodyweight movement. Enter <strong>+kg</strong> as <strong>added load</strong> · 0 = pure bodyweight · negative = assistance.<br>
                Effective load per rep: BW (${S.bodyweight}kg) + added.
              </div>
            ` : ''}

            ${(() => {
              // Progressive overload hint — based on last session's sets of this exercise.
              // If every set hit 12+ reps at the same weight (and there were 3+ sets),
              // suggest bumping the weight and aiming for 8 reps.
              // Otherwise, per-set target: last reps + 2, capped at 12.
              if (!lastSets || lastSets.length === 0) return '';
              const RESUME_REPS = 8, TARGET_CAP = 12, STEP = 2;
              // Weight-up trigger: at least 3 sets, all reps >= 12, all same weight
              const allAtCap = lastSets.length >= 3 &&
                lastSets.every(x => (x.reps || 0) >= TARGET_CAP) &&
                lastSets.every(x => x.weight === lastSets[0].weight);
              if (allAtCap) {
                const nextWeight = lastSets[0].weight + (isBw ? 1 : 2.5);
                const wLabel = isBw ? `${nextWeight>=0?'+':''}${nextWeight}kg added` : `${nextWeight}kg`;
                return `
                  <div style="font-size:11px;color:rgba(201,123,58,0.95);background:rgba(201,123,58,0.10);border:1px solid rgba(201,123,58,0.35);padding:8px 10px;border-radius:8px;margin-bottom:8px;line-height:1.4;display:flex;align-items:center;gap:6px">
                    <span style="flex-shrink:0">${icon('sparkles', 12)}</span>
                    <span><strong>Weight up:</strong> try ${wLabel} — aim for ${RESUME_REPS} reps</span>
                  </div>`;
              }
              // Per-set target hints — one row per last-session set
              const targets = lastSets.map((x, i) => {
                const r = x.reps || 0;
                if (r === 0) return null;
                const target = Math.min(TARGET_CAP, r + STEP);
                const w = x.weight;
                const wLabel = isBw ? `${w>=0?'+':''}${w}kg` : `${w}kg`;
                return { setNum: i + 1, target, w, wLabel };
              }).filter(Boolean);
              if (targets.length === 0) return '';
              return `
                <div style="font-size:11px;color:rgba(201,123,58,0.9);background:rgba(201,123,58,0.06);border:1px solid rgba(201,123,58,0.22);padding:8px 10px;border-radius:8px;margin-bottom:8px;line-height:1.4">
                  <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:9px;text-transform:uppercase;letter-spacing:0.08em;color:rgba(201,123,58,0.85);font-weight:600">
                    ${icon('sparkles', 10)} Push for
                  </div>
                  <div style="display:flex;flex-wrap:wrap;gap:6px">
                    ${targets.map(t => `<span style="font-variant-numeric:tabular-nums;padding:2px 6px;border-radius:4px;background:rgba(201,123,58,0.10);color:rgba(255,255,255,0.85);border:1px solid rgba(201,123,58,0.20);font-size:10px"><strong>${t.target}</strong> × ${t.wLabel} <span style="opacity:0.55">· set ${t.setNum}</span></span>`).join('')}
                  </div>
                </div>`;
            })()}

            ${(() => {
              // Per-exercise history: last N completed sessions of this routine
              // that touched this exercise. Not just the routine's sessions —
              // some exercises may exist across multiple routines. Prioritise
              // sessions of THIS routine to keep the comparison faithful.
              const exHistory = (S.sessions || [])
                .filter(x => x.completed && x.exercises && Array.isArray(x.exercises[ex.id]) && x.exercises[ex.id].length > 0)
                .sort((a, b) => b.ts - a.ts)
                .slice(0, 4);
              if (exHistory.length === 0) return '';
              const isExpanded = UI.expandedHistory && UI.expandedHistory[ex.id];
              const preview = exHistory[0];
              return `
                <div style="border-radius:8px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.04);padding:8px;margin-bottom:8px">
                  <button onclick="toggleExHistory('${ex.id}')" style="display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:none;padding:0;color:inherit;cursor:pointer">
                    <div style="text-align:left">
                      <div style="font-size:9px;text-transform:uppercase;letter-spacing:0.06em;color:rgba(255,255,255,0.4);margin-bottom:4px">Last session — beat this</div>
                      <div style="display:flex;flex-wrap:wrap;gap:4px">
                        ${preview.exercises[ex.id].map(s => `<div style="font-size:10px;font-variant-numeric:tabular-nums;padding:2px 6px;border-radius:4px;background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.55)">${s.reps}×${isBw?(s.weight>=0?'+':'')+s.weight:s.weight}</div>`).join('')}
                      </div>
                    </div>
                    <span style="font-size:9px;color:rgba(201,123,58,0.75);letter-spacing:0.04em;text-transform:uppercase;display:inline-flex;align-items:center;gap:2px;flex-shrink:0;margin-left:8px">
                      ${isExpanded ? 'Hide' : `+${exHistory.length-1||''} more`}
                      <span style="transform:rotate(${isExpanded?'180':'0'}deg);transition:transform 0.15s">${icon('chev', 10)}</span>
                    </span>
                  </button>
                  ${isExpanded && exHistory.length > 1 ? `
                    <div style="margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.05);display:flex;flex-direction:column;gap:6px">
                      ${exHistory.slice(1).map(sess => {
                        const d = new Date(sess.ts);
                        const dateStr = d.toLocaleDateString('en-GB', { weekday: 'short', day: '2-digit', month: 'short' });
                        return `
                          <div>
                            <div style="font-size:9px;text-transform:uppercase;letter-spacing:0.06em;color:rgba(255,255,255,0.35);margin-bottom:3px">${dateStr}</div>
                            <div style="display:flex;flex-wrap:wrap;gap:4px">
                              ${sess.exercises[ex.id].map(s => `<div style="font-size:10px;font-variant-numeric:tabular-nums;padding:2px 6px;border-radius:4px;background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.5)">${s.reps}×${isBw?(s.weight>=0?'+':'')+s.weight:s.weight}</div>`).join('')}
                            </div>
                            ${sess.notes && sess.notes.trim() ? `<div style="font-size:10px;color:rgba(255,255,255,0.55);margin-top:3px;line-height:1.4;font-style:italic">"${escapeHtml(sess.notes.length > 100 ? sess.notes.slice(0, 100)+'…' : sess.notes)}"</div>` : ''}
                          </div>`;
                      }).join('')}
                    </div>
                  ` : ''}
                </div>
              `;
            })()}

            <div data-sets="${ex.id}">
              ${sets.map((s,i) => setRowHTML(ex.id, i, s, lastSets?.[i], ex)).join('')}
            </div>
            <button onclick="addLogSet('${ex.id}')" style="width:100%;font-size:11px;padding:6px 0;margin-top:6px;border-radius:8px;border:1px dashed rgba(255,255,255,0.1);background:transparent;color:rgba(255,255,255,0.55)">+ Set</button>
          </div>`;
      }).join('')}
      </div>

      <!-- Post-workout notes + rating -->
      <div style="margin-top:16px;padding:14px;border-radius:14px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08)">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">
          <div>
            <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:rgba(255,255,255,0.6);font-weight:600">Notes</div>
            <div style="font-size:10px;color:rgba(255,255,255,0.35);margin-top:1px">Optional · how it went, cues for next time</div>
          </div>
          <div id="workout-rating-row" style="display:flex;gap:4px">
            ${[1,2,3,4,5].map(n => {
              const cur = (_logState && _logState.rating) || 0;
              const active = cur && n <= cur;
              return `<button type="button" class="wr-star" data-rating="${n}" onclick="setWorkoutRating(${n})" style="width:28px;height:28px;border-radius:7px;background:${active?'rgba(201,123,58,0.18)':'rgba(255,255,255,0.04)'};border:1px solid ${active?'rgba(201,123,58,0.45)':'rgba(255,255,255,0.10)'};color:${active?'#C97B3A':'rgba(255,255,255,0.45)'};display:flex;align-items:center;justify-content:center;padding:0">${icon('star', 13)}</button>`;
            }).join('')}
          </div>
        </div>
        <textarea id="workout-notes" placeholder="e.g. Form felt solid on bench. Bump squat to 90kg next session." style="width:100%;min-height:72px;padding:10px;font-size:13px;line-height:1.45;resize:vertical;font-family:inherit;background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.06);color:rgba(255,255,255,0.9);border-radius:10px" oninput="if(_logState)_logState.notes=this.value">${escapeHtml((_logState && _logState.notes) || '')}</textarea>
      </div>

      <div style="display:flex;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.05)">
        <button onclick="cancelLog()" style="flex:1;height:40px;border-radius:999px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:rgba(255,255,255,0.65);font-size:12px">Cancel</button>
        <button onclick="submitLog()" style="flex:1;height:40px;border-radius:999px;font-size:12px;font-weight:600;background:#D9534F;color:#fff;border:none;box-shadow:0 0 16px rgba(217,83,79,0.3)">Complete · +${XP.GYM_SESSION} XP</button>
      </div>
    </div>`;
}

function setRowHTML(exId, i, s, ref, ex) {
  const isBw = ex && ex.type === 'bodyweight';
  // For bodyweight: weight = added load (negative = assistance, e.g. assisted pull-ups)
  const weightStep = isBw ? '1' : '0.5';
  const unitLabel = isBw ? '+kg' : 'kg';
  // For bodyweight, show a ± toggle button so users can flip the sign with one tap —
  // Android keyboards don't reliably expose the minus key even with inputmode="numeric".
  const signBtn = isBw
    ? `<button onclick="flipSetWeight('${exId}', ${i})" title="Flip sign" style="width:24px;height:28px;flex-shrink:0;border-radius:5px;background:${s.weight < 0 ? 'rgba(176,56,42,0.18)' : 'var(--bg-3)'};border:1px solid ${s.weight < 0 ? 'rgba(176,56,42,0.45)' : 'var(--line-2)'};color:${s.weight < 0 ? '#D9534F' : 'rgba(255,255,255,0.7)'};font-size:12px;font-weight:700;padding:0;display:flex;align-items:center;justify-content:center;line-height:1">±</button>`
    : '';
  // Values of 0 render as empty inputs. No ghost placeholders — clean fields
  // every workout.
  const repsVal = s.reps > 0 ? s.reps : '';
  const weightVal = (s.weight !== 0) ? s.weight : '';

  return `
    <div class="set-block" style="margin-bottom:4px">
      <div class="set-row">
        <span class="set-label">#${i+1}</span>
        <input type="number" inputmode="numeric" value="${repsVal}" oninput="updateSet('${exId}', ${i}, 'reps', this.value)" />
        <span class="set-unit">reps</span>
        <input type="number" inputmode="decimal" step="${weightStep}" value="${weightVal}" oninput="updateSet('${exId}', ${i}, 'weight', this.value)" />
        ${signBtn}
        <span class="set-unit">${unitLabel}</span>
        ${(_logState.data[exId]||[]).length > 1 ? `<button onclick="removeLogSet('${exId}', ${i})" style="width:20px;height:20px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:none;border:none;color:rgba(255,255,255,0.4)">${icon('x', 10)}</button>` : ''}
      </div>
    </div>`;
}

window.flipSetWeight = function(exId, i) {
  if (!_logState) return;
  const cur = _logState.data[exId][i].weight || 0;
  _logState.data[exId][i].weight = -cur;
  render();
};

window.updateSet = function(exId, i, key, v) {
  if (!_logState) return;
  const num = parseFloat(v) || 0;
  _logState.data[exId][i][key] = num;
  // Recompute total volume in place — use effective load so bodyweight counts properly
  const routine = S.routines.find(r => r.id === _logState.routineId);
  let tv = 0;
  Object.entries(_logState.data).forEach(([eid, sets]) => {
    const ex = routine?.exercises.find(e => e.id === eid);
    sets.forEach(s => tv += (s.reps||0) * effectiveLoad(ex, s.weight));
  });
  const el = document.getElementById('vol-total');
  if (el) el.textContent = Math.round(tv);
};
window.toggleExHistory = function(exId) {
  if (!UI.expandedHistory) UI.expandedHistory = {};
  UI.expandedHistory[exId] = !UI.expandedHistory[exId];
  render();
};
window.toggleLastSessionSummary = function() {
  UI.expandedLastSession = !UI.expandedLastSession;
  render();
};
window.addLogSet = function(exId) {
  if (!_logState) return;
  const last = _logState.data[exId][_logState.data[exId].length - 1];
  _logState.data[exId].push({ reps: last?.reps || 8, weight: last?.weight || 0 });
  render();
};
window.removeLogSet = function(exId, i) {
  if (!_logState) return;
  _logState.data[exId] = _logState.data[exId].filter((_, idx) => idx !== i);
  render();
};
window.cancelLog = function() {
  _logState = null;
  UI.gymView = { kind: 'list' };
  render();
};
window.setWorkoutRating = function(n) {
  if (!_logState) return;
  // Toggle off if same rating tapped again
  _logState.rating = (_logState.rating === n) ? null : n;
  const cur = _logState.rating;
  document.querySelectorAll('.wr-star').forEach(btn => {
    const i = parseInt(btn.dataset.rating);
    const active = cur && i <= cur;
    btn.style.background = active ? 'rgba(201,123,58,0.18)' : 'rgba(255,255,255,0.04)';
    btn.style.borderColor = active ? 'rgba(201,123,58,0.45)' : 'rgba(255,255,255,0.10)';
    btn.style.color = active ? '#C97B3A' : 'rgba(255,255,255,0.45)';
  });
};
window.submitLog = function() {
  if (!_logState) return;
  const data = _logState.data;
  const id = _logState.routineId;
  // Capture latest notes from the textarea in case oninput hasn't fired
  const notesEl = document.getElementById('workout-notes');
  if (notesEl) _logState.notes = notesEl.value;
  const notes = (_logState.notes || '').trim();
  const rating = (typeof _logState.rating === 'number') ? _logState.rating : null;
  _logState = null;
  logSession(id, data, { notes, rating });
};

function renderFuelHistoryItems() {
  // Last 30 days, newest first, only days with entries
  const entries = Object.entries(S.nutrition || {})
    .filter(([_, d]) => d && (d.cals > 0 || d.protein > 0))
    .sort((a, b) => (a[0] < b[0] ? 1 : -1));
  if (entries.length === 0) {
    return `<div style="text-align:center;padding:24px 0;color:rgba(255,255,255,0.35);font-size:13px">No nutrition logged yet.</div>`;
  }
  return entries.slice(0, 60).map(([date, d]) => {
    const dt = new Date(date + 'T12:00:00');
    const lbl = dt.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
    const hitCals = d.cals >= S.nutritionGoals.cals * 0.9 && d.cals <= S.nutritionGoals.cals * 1.1;
    const hitProtein = d.protein >= S.nutritionGoals.protein;
    const both = hitCals && hitProtein;
    return `
      <div style="display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05);margin-bottom:6px">

        </div>
        ${both ? `<span style="font-size:11px;color:rgba(122,177,122,0.85)">✓</span>` : ''}
      </div>`;
  }).join('');
}

window.submitExactNutrition = function() {
  const cIn = document.getElementById('fuel-cals-input');
  const pIn = document.getElementById('fuel-protein-input');
  const c = parseInt(cIn.value) || 0;
  const p = parseInt(pIn.value) || 0;
  if (c === 0 && p === 0) return;
  addNutrition(c, p);
  cIn.value = '';

};
let _resetConfirm = false;
window.confirmResetToday = function() {
  if (_resetConfirm) {
    resetToday();
    _resetConfirm = false;
    return;
  }
  _resetConfirm = true;
  // Visual confirm — find the button and re-label it briefly
  const btns = document.querySelectorAll('button');
  let target = null;
  btns.forEach(b => { if (b.textContent.trim() === 'Reset today') target = b; });
  if (target) {
    const orig = target.textContent;
    target.textContent = 'Tap again to confirm';
    target.style.color = '#E07975';
    setTimeout(() => {
      if (target) {
        try { target.textContent = orig; target.style.color = 'rgba(255,150,150,0.85)'; } catch {}
      }
      _resetConfirm = false;
    }, 3000);
  }
};
