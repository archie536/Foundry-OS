<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Foundry OS.</title>
<link rel="manifest" href="manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* ============================================================
   FOUNDRY OS. — single-file build
   ============================================================ */

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
/* ============================================================
   FOUNDRY OS — Vault edition
   Deep matte blacks, structured industrial surfaces, minimal glass.
   ============================================================ */
:root {
  /* Surfaces — pure black-as-night, barely-there tonal steps */
  --bg-0: #000000;        /* page void — true black */
  --bg-1: #050505;        /* deep panel */
  --bg-2: #0a0a0a;        /* card surface */
  --bg-3: #0f0f0f;        /* raised surface */
  --bg-4: #141414;        /* interactive / input */
  --bg-5: #1a1a1a;        /* hover / picked states */
  /* Hairlines — desaturated tactical edges */
  --line-1: rgba(255,255,255,0.04);    /* faintest hairline */
  --line-2: rgba(255,255,255,0.07);    /* defined edge */
  --line-3: rgba(255,255,255,0.14);    /* focus edge */
  --line-cold: rgba(255,255,255,0.05);
  /* Text — neutral cool-white, no warm tint */
  --text-1: rgba(255,255,255,0.96);   /* primary */
  --text-2: rgba(255,255,255,0.62);   /* secondary */
  --text-3: rgba(255,255,255,0.38);   /* meta */
  --text-4: rgba(255,255,255,0.20);   /* faint */
  /* Accents — minimal, tactical, no teal */
  --accent-copper: #C97B3A;           /* tactical bronze — Resolve, Focus, primary highlights */
  --accent-copper-deep: #8E5224;
  --accent-copper-glow: rgba(201,123,58,0.5);
  --accent-red: #B0382A;              /* deep crimson — Strength, penalties */
  --accent-gold: #C9994E;              /* deeper, more tactical gold — Vitality, status accents */
  --accent-green: #6A9462;            /* muted operative green — Ready, success */
}
html { background: var(--bg-0); }
html, body {
  margin: 0; padding: 0;
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  font-feature-settings: "cv11", "ss01", "ss03", "tnum";
  letter-spacing: -0.005em;
  background: var(--bg-0);
  color: var(--text-1);
  overflow: hidden;
  overscroll-behavior: none;
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation;
}
#scroller {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior-y: contain;
  -webkit-overflow-scrolling: touch;
}
button, input { font-family: inherit; }
button { cursor: pointer; }
input, textarea {
  -webkit-user-select: text; user-select: text;
  color: var(--text-1) !important;
  caret-color: rgba(255,255,255,0.85);
  background-color: var(--bg-4) !important;
  border: 1px solid var(--line-2);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 14px;
  font-weight: 500;
  outline: none;
  width: 100%;
  letter-spacing: -0.005em;
}
input:focus, textarea:focus {
  background-color: #1f1a1f !important;
  border-color: rgba(201,123,58,0.45);
  box-shadow: 0 0 0 1px rgba(201,123,58,0.15), inset 0 1px 0 rgba(201,123,58,0.08);
}
input::placeholder, textarea::placeholder { color: var(--text-3) !important; font-weight: 400; }
input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus {
  -webkit-text-fill-color: var(--text-1) !important;
  -webkit-box-shadow: 0 0 0 1000px var(--bg-4) inset !important;
  transition: background-color 5000s ease-in-out 0s;
}
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type="number"] { -moz-appearance: textfield; }
input[type="range"] { accent-color: var(--accent-red); padding: 0; background: transparent !important; border: none; }
::-webkit-scrollbar { width: 0; height: 0; display: none; }
::-webkit-scrollbar-thumb { background: transparent; }
* { scrollbar-width: none; -ms-overflow-style: none; }

/* ============================================================
   APP BACKGROUND — sparse industrial ambient.
   Just a faint accent at the very top for atmosphere, nothing bright.
   ============================================================ */
body::before {
  content: '';
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse 60% 30% at 50% 0%, rgba(201,123,58,0.04), transparent 70%),
    #000000;
  transition: background 0.6s ease;
}
body.urgency::before {
  background:
    radial-gradient(ellipse 80% 50% at 50% 0%, rgba(176,56,42,0.18), transparent 65%),
    #050000;
}
body.elite::before {
  background:
    radial-gradient(ellipse 60% 30% at 50% 0%, rgba(201,123,58,0.10), transparent 70%),
    #000000;
}

#app {
  position: relative; z-index: 1;
  max-width: 640px; margin: 0 auto;
  padding: calc(max(env(safe-area-inset-top), 44px) + 8px) 16px 140px 16px;
}

/* Vignette overlay — darkens screen edges for that cinematic-grunge feel */
body::after {
  content: '';
  position: fixed; inset: 0; pointer-events: none; z-index: 2;
  background:
    radial-gradient(ellipse 110% 90% at 50% 50%, transparent 50%, rgba(0,0,0,0.45) 100%);
}

/* ============================================================
   STRUCTURED MATTE PANELS — solid surfaces, hairline borders.
   No backdrop blur on cards anymore — they're opaque dark panels.
   ============================================================ */
.glass {
  position: relative;
  background: var(--bg-2);
  border: 1px solid var(--line-2);
  border-radius: 10px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.025),
    inset 0 -1px 0 rgba(0,0,0,0.6),
    0 1px 0 rgba(0,0,0,0.8),
    0 4px 16px rgba(0,0,0,0.5);
}
.glass.p-5 { padding: 16px; }
.glass.p-4 { padding: 14px; }
/* Subtle inner texture — tactical noise, very faint */
.glass::before {
  content: '';
  position: absolute; inset: 0;
  border-radius: inherit;
  pointer-events: none;
  opacity: 0.5;
  background-image:
    linear-gradient(180deg, rgba(255,255,255,0.012) 0%, transparent 8%, transparent 92%, rgba(0,0,0,0.4) 100%);
}

/* Header */
header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 20px;
}
h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; margin: 0; color: var(--text-1); }
.eyebrow {
  font-size: 9px; text-transform: uppercase; letter-spacing: 0.22em;
  color: var(--text-3); margin-bottom: 4px; font-weight: 600;
}
.lv-pill {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em;
  padding: 5px 9px; border-radius: 5px;
  background: var(--bg-3);
  border: 1px solid var(--line-2);
  color: var(--text-1);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.lv-pill.elite {
  background: rgba(201,123,58,0.12);
  border-color: rgba(201,123,58,0.4);
  color: var(--accent-copper);
  box-shadow: 0 0 12px rgba(201,123,58,0.22);
}
.ap-pill {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 9px; letter-spacing: 0.14em;
  padding: 3px 7px; border-radius: 5px;
  background: rgba(201,123,58,0.12);
  border: 1px solid rgba(201,123,58,0.40);
  color: var(--accent-copper);
  margin-top: 4px;
  cursor: pointer;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

/* ============================================================
   TAB BAR — warm-tinted black panel with copper highlight on active
   ============================================================ */
#tabbar {
  position: fixed; left: 12px; right: 12px;
  bottom: max(env(safe-area-inset-bottom), 20px);
  z-index: 30;
  max-width: 616px; margin: 0 auto;
  background: rgba(0,0,0,0.94);
  border: 1px solid var(--line-2);
  border-radius: 12px;
  display: flex; justify-content: space-around;
  padding: 6px 4px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.04),
    inset 0 -1px 0 rgba(0,0,0,0.8),
    0 -4px 32px rgba(0,0,0,0.8),
    0 0 0 1px rgba(0,0,0,0.6);
}
.tab-btn {
  flex: 1; min-width: 0;
  background: transparent; border: none;
  padding: 8px 4px; border-radius: 8px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: var(--text-3);
  transition: color 0.15s, background 0.15s;
  position: relative;
}
.tab-btn.active {
  background: linear-gradient(180deg, rgba(201,123,58,0.16), rgba(201,123,58,0.04));
  border: 1px solid rgba(201,123,58,0.40);
  color: var(--accent-copper);
  box-shadow:
    inset 0 1px 0 rgba(201,123,58,0.22),
    0 0 12px rgba(201,123,58,0.18);
}
.tab-btn span { font-size: 9px; font-weight: 600; letter-spacing: 0.02em; }
.tab-btn svg { width: 18px; height: 18px; }

/* ============================================================
   BUTTONS — squared off, opaque, no glass
   ============================================================ */
.btn {
  background: var(--bg-3);
  border: 1px solid var(--line-2);
  color: var(--text-1);
  padding: 6px 12px; border-radius: 7px;
  font-size: 12px; font-weight: 600; letter-spacing: -0.005em;
  display: inline-flex; align-items: center; gap: 6px;
  transition: background 0.12s, border-color 0.12s;
}
.btn:hover { background: var(--bg-4); border-color: var(--line-3); }
.btn-primary {
  background: linear-gradient(180deg, var(--accent-copper) 0%, var(--accent-copper-deep) 100%);
  color: #1a0e06;
  border: 1px solid rgba(201,123,58,0.6);
  padding: 12px 20px; border-radius: 10px;
  font-weight: 700; font-size: 14px; letter-spacing: -0.01em;
  width: 100%;
  box-shadow:
    inset 0 1px 0 rgba(255,200,150,0.35),
    0 4px 12px rgba(201,123,58,0.25);
  text-shadow: 0 1px 0 rgba(255,220,180,0.3);
}
.btn-danger {
  background: var(--accent-red); color: #fff; border: 1px solid var(--accent-red);
  padding: 8px 16px; border-radius: 7px; font-size: 12px; font-weight: 700; letter-spacing: -0.005em;
  box-shadow: 0 0 12px rgba(192,74,58,0.25);
}
.btn-pillar { padding: 6px 14px; border-radius: 7px; font-size: 11px; font-weight: 700; border: 1px solid; letter-spacing: -0.005em; }
.btn[disabled], button[disabled] { opacity: 0.4; cursor: not-allowed; }

/* ============================================================
   BACKLIT STAT BARS — recessed channels with bright interior fill
   ============================================================ */
.statbar {
  width: 100%; height: 6px;
  background: #000;
  border-radius: 2px; overflow: hidden;
  border: 1px solid rgba(0,0,0,0.6);
  box-shadow:
    inset 0 1px 2px rgba(0,0,0,0.9),
    inset 0 -1px 0 rgba(201,123,58,0.06);
}
.statbar > div {
  height: 100%; border-radius: 2px;
  transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
  box-shadow: 0 0 10px currentColor, 0 0 4px currentColor;
}
.statbar > div::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(255,210,170,0.35), transparent 55%);
  border-radius: inherit;
  pointer-events: none;
}

/* Ring */
.ring-wrap { position: relative; display: inline-flex; align-items: center; justify-content: center; }
.ring-wrap svg { transform: rotate(-90deg); }
.ring-wrap circle { transition: stroke-dashoffset 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); }
.ring-label {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.ring-sub { font-size: 8px; text-transform: uppercase; letter-spacing: 0.18em; color: var(--text-3); font-weight: 600; }
.ring-val { font-size: 22px; font-weight: 700; color: var(--text-1); font-variant-numeric: tabular-nums; letter-spacing: -0.025em; }

/* ============================================================
   PILLAR CARD — flat panel with hairline separator
   ============================================================ */
.pillar-card {
  background: var(--bg-1);
  border: 1px solid var(--line-2);
  border-radius: 6px;
  padding: 11px 12px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
}
.pillar-card .pc-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.pillar-card .pc-name { font-size: 11px; font-weight: 600; color: var(--text-1); display: flex; align-items: center; gap: 6px; letter-spacing: -0.005em; }
.pillar-card .pc-lv { font-size: 10px; padding: 2px 6px; border-radius: 3px; font-variant-numeric: tabular-nums; font-weight: 700; letter-spacing: 0.02em; }
.pillar-card .pc-xp { display: flex; justify-content: space-between; font-size: 9px; color: var(--text-3); margin-top: 6px; font-variant-numeric: tabular-nums; font-weight: 500; }

/* Habit / Routine row — tactical list item */
.row-card {
  background: var(--bg-1);
  border: 1px solid var(--line-2);
  border-radius: 8px;
  padding: 13px;
  margin-bottom: 8px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.025);
}
.row-card .row-top { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
.row-card .row-icon {
  width: 36px; height: 36px; border-radius: 7px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.row-card .row-name { font-size: 15px; font-weight: 600; color: var(--text-1); line-height: 1.3; word-break: break-word; letter-spacing: -0.01em; }
.row-card .row-meta {
  display: flex; flex-wrap: wrap; gap: 4px 8px;
  font-size: 11px; color: var(--text-3); margin-top: 4px; font-weight: 500;
}
.row-card .row-actions {
  display: flex; justify-content: space-between; align-items: center;
  padding-top: 10px; border-top: 1px solid var(--line-1); gap: 8px;
}
.row-card .row-actions-left { display: flex; gap: 6px; }

/* Modal */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(0,0,0,0.85);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  display: flex; align-items: flex-end; justify-content: center; padding: 16px;
  animation: fadeIn 0.2s ease;
}
@media (min-width: 640px) { .modal-backdrop { align-items: center; } }
.modal {
  width: 100%; max-width: 440px;
  background: var(--bg-2);
  border: 1px solid var(--line-2);
  border-radius: 10px; padding: 20px;
  max-height: 85vh; overflow-y: auto;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.04),
    inset 0 -1px 0 rgba(0,0,0,0.8),
    0 24px 80px rgba(0,0,0,0.9),
    0 0 0 1px rgba(0,0,0,0.6);
  animation: slideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-head {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px;
}
.modal-head h3 { margin: 0; font-size: 17px; font-weight: 700; color: var(--text-1); letter-spacing: -0.02em; }
.modal-close {
  width: 28px; height: 28px; border-radius: 7px;
  background: var(--bg-3); border: 1px solid var(--line-1);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-2);
}
.modal label { font-size: 10px; color: var(--text-3); display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
.modal-form > div + div { margin-top: 16px; }

/* Floating XP */
.float-xp {
  position: fixed; bottom: 30%;
  font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
  pointer-events: none; z-index: 40;
  animation: floatUp 1.4s ease-out forwards;
  text-shadow: 0 0 12px currentColor;
}
@keyframes floatUp {
  0% { opacity: 0; transform: translate(-50%, 0) scale(0.7); }
  20% { opacity: 1; transform: translate(-50%, -20px) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -120px) scale(1); }
}

/* Full-screen overlays */
.fs-overlay {
  position: fixed; inset: 0; z-index: 60;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  background: rgba(0,0,0,0.75);
  animation: fadeIn 0.3s ease;
}
.fs-content {
  text-align: center; padding: 0 24px;
  animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes popIn { from { transform: scale(0.7) translateY(20px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
.fs-eyebrow { font-size: 10px; text-transform: uppercase; letter-spacing: 0.28em; color: var(--text-2); margin-bottom: 8px; font-weight: 600; }
.fs-big { font-size: 64px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text-1); line-height: 1; letter-spacing: -0.045em; }
.fs-sub { font-size: 12px; color: var(--text-2); margin-top: 12px; display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }

/* Tab content fade */
.tab-content {
  animation: tabIn 0.25s ease;
}
@keyframes tabIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.85); }
}

/* Shake for damage */
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-10px); }
  40% { transform: translateX(10px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(6px); }
}
.shake { animation: shake 0.5s; }

/* Volume chart bar */
.vol-bar { transition: height 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); min-height: 2px; border-radius: 2px 2px 0 0; }

/* Chat bubble */
.bubble {
  max-width: 85%; padding: 10px 14px; border-radius: 10px;
  font-size: 14px; line-height: 1.5; white-space: pre-line;
  word-wrap: break-word;
}
.bubble.user { background: var(--bg-3); border: 1px solid var(--line-2); color: var(--text-1); align-self: flex-end; }
.bubble.system { background: rgba(217,83,79,0.08); border: 1px solid rgba(217,83,79,0.25); color: var(--text-1); align-self: flex-start; }

/* Misc grid utils */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }

/* Day chip */
.day-chip {
  width: 100%; height: 32px; font-size: 10px; font-weight: 600;
  border-radius: 4px; border: 1px solid var(--line-2);
  background: var(--bg-1);
  color: var(--text-2); letter-spacing: 0.02em;
}
.day-chip.selected {
  background: linear-gradient(180deg, rgba(201,123,58,0.22), rgba(201,123,58,0.06));
  border-color: rgba(201,123,58,0.55);
  color: var(--accent-copper);
  box-shadow:
    inset 0 1px 0 rgba(201,123,58,0.28),
    0 0 12px rgba(201,123,58,0.20);
}

/* Set logger row */
.set-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.set-row input { padding: 6px 8px; font-size: 12px; text-align: center; font-weight: 600; background-color: var(--bg-3) !important; border-radius: 5px; }
.set-row .set-label { font-size: 10px; color: var(--text-3); width: 24px; font-weight: 600; }
.set-row .set-unit { font-size: 10px; color: var(--text-3); font-weight: 500; }

/* Progress segment — recessed track */
.seg-bar {
  display: flex; padding: 3px;
  background: var(--bg-0);
  border: 1px solid var(--line-2);
  border-radius: 7px;
  margin-bottom: 12px;
  box-shadow: inset 0 1px 4px rgba(0,0,0,0.7);
}
.seg-bar button {
  flex: 1; padding: 6px 12px; border-radius: 4px;
  background: transparent; border: none;
  font-size: 12px; font-weight: 600; letter-spacing: -0.005em;
  color: var(--text-3);
  transition: all 0.15s;
}
.seg-bar button.active {
  background: linear-gradient(180deg, rgba(201,123,58,0.22), rgba(201,123,58,0.06));
  border: 1px solid rgba(201,123,58,0.45);
  color: var(--accent-copper);
  box-shadow:
    inset 0 1px 0 rgba(201,123,58,0.25),
    0 0 8px rgba(201,123,58,0.15);
}

/* Scroll chips */
.chip-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin: -4px; padding-left: 4px; padding-right: 4px; }
.chip-scroll::-webkit-scrollbar { display: none; }

/* Section titles */
.section-title { font-size: 14px; font-weight: 700; color: var(--text-1); margin: 0; letter-spacing: -0.02em; }

/* ============================================================
   DATA TYPOGRAPHY UTILITIES
   ============================================================ */
.data-eyebrow {
  font-size: 9px; text-transform: uppercase; letter-spacing: 0.16em;
  font-weight: 600; color: var(--text-3);
}
.data-value {
  font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums;

})();

const xpForLevel = (lvl) => Math.floor(100 * Math.pow(lvl, 1.5));
const hoursSince = (ts) => (Date.now() - ts) / 36e5;
const daysSince = (ts) => (Date.now() - ts) / 86400000;
const dayKey = (d = new Date()) => d.toISOString().slice(0,10);

// Calendar days between two timestamps. Returns the integer difference.
// e.g. yesterday → today = 1, today → today = 0.
function calendarDaysSince(ts) {
  if (!ts) return Infinity;
  const a = new Date(ts); a.setHours(0,0,0,0);
  const b = new Date();   b.setHours(0,0,0,0);
  return Math.round((b - a) / 86400000);
}

// Habit "due today" check — calendar-based for daily habits, hours-based for weekly.
// If a habit has a `days` array (0=Sun..6=Sat), it's only due on those weekdays.
function habitScheduledToday(h) {
  if (!Array.isArray(h.days) || h.days.length === 0) return true; // no restriction
  return h.days.includes(new Date().getDay());
}
function habitDueToday(h) {
  if (!habitScheduledToday(h)) return false;
  if (!h.lastCheckIn) return true;
  if (h.frequency === 'daily') {
    return calendarDaysSince(h.lastCheckIn) >= 1;
  }
  // Weekly: use rolling 168-hour window
  return hoursSince(h.lastCheckIn) >= 168 * 0.9;
}

// Streak still safe? Daily habits keep streaks across one missed calendar day boundary
// (i.e. checked in yesterday counts as 'still going'). Broken if 2+ days missed.
// For day-of-week scheduled habits, only scheduled days count against the streak —
// e.g. a Mon/Wed/Fri habit doesn't break if you skip a Tuesday.
function habitStreakBroken(h) {
  if (!h.lastCheckIn || h.streak === 0) return false;
  if (h.frequency === 'daily') {
    if (Array.isArray(h.days) && h.days.length > 0) {
      // Count how many scheduled days have passed since last check-in
      const lastDay = new Date(h.lastCheckIn);
      lastDay.setHours(0,0,0,0);
      const today = new Date();
      today.setHours(0,0,0,0);
      let scheduledMissed = 0;
      for (let d = new Date(lastDay.getTime() + 86400000); d < today; d = new Date(d.getTime() + 86400000)) {
        if (h.days.includes(d.getDay())) scheduledMissed += 1;
      }
      return scheduledMissed >= 2;
    }
    return calendarDaysSince(h.lastCheckIn) >= 2;
  }
  // Weekly: original rule — broken if > 1.5x the period
  return hoursSince(h.lastCheckIn) > 168 * 1.5;
}

// Continuation check used by checkInHabit to decide if streak increments or resets.
// For daily habits, you continue if your last check-in was today or yesterday.
function habitStreakContinues(h) {
  if (!h.lastCheckIn) return false;
  if (h.frequency === 'daily') {
    return calendarDaysSince(h.lastCheckIn) <= 1;
  }
  return hoursSince(h.lastCheckIn) < 168 * 1.5;
}

const startOfWeek = () => {
  const d = new Date();
  const day = d.getDay();
  const diff = day === 0 ? 6 : day - 1;
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() - diff);
  return d.getTime();
};
const endOfWeek = () => {
  const d = new Date(startOfWeek());
  d.setDate(d.getDate() + 6);
  d.setHours(23,59,59,999);
  return d.getTime();
};

const calcTotalLevel = (pillars) => {
  const lvls = Object.values(pillars).map(p => p.level);
  return Math.max(1, Math.floor(lvls.reduce((a,b) => a+b, 0) / lvls.length));
};

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

      // Cardio plan — array of { id, name, value, unit, muscles[] }

      r.cardio = r.cardio
        .filter(c => c && typeof c === 'object' && typeof c.name === 'string')
        .map(c => ({
          id: c.id || `c${Date.now()}${Math.random().toString(36).slice(2,5)}`,
          name: c.name.slice(0, 40),
          value: parseFloat(c.value) || 0,
          unit: ['min','km','mi'].includes(c.unit) ? c.unit : 'min',
          muscles: Array.isArray(c.muscles) ? c.muscles.filter(m => MUSCLE_GROUPS[m]) : [],
        }));
    });
    // Bodyweight default
    if (typeof merged.bodyweight !== 'number' || merged.bodyweight < 20 || merged.bodyweight > 250) {
      merged.bodyweight = 75;
    }
    // muscleHits: { muscleKey: [{ts, sessionId}, ...] }
    if (!merged.muscleHits || typeof merged.muscleHits !== 'object' || Array.isArray(merged.muscleHits)) {
      merged.muscleHits = {};
    }
    Object.keys(merged.muscleHits).forEach(k => {
      if (!MUSCLE_GROUPS[k] || !Array.isArray(merged.muscleHits[k])) {
        delete merged.muscleHits[k];
      }
    });
    if (!merged.prs || typeof merged.prs !== 'object') merged.prs = {};

    return merged;
  } catch (e) {
    console.error('State load failed, using defaults:', e);
    return defaultState();
  }
})();

let UI = {
  tab: 'dashboard',
  modal: null,        // {kind, data}
  gymView: { kind: 'list' },
  questFilter: 'all',
  questView: 'all',
  selectedMuscle: null,    // muscle group highlighted in the body diagram

};

function persist() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); } catch {}
}

function discipline() {
  const cutoff = Date.now() - 30 * 86400000;
  const recent = S.disciplineEvents.filter(e => e.ts >= cutoff);
  if (recent.length === 0) return 100;
  const c = recent.filter(e => e.type === 'completion').length;
  return Math.round((c / recent.length) * 100);
}

/* ============================================================
   XP / LEVELING
   ============================================================ */
function applyXpToPillar(pillarKey, amount) {
  const p = { ...S.pillars[pillarKey] };
  let xp = p.xp + amount;
  let level = p.level;
  const ups = [];
  let needed = xpForLevel(level);
  let safety = 0;
  while (xp >= needed && safety < 50) {
    xp -= needed;
    level += 1;
    ups.push({ pillar: pillarKey, newLevel: level });
    needed = xpForLevel(level);
    safety++;
  }
  S.pillars[pillarKey] = { level, xp };
  return ups;
}

// Returns the ISO week key, e.g. '2026-W19', for use in weeklyXp tracking
function weekKey(d) {
  d = d ? new Date(d) : new Date();
  const dt = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = (dt.getUTCDay() + 6) % 7;
  dt.setUTCDate(dt.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(dt.getUTCFullYear(), 0, 4));
  const diff = (dt - firstThursday) / 86400000;
  const week = 1 + Math.round((diff - 3 + ((firstThursday.getUTCDay() + 6) % 7)) / 7);
  return `${dt.getUTCFullYear()}-W${String(week).padStart(2, '0')}`;
}

function shieldActive() {
  return (S.shieldActiveUntil || 0) > Date.now();
}

function awardXp(baseXp, pillarKey, applyMult = true) {
  if (!PILLARS[pillarKey]) pillarKey = 'intellect'; // safe fallback
  const m = applyMult ? disciplineMultiplier(discipline()).mult : 1;
  const finalXp = Math.max(0, Math.round(baseXp * m));
  const ups = applyXpToPillar(pillarKey, finalXp);
  S.lifetimeXp += finalXp;
  S.credits = (S.credits || 0) + finalXp;

  // Track weekly XP for Shadow Protocol
  const wk = weekKey();
  S.weeklyXp[wk] = (S.weeklyXp[wk] || 0) + finalXp;

  if (ups.length > 0) {
    const last = ups[ups.length - 1];
    showLevelUp(last.pillar, last.newLevel);
  }
  return finalXp;
}

function checkPerfectDay() {
  const today = dayKey();
  if (S.perfectDays.includes(today)) return;
  if (S.habits.length === 0) return;
  const allDone = S.habits.every(h => h.lastCheckIn && !habitDueToday(h));
  if (!allDone) return;
  S.perfectDays.push(today);
  const per = Math.floor(XP.PERFECT_DAY / 4);
  Object.keys(PILLARS).forEach(p => awardXp(per, p, true));
  spawnFloat(`PERFECT DAY +${XP.PERFECT_DAY} XP`, '#C97B3A');
  S.log.unshift({ id: `${Date.now()}-perfect`, ts: Date.now(), type: 'victory',
    text: `🌟 PERFECT DAY · all tasks cleared · +${XP.PERFECT_DAY} XP` });
}

/* ============================================================
   ACTIONS
   ============================================================ */
function checkInHabit(id) {
  const h = S.habits.find(x => x.id === id);
  if (!h) return;
  if (!habitDueToday(h)) return; // already done today

  // Snapshot pre-mutation state so we can undo a misclick
  const snapshot = {
    habitId: id,
    prevStreak: h.streak,
    prevLastCheckIn: h.lastCheckIn,
    prevPillar: { ...S.pillars[h.pillar] },
    prevCredits: S.credits || 0,
    prevLifetimeXp: S.lifetimeXp || 0,
    prevWeeklyXp: { ...(S.weeklyXp || {}) },
    prevPerfectDays: [...(S.perfectDays || [])],
    prevDisciplineCount: (S.disciplineEvents || []).length,
    ts: Date.now(),
  };

  const continued = habitStreakContinues(h);
  const newStreak = continued ? h.streak + 1 : 1;
  const streakMult = newStreak >= 7 ? 1.5 : newStreak >= 3 ? 1.25 : 1;
  const habitXp = (typeof h.xp === 'number' && h.xp > 0) ? h.xp : XP.HABIT;
  const baseXp = Math.round(habitXp * streakMult);

  const p = PILLARS[h.pillar];
  const display = awardXp(baseXp, h.pillar);
  spawnFloat(`+${display} XP`, p.color);

  h.streak = newStreak;
  h.lastCheckIn = Date.now();

  S.disciplineEvents = S.disciplineEvents
    .filter(e => e.ts >= Date.now() - 30*86400000)
    .concat({ ts: Date.now(), type: 'completion', source: 'habit', habitId: id });

  const logEntryId = `${Date.now()}-${id}`;
  S.log.unshift({ id: logEntryId, ts: Date.now(), type: 'gain',
    text: `"${h.name}" complete · +${display} XP${streakMult>1?` · ${newStreak}🔥`:''}` });
  S.log = S.log.slice(0, 200);

  // Save undo handle on UI — last action eligible for one-tap undo
  UI.lastHabitAction = { ...snapshot, logEntryId, habitName: h.name };

  checkPerfectDay();
  persist();
  render();
}

// Undo the most recent habit check-in. Only works for the last action,
// and only within a short window after the tap.
function undoHabitCheckIn() {
  const a = UI.lastHabitAction;
  if (!a) return;
  const h = S.habits.find(x => x.id === a.habitId);
  if (!h) { UI.lastHabitAction = null; return; }
  // Restore habit fields
  h.streak = a.prevStreak;
  h.lastCheckIn = a.prevLastCheckIn;
  // Restore stats
  S.pillars[h.pillar] = { ...a.prevPillar };
  S.credits = a.prevCredits;
  S.lifetimeXp = a.prevLifetimeXp;
  S.weeklyXp = { ...a.prevWeeklyXp };
  S.perfectDays = [...a.prevPerfectDays];
  // Strip the discipline event we added (just remove the most recent one matching this habit)
  if (Array.isArray(S.disciplineEvents)) {
    // Trim back to the count we had before, in case multiple events came in
    while (S.disciplineEvents.length > a.prevDisciplineCount) {
      S.disciplineEvents.pop();
    }
  }
  // Remove the log entry we added
  if (a.logEntryId) {
    S.log = S.log.filter(e => e.id !== a.logEntryId);
  }
  UI.lastHabitAction = null;
  spawnFloat(`Undone: ${a.habitName}`, 'rgba(255,255,255,0.85)');
  persist();
  render();
}
window.undoHabitCheckIn = undoHabitCheckIn;

function addHabit(data) {

// Reorder an exercise inside a routine by one step (dir = -1 up, +1 down).
// Silently no-ops if the exercise is already at the boundary.
function moveExercise(routineId, exId, dir) {
  const r = S.routines.find(x => x.id === routineId);
  if (!r || !Array.isArray(r.exercises)) return;
  const idx = r.exercises.findIndex(e => e.id === exId);
  if (idx < 0) return;
  const target = idx + dir;
  if (target < 0 || target >= r.exercises.length) return;
  const [item] = r.exercises.splice(idx, 1);
  r.exercises.splice(target, 0, item);
  persist(); render();
}

// Effective load per rep, accounting for bodyweight exercises.
// - weighted: just the bar weight
// - bodyweight: bodyweight + added weight (added can be negative for assistance)
function effectiveLoad(exercise, weightInput) {
  const w = (typeof weightInput === 'number') ? weightInput : parseFloat(weightInput) || 0;
  if (exercise && exercise.type === 'bodyweight') {
    return Math.max(0, (S.bodyweight || 75) + w);
  }
  return w;
}

function logSession(routineId, exerciseSets, opts) {
  const now = Date.now();
  const routine = S.routines.find(r => r.id === routineId);
  const notes = (opts && typeof opts.notes === 'string') ? opts.notes.trim().slice(0, 500) : '';
  let rating = (opts && typeof opts.rating === 'number') ? opts.rating : null;
  if (rating !== null && (rating < 1 || rating > 5)) rating = null;
  const session = { id: `s-${now}`, routineId, ts: now, completed: true, exercises: exerciseSets, notes, rating };

  let totalVolume = 0;
  const prList = [];
  const hitMuscles = new Set();
  // muscleVolume: how much effective volume each muscle absorbed in THIS session
  const muscleVolume = {};

  Object.entries(exerciseSets).forEach(([exId, sets]) => {
    const ex = routine?.exercises.find(e => e.id === exId);
    if (!ex) return;
    // Allow negative weights for assisted bodyweight movements
    const minWeight = ex.type === 'bodyweight' ? -1000 : 0;
    const valid = sets.filter(s => s.reps > 0 && s.weight >= minWeight);
    if (!valid.length) return;

    // Track effective loads for PR purposes
    const effLoads = valid.map(s => effectiveLoad(ex, s.weight));
    const topEffWeight = Math.max(...effLoads);
    // Volume uses effective load too — so bodyweight pulls accumulate real tonnage
    const vol = valid.reduce((sum, s, idx) => sum + s.reps * effLoads[idx], 0);
    totalVolume += vol;

    // Track which muscles got worked + how much volume they absorbed.
    // Volume is divided evenly across the muscles trained, then weighted by
    // primary/secondary priority (primary = first in list = 1.5x weight,
    // secondary = 0.75x). This matches how compounds actually fatigue muscles.
    if (Array.isArray(ex.muscles) && ex.muscles.length > 0) {
      ex.muscles.forEach((m, idx) => {
        hitMuscles.add(m);
        const priorityWeight = idx === 0 ? 1.5 : 0.75;
        const share = (vol / ex.muscles.length) * priorityWeight;
        muscleVolume[m] = (muscleVolume[m] || 0) + share;
      });
    }

    const exName = ex.name || 'Exercise';
    const existing = S.prs[exId] || { topWeight: 0, topVolume: 0, topWeightTs: 0, topVolumeTs: 0 };

    if (topEffWeight > existing.topWeight && existing.topWeight > 0) {
      S.prs[exId] = { ...existing, topWeight: topEffWeight, topWeightTs: now };
      prList.push({ exerciseName: exName, type: 'weight', value: Math.round(topEffWeight*10)/10, prev: Math.round(existing.topWeight*10)/10, isBodyweight: ex.type === 'bodyweight' });
    } else if (topEffWeight > 0 && existing.topWeight === 0) {
      S.prs[exId] = { ...existing, topWeight: topEffWeight, topWeightTs: now };
    }
    if (vol > existing.topVolume && existing.topVolume > 0) {
      S.prs[exId] = { ...(S.prs[exId] || existing), topVolume: vol, topVolumeTs: now };
      if (!prList.find(p => p.exerciseName === exName)) {
        prList.push({ exerciseName: exName, type: 'volume', value: Math.round(vol), prev: Math.round(existing.topVolume), isBodyweight: ex.type === 'bodyweight' });
      }
    } else if (vol > 0 && existing.topVolume === 0) {
      S.prs[exId] = { ...(S.prs[exId] || existing), topVolume: vol, topVolumeTs: now };
    }
  });

  // Track per-muscle hit history for recovery state.
  // When a subdivision (e.g. upperChest) is hit, also record the parent (chest)
  // so the overview state for the parent stays accurate.
  if (!S.muscleHits || typeof S.muscleHits !== 'object') S.muscleHits = {};
  const expandedVolumes = {};
  Object.keys(muscleVolume).forEach(m => {
    expandedVolumes[m] = muscleVolume[m];
    const parent = MUSCLE_PARENT[m];
    if (parent) {
      // Parent absorbs the full subdivision volume — back gets hit when lats are hit
      expandedVolumes[parent] = (expandedVolumes[parent] || 0) + muscleVolume[m];
    }
  });
  Object.entries(expandedVolumes).forEach(([m, vol]) => {
    if (!MUSCLE_GROUPS[m]) return;
    if (!Array.isArray(S.muscleHits[m])) S.muscleHits[m] = [];
    // Normalised load: volume × profile loadScale.
    // The profile.loadScale acts as a per-muscle calibration — smaller muscles
    // accumulate fatigue faster per unit of volume.
    const prof = profileFor(m);
    const load = Math.max(1, Math.round(vol * prof.loadScale));
    S.muscleHits[m].push({ ts: now, sessionId: session.id, load });
    // Keep last 200 hits per muscle
    if (S.muscleHits[m].length > 200) S.muscleHits[m] = S.muscleHits[m].slice(-200);
  });

  const baseGymXp = XP.GYM_SESSION + (prList.length * XP.PR_BONUS);
  const display = awardXp(baseGymXp, 'strength');
  spawnFloat(`+${display} XP`, '#D9534F');

  if (prList.length > 0) {
    showPR(prList[0]);
  }

  S.sessions.push(session);
  S.disciplineEvents = S.disciplineEvents
    .filter(e => e.ts >= now - 30*86400000)
    .concat({ ts: now, type: 'completion', source: 'gym', routineId });

  const routineName = routine?.name || 'Workout';
  prList.forEach(pr => S.log.unshift({
    id: `${now}-pr-${pr.exerciseName}`, ts: now, type: 'pr',
    text: `🏆 PR: ${pr.exerciseName} — ${pr.type === 'weight' ? `${pr.value}kg${pr.isBodyweight?' (effective)':''}` : `${pr.value} vol`} (was ${pr.prev || '0'})`,
  }));
  S.log.unshift({ id: `${now}-session`, ts: now, type: 'gain',
    text: `Logged "${routineName}" · vol ${Math.round(totalVolume)} · +${display} XP${prList.length?` (${prList.length} PR${prList.length>1?'s':''})`:''}` });
  S.log = S.log.slice(0, 200);

  UI.gymView = { kind: 'list' };
  persist(); render();
}

/* ============================================================
   DAILY TELEMETRY
   ============================================================ */
// Given a date key, count how many of the 5 daily targets were satisfied that day.
// Returns { count, total, items } where items is an ordered breakdown.
// The 5 targets are: tasks-all-done, calories-goal, protein-goal, workout-done-or-restday, body-recovered.
function computeDayStatus(key) {
  const items = [];
  // Tasks (habits): all cleared that day. We check by comparing lastCheckIn vs the day.
  // Since streaks reset on day change, we approximate by counting habits with lastCheckIn
  // that falls on that date. This isn't perfect for historical days but is right for
  // "yesterday" which is the primary use case.
  const dayStart = new Date(key + 'T00:00:00').getTime();
  const dayEnd = dayStart + 86400000;
  const habitsCount = (S.habits || []).length;
  let habitsDoneOnDay = 0;
  (S.habits || []).forEach(h => {
    if (h.lastCheckIn >= dayStart && h.lastCheckIn < dayEnd) habitsDoneOnDay += 1;
  });
  const tasksOk = habitsCount > 0 && habitsDoneOnDay === habitsCount;
  items.push({ id: 'tasks', ok: tasksOk, label: 'All tasks cleared' });

  // Calories on that day
  const nut = (S.nutrition && S.nutrition[key]) || { cals: 0, protein: 0 };
  const calsOk = nut.cals >= (S.nutritionGoals?.cals || 2500);
  items.push({ id: 'cals', ok: calsOk, label: 'Calorie goal hit' });

  // Protein on that day
  const proteinOk = nut.protein >= (S.nutritionGoals?.protein || 160);
  items.push({ id: 'protein', ok: proteinOk, label: 'Protein goal hit' });

  // Workout: either a session was completed that day, or it was a rest day
  const dow = new Date(dayStart).getDay();
  const scheduledRoutine = (S.routines || []).find(r => r.schedule?.includes(dow));
  const workoutDone = (S.sessions || []).some(s =>
    s.completed && dayKey(new Date(s.ts)) === key
  );
  const workoutOk = workoutDone || !scheduledRoutine;
  items.push({ id: 'workout', ok: workoutOk, label: workoutDone ? 'Workout complete' : 'Rest day' });

  // Body: no muscles were sore going into next morning. Since we can't reliably
  // reconstruct historical muscleHits recovery state, treat this as "sessions
  // logged in past 48h didn't leave muscles in the sore stage". Approximation
  // for a single-day retrospective: use the current sore count if key is yesterday.
  // For older days, fall back to always-ok.
  const yesterdayKey = dayKey(new Date(Date.now() - 86400000));
  let bodyOk = true;
  if (key === yesterdayKey) {
    // Count muscles that were hit within 24h of the day's end
    let soreCount = 0;
    if (S.muscleHits && typeof S.muscleHits === 'object') {
      Object.entries(S.muscleHits).forEach(([k, hits]) => {
        if (typeof MUSCLE_GROUPS !== 'undefined' && MUSCLE_GROUPS[k] && MUSCLE_GROUPS[k].parent) return;
        if (!Array.isArray(hits) || hits.length === 0) return;
        const lastTs = hits[hits.length - 1].ts;
        if (Date.now() - lastTs < 86400000) soreCount += 1;
      });
    }
    bodyOk = soreCount === 0;
  }
  items.push({ id: 'body', ok: bodyOk, label: bodyOk ? 'Body recovered' : 'Muscles still sore' });

  const count = items.filter(x => x.ok).length;
  return { count, total: items.length, items };
}

// ============ NUTRITION ============
function ensureNutritionDay(key) {
  if (!S.nutrition[key]) S.nutrition[key] = { cals: 0, protein: 0, entries: [] };
  return S.nutrition[key];
}

function addNutrition(cals, protein) {
  cals = Math.max(0, parseInt(cals) || 0);
  protein = Math.max(0, parseInt(protein) || 0);
  if (cals === 0 && protein === 0) return;
  const today = dayKey();
  const day = ensureNutritionDay(today);
  const beforeCals = day.cals;
  const beforeProtein = day.protein;
  day.cals += cals;
  day.protein += protein;
  day.entries.push({ ts: Date.now(), cals, protein });
  // Vitality XP for crossing daily targets — once per day
  if (beforeProtein < S.nutritionGoals.protein && day.protein >= S.nutritionGoals.protein) {
    const gained = awardXp(25, 'vitality');
    spawnFloat(`+${gained} XP · protein goal`, '#7AB17A');
  }
  if (beforeCals < S.nutritionGoals.cals && day.cals >= S.nutritionGoals.cals) {
    const gained = awardXp(20, 'vitality');
    spawnFloat(`+${gained} XP · calorie goal`, '#7AB17A');
  }
  persist();
  updateFuelInPlace();
  updatePillarsInPlace();
}

function undoLastNutrition() {
  const today = dayKey();
  const day = S.nutrition[today];
  if (!day || day.entries.length === 0) return;
  const last = day.entries.pop();
  day.cals = Math.max(0, day.cals - last.cals);
  day.protein = Math.max(0, day.protein - last.protein);
  persist();
  updateFuelInPlace();
}

function resetToday() {
  const today = dayKey();
  if (S.nutrition[today]) {
    delete S.nutrition[today];
    persist();
  }
  updateFuelInPlace();
}

function setNutritionGoals(cals, protein) {
  if (cals && cals > 0) S.nutritionGoals.cals = Math.max(500, Math.min(10000, parseInt(cals)));
  if (protein && protein > 0) S.nutritionGoals.protein = Math.max(10, Math.min(500, parseInt(protein)));
  persist(); render();
}

function addMealPreset(name, cals, protein) {
  name = (name || '').trim().slice(0, 40);

  protein = Math.max(0, parseInt(protein) || 0);
  if (!name) return false;
  if (cals === 0 && protein === 0) return false;
  if (!Array.isArray(S.mealPresets)) S.mealPresets = [];
  if (S.mealPresets.length >= 30) {
    spawnFloat('Preset limit reached (30)', '#D9534F');
    return false;
  }
  S.mealPresets.unshift({
    id: `mp-${Date.now()}${Math.random().toString(36).slice(2,5)}`,
    name, cals, protein,
  });
  persist();
  return true;
}

function removeMealPreset(id) {
  S.mealPresets = (S.mealPresets || []).filter(p => p.id !== id);

  addNutrition(p.cals, p.protein);

/* ============================================================
   DECAY TICK
   ============================================================ */
function decayTick() {
  const now = Date.now();
  let changed = false;
  const cutoff = now - 30 * 86400000;
  S.disciplineEvents = S.disciplineEvents.filter(e => e.ts >= cutoff);
  const shielded = shieldActive();

  if (now - S.lastDecayCheck > 30000) {
    S.habits.forEach(h => {
      if (h.lastCheckIn === 0) return;
      // Break streak if a full calendar day has elapsed without check-in (for daily),
      // or the 168h * 1.5 grace passed (for weekly).
      if (habitStreakBroken(h) && h.streak > 0) {
        const lost = h.streak;
        // Ice Shield consumes one charge to preserve the streak instead of breaking it.
        // Updates lastCheckIn to yesterday so the habit reads as "due today, streak alive."
        if ((S.iceShields || 0) > 0) {
          S.iceShields -= 1;
          h.lastCheckIn = now - 86400000; // backdate to keep streak alive but mark as due today
          h.lastFrozenAt = now;
          S.log.unshift({ id: `${now}-${h.id}-frozen`, ts: now, type: 'gain',
            text: `Streak Freeze used: "${h.name}" — ${lost}-day streak preserved. ${S.iceShields} freeze(s) left.` });
          changed = true;
          return; // skip damage entirely
        }
        const lost_h = h.streak;
        // Shield: no discipline event from missed habits
        if (!shielded) {
          S.disciplineEvents.push({ ts: now, type: 'miss', source: 'habit', habitId: h.id });
          S.log.unshift({ id: `${now}-${h.id}-miss`, ts: now, type: 'miss',
            text: `Missed "${h.name}" — streak of ${lost_h} broken.` });
        } else {
          S.log.unshift({ id: `${now}-${h.id}-shielded`, ts: now, type: 'gain',
            text: `Missed "${h.name}" — Tactical Shield absorbed the penalty.` });
        }
        h.streak = 0;
        changed = true;
      }
    });
    S.lastDecayCheck = now;
  }

  // Yesterday's missed gym
  const today = dayKey(new Date(now));
  const y = dayKey(new Date(now - 86400000));
  if (S.lastGymSkipCheck !== today) {
    const yDow = new Date(now - 86400000).getDay();
    const sched = S.routines.filter(r => r.schedule?.includes(yDow));
    sched.forEach(r => {
      const done = S.sessions.some(s => s.routineId === r.id && s.completed && dayKey(new Date(s.ts)) === y);
      if (!done) {
        if (!shielded) {
          S.disciplineEvents.push({ ts: now, type: 'miss', source: 'gym', routineId: r.id });
          S.log.unshift({ id: `${now}-${r.id}-skip`, ts: now, type: 'miss',
            text: `Skipped scheduled workout: "${r.name}".` });
        }
        changed = true;
      }
    });
    S.lastGymSkipCheck = today;
  }

  // Focus timer completion — only fire if timer is running AND not paused
  if (S.focusTimer && S.focusTimer.running && !S.focusTimer.paused && S.focusTimer.endsAt && now >= S.focusTimer.endsAt) {
    const mins = S.focusTimer.durationMins;
    if (isBreakDuration(mins)) {
      S.focusTimer = { running: false, paused: false, pausedRemainingMs: 0, endsAt: 0, durationMins: mins, startedAt: 0 };
      S.log.unshift({ id: `${now}-break`, ts: now, type: 'gain',
        text: `Break complete · ${mins} min · time to refocus` });
      showFocusComplete(mins, 0, true);
    } else {
      const baseXp = Math.max(5, mins);
      const gained = awardXp(baseXp, 'resolve');
      S.focusTimer = { running: false, paused: false, pausedRemainingMs: 0, endsAt: 0, durationMins: mins, startedAt: 0 };
      S.log.unshift({ id: `${now}-focus`, ts: now, type: 'gain',
        text: `Focus block complete · ${mins} min · +${gained} XP · +${gained} credits` });
      showFocusComplete(mins, gained, false);
    }
    changed = true;
  }

  S.log = S.log.slice(0, 200);
  if (changed) { persist(); render(); }
}

function attachHabitModalHandlers(initial) {
  let name = initial?.name || '';
  let pillar = initial?.pillar || 'strength';
  let frequency = initial?.frequency || 'daily';
  let xp = typeof initial?.xp === 'number' ? initial.xp : 15;
  let days = Array.isArray(initial?.days) ? initial.days.slice() : [];
  const updatePillarStyles = () => {
    document.querySelectorAll('.pillar-btn').forEach(btn => {
      const k = btn.dataset.pillar;
      const p = PILLARS[k];
      const sel = pillar === k;
      btn.style.background = sel ? p.soft : 'rgba(255,255,255,0.03)';
      btn.style.borderColor = sel ? p.color + '66' : 'rgba(255,255,255,0.07)';
      btn.style.color = sel ? p.color : 'rgba(255,255,255,0.7)';
    });
  };
  const updateFreqStyles = () => {
    document.querySelectorAll('.freq-btn').forEach(btn => {
      const f = btn.dataset.freq;
      const sel = frequency === f;
      btn.style.background = sel ? 'rgba(74,144,194,0.14)' : 'rgba(255,255,255,0.03)';
      btn.style.borderColor = sel ? 'rgba(156,63,44,0.45)' : 'rgba(255,255,255,0.07)';
      btn.style.color = sel ? '#C97B3A' : 'rgba(255,255,255,0.7)';
    });
    // Days block only meaningful for daily habits
    const daysBlock = document.getElementById('m-days-block');
    if (daysBlock) daysBlock.style.display = frequency === 'daily' ? '' : 'none';
  };
  const updateDayStyles = () => {
    document.querySelectorAll('.day-btn').forEach(btn => {
      const i = parseInt(btn.dataset.day);
      const sel = days.includes(i);
      btn.style.background = sel ? 'rgba(201,123,58,0.14)' : 'rgba(255,255,255,0.03)';
      btn.style.borderColor = sel ? 'rgba(201,123,58,0.45)' : 'rgba(255,255,255,0.07)';
      btn.style.color = sel ? '#C97B3A' : 'rgba(255,255,255,0.7)';
    });
    // Update the "N selected / Every day" label
    const label = document.querySelector('#m-days-block label span:last-child');
    if (label) label.textContent = days.length === 0 ? 'Every day' : `${days.length} selected`;
  };
  document.querySelectorAll('.pillar-btn').forEach(btn => {
    btn.onclick = () => { pillar = btn.dataset.pillar; updatePillarStyles(); };
  });
  document.querySelectorAll('.freq-btn').forEach(btn => {
    btn.onclick = () => { frequency = btn.dataset.freq; updateFreqStyles(); };
  });
  document.querySelectorAll('.day-btn').forEach(btn => {
    btn.onclick = () => {
      const i = parseInt(btn.dataset.day);
      const idx = days.indexOf(i);
      if (idx >= 0) days.splice(idx, 1);
      else days.push(i);
      updateDayStyles();
    };
  });
  // Initial style sync for frequency-driven visibility
  updateFreqStyles();
  const nameInput = document.getElementById('m-name');
  nameInput.addEventListener('input', e => name = e.target.value);
  // Keep slider + numeric input in sync
  const xpSlider = document.getElementById('m-xp');
  const xpNum = document.getElementById('m-xp-num');
  const clamp = v => Math.max(1, Math.min(100, parseInt(v) || 1));
  if (xpSlider) xpSlider.addEventListener('input', e => {
    xp = clamp(e.target.value);
    if (xpNum) xpNum.value = xp;
  });
  if (xpNum) xpNum.addEventListener('input', e => {
    xp = clamp(e.target.value);
    if (xpSlider) xpSlider.value = xp;
  });
  document.getElementById('m-save').onclick = () => {
    const groupVal = (document.getElementById('m-group')?.value || '').trim().slice(0, 24);
    // Weekly habits don't use the day picker
    const daysArg = frequency === 'daily' ? days : [];
    if (initial) updateHabit(initial.id, { name, pillar, frequency, xp, group: groupVal, days: daysArg });
    else addHabit({ name, pillar, frequency, xp, group: groupVal, days: daysArg });
    closeModal();
  };
  setTimeout(() => nameInput.focus(), 50);
}

    document.querySelectorAll('.tmpl-btn').forEach(b => {

function getBackupStats() {
  const habits = Array.isArray(S.habits) ? S.habits.length : 0;
  const sessions = Array.isArray(S.sessions) ? S.sessions.length : 0;
  const journal = (S.journal && Array.isArray(S.journal.entries)) ? S.journal.entries.length : 0;
  const totalLv = calcTotalLevel(S.pillars);
  return `LV ${totalLv} · ${habits} habits · ${sessions} sessions · ${journal} journal`;
}

window.backupData = function() {
  const btn = document.getElementById('backup-btn');
  const msg = document.getElementById('backup-msg');
  try {
    const data = JSON.stringify(S);
    const finalize = (label, success) => {
      if (msg) {
        msg.textContent = label;
        msg.style.color = success ? 'rgba(122,177,122,0.95)' : 'rgba(201,123,58,0.95)';
      }
    };
    // Try modern clipboard API first; fall back to textarea trick
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(data).then(
        () => finalize(`Copied · ${data.length.toLocaleString()} chars`, true),
        () => fallbackCopy(data, finalize)
      );
    } else {
      fallbackCopy(data, finalize);
    }
  } catch (e) {
    if (msg) {
      msg.textContent = 'Backup failed: ' + (e && e.message || e);
      msg.style.color = 'rgba(217,83,79,0.95)';
    }
  }
};

function fallbackCopy(text, done) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    done(ok ? `Copied · ${text.length.toLocaleString()} chars` : 'Copy failed — long-press the textarea below', ok);
    if (!ok) {
      // As a last resort, drop the text into the restore textarea so user can manually copy it
      const restore = document.getElementById('restore-text');
      if (restore) {
        restore.value = text;
        restore.placeholder = 'Long-press to select all and copy this text';
      }
    }
  } catch (e) {
    done('Copy failed: ' + (e && e.message || e), false);
  }
}

window.restoreData = function() {
  const ta = document.getElementById('restore-text');
  const msg = document.getElementById('restore-msg');
  if (!ta) return;
  const txt = (ta.value || '').trim();
  if (!txt) {
    if (msg) msg.textContent = 'Paste backup data first.';
    return;
  }
  let parsed;
  try {
    parsed = JSON.parse(txt);
  } catch (e) {
    if (msg) {
      msg.textContent = 'Invalid JSON. Make sure you pasted the entire backup.';
      msg.style.color = 'rgba(217,83,79,0.95)';
    }
    return;
  }
  if (!parsed || typeof parsed !== 'object') {
    if (msg) {
      msg.textContent = 'Backup data is not a valid object.';
      msg.style.color = 'rgba(217,83,79,0.95)';
    }
    return;
  }
  // Sanity check: at minimum should have pillars or habits to look like Foundry data
  if (!parsed.pillars && !parsed.habits) {
    if (msg) {
      msg.textContent = 'This doesn\'t look like Foundry backup data.';
      msg.style.color = 'rgba(217,83,79,0.95)';
    }
    return;
  }
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
    if (msg) {
      msg.textContent = 'Restored. Reloading...';
      msg.style.color = 'rgba(122,177,122,0.95)';
    }
    setTimeout(() => { location.reload(); }, 600);
  } catch (e) {
    if (msg) {
      msg.textContent = 'Restore failed: ' + (e && e.message || e);
      msg.style.color = 'rgba(217,83,79,0.95)';
    }
  }
};

   ============================================================ */
function ringHTML(value, max, color, opts = {}) {
  const size = opts.size || 110;
  const stroke = opts.stroke || 9;
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const pct = Math.max(0, Math.min(1, value / max));
  const id = `rg-${color.replace('#','')}-${size}-${Math.random().toString(36).slice(2,5)}`;
  return `
    <div class="ring-wrap" style="width:${size}px;height:${size}px">
      <svg width="${size}" height="${size}">
        <defs>
          <linearGradient id="${id}" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="${color}" stop-opacity="0.7"/>
            <stop offset="100%" stop-color="${color}" stop-opacity="0.95"/>
          </linearGradient>
        </defs>
        <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="${stroke}"/>
        <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#${id})" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct)}"/>
      </svg>
      <div class="ring-label">
        <div class="ring-sub">${opts.sublabel || ''}</div>
        <div class="ring-val">${opts.label != null ? opts.label : value}</div>
      </div>
    </div>`;
}

function statBarHTML(value, max, color, h = 6) {
  const pct = Math.max(0, Math.min(100, (value/max)*100));
  return `<div class="statbar" style="height:${h}px"><div style="width:${pct}%;background:${color}"></div></div>`;
}

function sparklineHTML(data, color, opts = {}) {
  if (!data || data.length === 0) return '';
  const w = opts.width || 100;
  const h = opts.height || 28;
  if (data.length === 1) data = [data[0], data[0]];
  const min = Math.min(...data, 0);
  const max = Math.max(...data, 1);
  const range = max - min || 1;
  const path = data.map((v,i) => {
    const x = (i / (data.length - 1)) * w;
    const y = h - ((v - min) / range) * h;
    return `${i===0?'M':'L'} ${x.toFixed(1)} ${y.toFixed(1)}`;
  }).join(' ');
  const fill = opts.fill !== false;
  const id = `sp-${color.replace('#','')}-${Math.random().toString(36).slice(2,6)}`;
  return `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" preserveAspectRatio="none">
      ${fill?`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
      </linearGradient></defs>
      <path d="${path} L ${w} ${h} L 0 ${h} Z" fill="url(#${id})"/>`:''}
      <path d="${path}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
}

function startFocusTimer(mins) {
  if (S.focusTimer.running) return;
  mins = parseFloat(mins);
  if (!isFinite(mins) || mins <= 0) mins = 25;
  // Clamp between 6 seconds (0.1 min) and 180 minutes
  mins = Math.max(0.1, Math.min(180, mins));
  // Round to 1 decimal so the display + math stay clean
  mins = Math.round(mins * 10) / 10;
  const now = Date.now();
  S.focusTimer = {
    running: true,
    paused: false,
    pausedRemainingMs: 0,
    endsAt: now + mins * 60000,
    durationMins: mins,
    startedAt: now,
  };
  persist(); render();
}
function pauseFocusTimer() {
  const t = S.focusTimer;
  if (!t.running || t.paused) return;
  const remaining = Math.max(0, t.endsAt - Date.now());
  S.focusTimer = { ...t, paused: true, pausedRemainingMs: remaining };
  persist(); render();
}
function resumeFocusTimer() {
  const t = S.focusTimer;
  if (!t.running || !t.paused) return;
  const remaining = t.pausedRemainingMs || 0;
  S.focusTimer = { ...t, paused: false, pausedRemainingMs: 0, endsAt: Date.now() + remaining };
  persist(); render();
}
function cancelFocusTimer() {
  S.focusTimer = { running: false, paused: false, pausedRemainingMs: 0, endsAt: 0, durationMins: S.focusTimer.durationMins || 25, startedAt: 0 };
  persist(); render();
}
window.pauseFocusTimer = pauseFocusTimer;
window.resumeFocusTimer = resumeFocusTimer;
function showFocusComplete(mins, xp, isBreak) {
  // Determine messaging — breaks get a softer, neutral palette
  const accent = isBreak ? 'rgba(122,177,122,0.85)' : 'rgba(201,123,58,0.85)';
  const label = isBreak ? 'Break complete' : 'Focus complete';
  const sub = isBreak
    ? `Take a breath — back to it when ready`
    : `+${xp} Resolve XP · +${xp} Credits`;
  showOverlay(`
    <div class="fs-overlay">
      <div class="fs-content">
        <div style="margin-bottom:12px;color:${accent}">${icon('clock', 56)}</div>
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.32em;color:${accent};margin-bottom:4px">${label}</div>
        <div style="font-size:30px;font-weight:600;color:rgba(255,255,255,0.95);margin-bottom:4px">${mins} minutes</div>
        <div style="font-size:14px;color:rgba(255,255,255,0.65)">${sub}</div>
      </div>
    </div>`, 2400);
}

            <input type="number" id="focus-custom-mins" inputmode="decimal" min="0.1" max="180" step="0.1" placeholder="Minutes (e.g. 1.5)" style="flex:1;text-align:center;font-variant-numeric:tabular-nums;padding:10px;font-size:13px" />

window.addFocusPreset = function() {
  const inp = document.getElementById('focus-new-preset-mins');

  const m = parseFloat(inp.value);
  if (!isFinite(m) || m <= 0 || m > 180) {

  // Round to 1 decimal for consistency with startFocusTimer's rounding
  const mins = Math.round(m * 10) / 10;
  if (!Array.isArray(S.focusPresets)) S.focusPresets = [];

  if (S.focusPresets.some(p => p.mins === mins)) {

  S.focusPresets.push({ mins });

  S.focusPresets.sort((a, b) => a.mins - b.mins);
  inp.value = '';
  persist(); render();
};
window.removeFocusPreset = function(mins) {

// Tick the timer display every second when the Focus tab is visible
let _focusInterval = null;
function startFocusUpdater() {
  if (_focusInterval) return;
  _focusInterval = setInterval(() => {
    if (UI.tab !== 'focus') return;
    if (!S.focusTimer.running) return;
    if (S.focusTimer.paused) return; // freeze display while paused
    const now = Date.now();
    if (now >= S.focusTimer.endsAt) {
      decayTick(); // will trigger completion
      return;
    }
    const remainingMs = Math.max(0, S.focusTimer.endsAt - now);
    const remainingSec = Math.floor(remainingMs / 1000);
    const mm = Math.floor(remainingSec / 60);
    const ss = remainingSec % 60;
    const timeStr = `${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
    const timeEl = document.getElementById('focus-time');
    if (timeEl) timeEl.textContent = timeStr;
    const ringEl = document.getElementById('focus-ring');
    if (ringEl) {
      const totalMs = S.focusTimer.durationMins * 60000;
      const pct = 1 - (remainingMs / totalMs);
      const c = 2 * Math.PI * ((240 - 14) / 2);
      ringEl.setAttribute('stroke-dashoffset', String(c * (1 - pct)));
    }
  }, 1000);
}

// Deduct XP from a pillar without going below current-level minimum.
// Levels are never lost; only progress toward the next level is. Lifetime XP
// is unaffected (it's "lifetime earned"). Credits already in your balance
// are also not clawed back.
function deductXp(amount, pillarKey) {
  if (!PILLARS[pillarKey]) pillarKey = 'resolve';
  amount = Math.max(0, parseInt(amount) || 0);
  if (amount === 0) return 0;
  const p = S.pillars[pillarKey] || { level: 1, xp: 0 };
  const actual = Math.min(p.xp, amount);
  p.xp = Math.max(0, p.xp - amount);
  S.pillars[pillarKey] = p;
  return actual;
}

// Vice tier penalty matrix
const VICE_TIERS = {
  minor:    { label: 'Minor',    hp: 5,  xp: 10, discMisses: 1, color: '#C97B3A', bg: 'rgba(201,150,100,0.12)', border: 'rgba(201,150,100,0.35)' },
  major:    { label: 'Major',    hp: 15, xp: 25, discMisses: 1, color: '#D9534F', bg: 'rgba(217,83,79,0.12)',  border: 'rgba(217,83,79,0.35)' },
  critical: { label: 'Critical', hp: 30, xp: 50, discMisses: 3, color: '#B22222', bg: 'rgba(178,34,34,0.18)',  border: 'rgba(178,34,34,0.5)' },
};

function addVice(name, tier) {
  name = (name || '').trim();
  if (!name) return;
  if (S.vices.length >= 50) return;
  if (!VICE_TIERS[tier]) tier = 'major';
  S.vices.unshift({
    id: `v-${Date.now()}${Math.random().toString(36).slice(2,5)}`,
    name,
    tier,
    createdAt: Date.now(),
    totalSlips: 0,
    lastSlip: 0,
  });
  persist(); render();
}

function removeVice(id) {
  S.vices = S.vices.filter(v => v.id !== id);
  persist(); render();
}

function slipVice(id) {
  const v = S.vices.find(x => x.id === id);
  if (!v) return;
  const now = Date.now();
  const shielded = shieldActive();
  const tier = VICE_TIERS[v.tier] || VICE_TIERS.major;

  // Resolve XP penalty ALWAYS applies (even with shield active)
  const xpDeducted = deductXp(tier.xp, 'resolve');
  spawnFloat(`−${xpDeducted} Resolve XP`, tier.color);

  // Discipline penalties only apply if shield is NOT active
  if (!shielded) {
    triggerShake();
    // Heavier tiers stamp multiple discipline misses so the bar drops more
    for (let i = 0; i < tier.discMisses; i++) {
      S.disciplineEvents.push({ ts: now + i, type: 'miss', source: 'vice', viceId: id });
    }
  }

  v.totalSlips = (v.totalSlips || 0) + 1;
  v.lastSlip = now;

  S.log.unshift({
    id: `${now}-vice-${id}`,
    ts: now,
    type: shielded ? 'gain' : 'miss',
    text: shielded
      ? `${tier.label} slip: "${v.name}" — shield absorbed HP/discipline. −${xpDeducted} Resolve XP.`
      : `${tier.label} slip: "${v.name}" — −${hpDmg} HP · −${xpDeducted} Resolve XP · discipline hit.`,
  });
  S.log = S.log.slice(0, 200);

  persist(); render();
}

window.addVice = addVice;
window.removeVice = removeVice;
window.slipVice = slipVice;

  const inp = document.getElementById('new-vice-input');

function addJournalEntry(text, rating) {
  text = (text || '').trim();
  if (!text) return;
  // Sanitize rating: must be integer 1–5, otherwise null
  let r = parseInt(rating);
  if (!isFinite(r) || r < 1 || r > 5) r = null;
  S.journal.entries.unshift({ ts: Date.now(), text, rating: r });
  S.journal.entries = S.journal.entries.slice(0, 500);
  const gained = awardXp(25, 'resolve');
  spawnFloat(`+${gained} XP · journal`, '#C97B3A');
  S.log.unshift({ id: `${Date.now()}-journal`, ts: Date.now(), type: 'gain',
    text: `Journal entry logged · +${gained} Resolve XP` });
  S.log = S.log.slice(0, 200);
  persist();

// Hash a PIN with SHA-256, hex-encoded. Used by both the Journal and the
// Physique gallery (they share a single pinHash on S.journal). Falls back to
// a deterministic small hash if SubtleCrypto isn't available (e.g. file://
// schemes on some old WebViews).
async function hashPin(pin) {
  try {
    const enc = new TextEncoder().encode(String(pin));
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  } catch {
    let h = 0;
    String(pin).split('').forEach(c => { h = ((h << 5) - h) + c.charCodeAt(0); h |= 0; });
    return String(h);
  }
}

async function trySetJournalPin(pin) {
  if (!/^\d{6}$/.test(String(pin))) {
    return { ok: false, msg: 'PIN must be exactly 6 digits.' };
  }
  S.journal.pinHash = await hashPin(pin);
  S.journal.lastUnlock = Date.now();
  persist();
  return { ok: true };
}

async function tryUnlockJournal(pin) {
  if (!S.journal.pinHash) return { ok: false, msg: 'No PIN set.' };
  const h = await hashPin(pin);
  if (h === S.journal.pinHash) {
    S.journal.lastUnlock = Date.now();
    persist();
    return { ok: true };
  }
  return { ok: false, msg: 'Wrong PIN.' };
}

function journalUnlocked() {
  // Stay unlocked for 5 minutes after a correct PIN
  return S.journal.lastUnlock && (Date.now() - S.journal.lastUnlock < 5 * 60000);
}

// Compress an image file to a JPEG dataURL at given max dimension + quality.
// localStorage has a ~5MB total quota — each photo must be <300kb to keep state safe.
async function compressPhoto(file, maxDim = 1280, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Read failed'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Decode failed'));
      img.onload = () => {
        try {
          // Scale down while preserving aspect ratio
          let w = img.naturalWidth, h = img.naturalHeight;
          if (w > maxDim || h > maxDim) {
            if (w >= h) { h = Math.round(h * maxDim / w); w = maxDim; }
            else { w = Math.round(w * maxDim / h); h = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL('image/jpeg', quality);
          resolve(dataUrl);
        } catch (e) { reject(e); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function addPhysiquePhoto(file, note) {
  if (!file) return false;
  // Hard cap: 10MB raw file (we'll compress it heavily)
  if (file.size > 10 * 1024 * 1024) {
    spawnFloat('File too large (>10MB)', '#D9534F');
    return false;
  }
  try {
    let dataUrl = await compressPhoto(file, 1280, 0.72);
    // If still big, try a second pass with smaller dims
    if (dataUrl.length > 350 * 1024) {
      dataUrl = await compressPhoto(file, 960, 0.65);
    }
    if (dataUrl.length > 500 * 1024) {
      dataUrl = await compressPhoto(file, 720, 0.55);
    }
    if (!Array.isArray(S.physiquePhotos)) S.physiquePhotos = [];
    S.physiquePhotos.unshift({
      id: `ph-${Date.now()}${Math.random().toString(36).slice(2,5)}`,
      ts: Date.now(),
      image: dataUrl,
      note: (note || '').trim().slice(0, 80),
    });
    // Hard cap: 60 photos. After that, the oldest auto-drop to protect localStorage.
    if (S.physiquePhotos.length > 60) S.physiquePhotos = S.physiquePhotos.slice(0, 60);
    try {
      persist();
    } catch (e) {
      // Quota exceeded — pop the new photo back off and warn
      S.physiquePhotos.shift();
      spawnFloat('Storage full · delete old photos', '#D9534F');
      return false;
    }
    spawnFloat('Photo logged', '#C97B3A');
    return true;
  } catch (e) {
    spawnFloat('Photo error', '#D9534F');
    return false;
  }
}

          <span style="font-size:12px;font-weight:600;color:#7AB17A;font-variant-numeric:tabular-nums;margin-left:2px" id="shadow-you-xp">${cur.toLocaleString()}</span>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <span style="font-size:12px;font-weight:500;color:rgba(255,255,255,0.6);font-variant-numeric:tabular-nums" id="shadow-shadow-xp">${shadow.toLocaleString()}</span>
          <span style="font-size:11px;color:rgba(255,255,255,0.55)">Shadow</span>
